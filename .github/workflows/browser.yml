name: Demand map browser regression
on:
  pull_request:
    paths:
      - index.html
      - tests/browser.cjs
      - .github/workflows/browser.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Record actual browser fonts before changes
        run: node tests/browser.cjs --font-before
      - name: Install standard Ubuntu Japanese fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo timeout --signal=TERM --kill-after=10s 180s apt-get --download-only install --no-install-recommends -y fonts-noto-cjk
          sudo apt-get --no-download install --no-install-recommends -y fonts-noto-cjk
          fc-cache -f
          dpkg-query -W fonts-noto-cjk | tee browser-evidence/font-package.txt
      - name: Test installed Chrome with sandbox enabled
        run: node tests/browser.cjs
      - name: Retain public UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: browser-evidence/
          if-no-files-found: ignore
