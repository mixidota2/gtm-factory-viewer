name: Demand map browser regression
on:
  pull_request:
    paths:
      - index.html
      - data/water-quantity/**
      - tests/**
      - .github/workflows/browser.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test page lifecycle without browser
        run: node tests/test_page_lifecycle.cjs
      - name: Test route transition readiness
        run: node tests/test_wait_for_route.cjs
      - name: Test observation metadata search
        run: node tests/test_observation_search.cjs
      - name: Test downloadable data HTTP contract
        run: node tests/test_static_server.cjs
      - name: Test isolated font installer and failure handling
        run: python3 tests/test_ci_fonts.py
      - name: Install pinned browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Record actual browser fonts before changes
        run: node tests/browser.cjs --font-before
      - name: Install standard Ubuntu Japanese fonts
        timeout-minutes: 7
        run: bash tests/install_ci_fonts.sh
      - name: Test installed Chrome with sandbox enabled
        run: node tests/browser.cjs
      - name: Retain public UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: browser-evidence/
          if-no-files-found: ignore
