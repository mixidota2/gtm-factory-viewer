<script id="snapshot-data" type="application/json">{"sources": {"coverage.md": {"text": "# Market coverage map\n\n見た／薄い／まだ、を分野単位で残す。地図が薄いのに具体に寄らない。\n更新: 2026-09-07（空分野パス追加）\n\n凡例: まだ=ほぼ未着手 / 薄い=キーワード一度触れた程度 / 見た=信号あり・深掘り可\n\n| 分野 | 状態 | メモ |\n| --- | --- | --- |\n| エージェント向けdevtools | 見た | dif.sh / Ponytail / 試行ログ / eval。深掘り候補あり |\n| 日本・インボイス／会計周辺 | 見た | 受領照合・発行側。制度要因あり |\n| フリーランス運用 | 薄い | ポータル・追い込み・スコープ。個別深掘りは地図が埋まってから |\n| JP中小×生成AIセキュリティ | 薄い | 貼る前マスキング需要。製品も出始め |\n| 医療・クリニック | 薄い | 小規模診療の事務AIは需要あるがHIPAA等で重い。カテゴリ把握のみ |\n| 教育・学習塾 | 薄い | EdTechは統合・セキュリティ・料金の話。塾の料金ルールは隙間っぽいが一次薄い |\n| 不動産・賃貸管理 | 薄い | 小規模大家向けツールが伸びてる説。PM向けAIも。一次はこれから |\n| 小売・EC | 薄い | 商品マスタ／問い合わせ自動化の話。中堅向けが多く個人開発向きかは不明 |\n| 物流 | 薄い | 2026改正物流効率化法で荷待ちデータ・定期報告。制度要因あり。専用SaaSも出始め |\n| 人事・労務 | 薄い | 弥生など大手が寄せてる。隙間の有無は未確認 |\n| 建設 | 薄い | 施工管理アプリ未導入多い／定着が壁。多機能より現場が使える薄いものが論点 |\n| 介護 | 薄い | 人手不足＋記録ソフト半数近く未導入。環境・定着が壁。既存介護ソフト強い |\n| 士業（弁護士・税理士等） | 薄い | プロジェクト型ERP等の文脈で触れた程度。一次は薄い |\n| 飲食・店舗 | 薄い | 食品製造の省力化は政府プランあり。店舗オペの一次は薄い |\n| 製造 | 薄い | 人手不足・属人化。基幹／生産管理は既存が厚い。スモールスタート話が多い |\n| 美容・サロン | 薄い | 予約・POS・カルテは既存多数。課題は集客コストと事務。隙間は狭い印象 |\n| 農業 | 薄い | 高齢化・コスト・通信。スマート農業は補助金前提が多く、小規模は普及限定 |\n| エネルギー／公共 | 薄い | 自治体標準化・ガバクラが本丸。調達は重い。DMPで中小参入の話はあるが工場向きではない |\n\n## 調査配分（固定）\n- まだ／薄い分野をなめる: だいたい7割\n- 既に見た分野の深掘り: 3割まで\n- どう作るかの細部は、地図がある程度埋まるまで抑える\n\n## 一段落メモ（2026-09-07）\n\n### 相対的に厚い（既存・制度・規制で入りにくい）\n- エージェントdevtools（ただし既にプレイヤー多い）\n- インボイス／会計周辺（大手・制度対応プロダクトあり）\n- 物流（制度はあるが専用SaaS出始め）\n- 美容（予約・POSが飽和気味）\n- 公共／自治体（標準化・調達が重い）\n- 製造・介護（既存ソフト＋定着問題）\n\n### 相対的に薄い／メモ価値あり（一次はまだ弱い）\n- 不動産・小規模大家（紙Excel置き換えの余地、要一次）\n- 教育・塾の料金まわり（二次メモ、要一次）\n- 農業の超小規模向け軽い事務（普及は遅いが大手スマート農業とは別レイヤの可能性）\n\n### 「無い」より「定着しない／余裕がない」\n- 建設、介護\n\n### 今の工場（安く・早く・作る判断は後）との距離\n- 医療（規制）、公共（調達）、小売エージェント（中堅金額）、製造基幹 → 遠い\n", "modified": "2026-09-07T03:17:50.179230+00:00"}, "hypotheses.md": {"text": "# Hypotheses\n\n仮説・検証結果・振り返り・方針修正をここに残す。新しいものから。\n\n## 運用メモ\n- いまは調査優先（作らない）\n- 各サイクルで「いまの仮説」「何を見たか」「仮説どう変わったか」「次の方針」を短く追記\n\n## 2026-09-07 — 初回仮説（ストック起点）\n\n### H1. 「アカウント不要で repo に置けるエージェント向けツール」は一時的な話題じゃなく、しばらく続く\n- 根拠: dif.sh が 2026-09-05 に PH1位（約359↑）。作者の話も「エージェントがアカウント付きを諦める」が起点。\n- 弱いところ: まだ1日の盛り上がり。1–2週間後に追随プロダクトや議論が続くか未確認。\n- 含意: 作るならこの系統は有望だが、feature flag そのものではなく「試行・決定の履歴」など被らない切り口が要る。今は作らず、動向を追う。\n\n### H2. 日本の「受領インボイスの確認」は、勢いより構造要因のほうが強い\n- 根拠: 比較記事が受領側を新しい需要として強調。2026-09以降の経過措置 80%→50%。\n- 弱いところ: 検索ボリュームや「誰がいくら払うか」の一次データが薄い。freee等への取り込みで隙間が消える可能性。\n- 含意: 002は「作る候補」より先に、市場の穴の広さを測る対象。\n\n### H3. 「AIの契約が散らかる」痛みは本物だが、銀行なしの重複チェックはもう取りに行かれてる\n- 根拠: SubHorizon / SubLens。Excelで節約した話も多い。\n- 含意: 001はparkのままでよい。同じ切り口では入らない。\n\n### H4. マルチLLMのチャット整理は、需要はあるが参入には遅い\n- 根拠: AI Toolbox が PH1位かつ既存ユーザー多数。Echoes / Kioku もいる。\n- 含意: この系統はストックの「飽和カテゴリ」として残し、新規候補にはしない。\n\n### H5（メタ）. いまのストックは「今日のスナップショット」が多く、意思決定にはまだ薄い\n- 根拠: 伸びの再確認がほぼゼロ。一次ソースとまとめブログの区別も初回は甘かった。\n- 含意: 次のサイクルは新規ネタ探しより、既存シグナルの深掘りと再測定を優先。\n\n### いまの全体方針（提案）\n1. 作らない前提は維持。\n2. 深掘りは二本柱: (A) エージェント向けdevtoolsの動向 (B) 日本の受領インボイス周辺。\n3. 候補を急いで増やさない。仮説が棄却／強化されてから。\n\n### 次に調べること\n1. dif.sh 周辺: 追随・類似・「アカウント不要×エージェント」系の議論がこの1週間で増えてるか。\n2. 受領インボイス: 国税庁API／公表データ照合の実装難易度、既存無料ツールの穴、想定ユーザー（個人／小規模）の支払い意思の手がかり。\n3. エージェント向け「試行ログ／決定メモ」に近い既存がないか（GitHub / PH）をもう一段洗う。\n4. 1–2週間後に H1・H2 を再確認する日付を決める（目安: 2026-09-21 前後）。\n\n## 2026-09-07 — テックリード：実現の見立て（まだ作らない）\n\n### A. エージェント向け try-log / decision memo（003系統）\n- 出せる形: リポジトリ内 markdown ＋ 薄い CLI（`init` / `log` / `decide`）。アカウントなし。AGENTS.md に1段落足すだけで読める。\n- ざっくり工数: Codex なら 2–3 日で MVP。公開は GitHub だけで足りる。\n- リスク: (1) エージェントが書式を守らないとログがゴミになる (2) dif.sh 系と「同じ repo 置き markdown」に見えやすい (3) 採用の証拠は「実際に init された数」以外取りにくい。\n- 仮説との関係: H1 が「追随が続く」に倒れたらこの出し方で最短。今は作らず、近い既存の洗いと書式の現実味だけ見ておく。\n\n### B. 受領インボイス登録番号チェック（002系統）\n- 出せる形: いちばん安いは Web 1画面（PDF/テキスト貼り付け → T番号抽出 → 公表データ照合）。スマホアプリは不要。課金するなら後から薄い SaaS。\n- ざっくり工数: 照合が国税庁の公開 API／CSV で済むなら 2–4 日。PDF の雑多なレイアウトまで本気で読むと一気に伸びる。\n- リスク: (1) 公表データの利用条件・更新遅延 (2) freee 等が受領側に寄せたら隙間が消える (3) 個人事業主は無料で十分、支払い意思が弱い可能性。\n- 仮説との関係: アナリストが「穴と誰が払うか」を測るあいだに、APIの実在と利用条件だけ先に潰せると判断が早い。\n\n### いまの自分の方針\n作らない。二本柱について「どう出せるか／何日／どこで詰まるか」だけ更新していく。作るフェーズに入ったら brief に落とす。\n\n## 2026-09-07 — PM：方針決定\n\n二人の提案を採用。\n\n1. 作らない。しばらく調査と仮説の検証だけ。\n2. 深掘りは二本だけ。(A) エージェント向けdevtools (B) 受領インボイス。候補は増やさない。\n3. 001とチャット整理系は触らない。\n4. 再確認は 2026-09-21 前後。それまで H1（続きそうか）と H2（穴と誰が払うか）を育てる。\n5. テックリードは作り込みではなく、出し方・詰まりどころ・公表データ利用条件の確認に留める。\n\n## 2026-09-07 — テックリード：依頼分の先見き（作らない）\n\n### 受領インボイス：公表データの利用条件\n- ルートは2つ。(1) 全件/差分のCSV・JSONダウンロード（毎月更新、申請なしで取れる）(2) Web-API（アプリIDの届出＋申請が必要、無料）。\n- API利用時は「国税庁がサービス内容を保証するものではない」旨の明示が必須。大量アクセス・IDの第三者提供はNG。顧客向けサービスで登録番号以外から検索する仕様は申請が通らない、という記載あり。\n- 含意: いちばん安いMVPは「手元で全件/差分を持つ」か「番号照会だけ」。APIは申請リードタイムがあるので、作るフェーズに入る直前でもいい。今は条件面のブロッカーは少なめ（明示文と申請の手間くらい）。\n\n### 試行ログ：dif.shと同じ置き方に見えない出し方\n- dif.shっぽく見えるのは「repo直下に決まったmarkdownを1枚置く」形。避けたい。\n- 案A: `.agents/trials/` に日付付きの短いエントリを追記するだけ（単一の旗ファイルにしない）。\n- 案B: ファイルより「会話の最後に必ず書くテンプレ」＋薄い検証コマンド（存在チェック）。置き場所のプロダクト感を薄くする。\n- 案C: gitのコミット/PR説明に試行結果を残す規約＋lint。markdown置き場そのものを主役にしない。\n- まだ作らない。アナリストの既存洗いで、似た規約が既にないか見てから絞る。\n\n## 2026-09-07 — PM：方針修正（James）\n\n前の「候補を増やさない」は撤回。\n\n理由: まだ世界の一部しか見てない。いまの二本が「あとで作るべき一番」かは判断できない。\n\n新しい方針:\n1. 作らないのは維持。\n2. 候補・シグナルは積極的に増やす（探索を広げる）。\n3. 二本の深掘りはやめてもいいが、捨てなくてよい。並行で新規探索。\n4. 「どう作るか」は作る決断と切り離して、テックリードが独立に考えてよい。\n\n## 2026-09-07 — 探索拡大後の更新\n\n### 振り返り\n- 「二本だけ深掘り・候補増やさない」は早すぎた。世界の一部しか見てないのに一番かは分からない、というJamesの指摘で撤回。\n- 作らない前提は維持。どう作るかは決断と分けて考えてよい。\n\n### 仮説の更新\n- **H1 強化寄り**: dif.sh だけでなく Ponytail（同日帯 PH3位）もエージェント振る舞い制御の需要を示す。系統は広い。\n- **H6 新規**: フリーランスの「安い運用ツール」需要はあるが、請求追い込みは既に混雑。ポータル／スコープ管理のほうが空きがあるかも（二次ソース依存、要検証）。\n- **H7 新規**: 日本の中小は「生成AIを使いたいが機密が怖い」が強く、対策率は低い。需要は構造的。ただしマスキング製品が2026年に立て続けに出ていて、隙間は狭い可能性。\n- **H5 更新**: スナップショット偏りは続く。広げた分、一次確認と競合マップが追いついてない。\n\n### 次の方針（提案）\n1. 作らないまま、候補とシグナルを増やす（今回 opp-004〜006 を signal で追加）。\n2. 二本柱（エージェントdevtools / 受領インボイス）は捨てず、並行でフリーランス運用とJPのAI手前セキュリティも見る。\n3. 次の検証: (a) 安いクライアントポータルの実競合洗い (b) マスキング系の価格帯・無料枠マップ (c) Ponytail以外の restraint 系の有無 (d) 予定どおり 9/21 前後の再確認。\n\n\n## 2026-09-07 — テックリード：新規候補の出し方（作る決断と別）\n\n### opp-004 エージェント自制ルールパック\n- 出せる形: AGENTS.md / Cursor rules 用の短いテンプレ集。配布は GitHub。プラグイン本体は作らない。\n- 工数: 0.5–1日。ほぼ文章。\n- リスク: Ponytail等のプラグインと「同じ問題」に見える。価値は中身の質と更新頻度だけなので、プロダクトとして薄い。H1の傍証にはなるが、単体で出す優先度は低め。\n\n### opp-005 安いクライアントポータル\n- 出せる形: いちばん安くてもログイン付きWeb。ファイル共有・進捗・請求リンクくらい。SaaS前提。\n- 工数: 薄いMVPでも1–2週。OSS1ファイルでは足りない。\n- リスク: 認証・権限・通知で膨らむ。二次ソース頼みなので、競合洗いで「本当に空いてる」が崩れたら即下げる。今は作り方より市場確認が先。\n\n### opp-006 貼る前マスキング\n- 出せる形: ブラウザ1画面（貼る→マスク→コピー）。ローカル処理ならサーバ不要で早い。\n- 工数: 単純な正規表現・辞書なら2–4日。日本語固有表現までやると伸びる。\n- リスク: ソースネクスト等が既にいる。無料Webだと差別化が弱い。精度を上げると重い。需要は本物でも「今から薄いのを出す」旨味は薄い見立て。\n\n## 2026-09-07 — PM：広げたあとの方針\n\n1. 作らない。探索は続ける。\n2. 次の検証の優先: ポータル競合洗い（空きが消えたら005は捨てる）。\n3. マスキングは需要メモとして残すが急がない。\n4. 自制ルールパックは軽い調査だけ。単体優先は低い。\n5. 二本柱（エージェントdevtools / 受領）と新規は並行。\n\n## 2026-09-07 — PM：広さ不足への修正\n\n問題: 世界の一部しか見てないのに、具体候補の検証に入りすぎていた。\n\n改善:\n1. coverage.md で未着手分野を見える化\n2. サイクルは空マス優先（だいたい7割）\n3. 既知テーマの深掘りは3割まで\n4. 作り方の詳細は地図が埋まるまで抑える（カテゴリ単位まで）\n5. ボット同士の会話も natural-japanese\n\n## 2026-09-07 — 広さ先に戻す\n\n### 振り返り\n- 候補検証（ポータル競合など）に寄るのが早すぎた。空白の業界が多いのに具体に入ってた。\n- natural-japanese はボット同士の会話も含めて守る。\n\n### 仮説の更新\n- **H8**: いま有利なのは「見えた候補」より「まだ見てない分野の地図作り」。具体の勝ち負け判断は地図が埋まってから。\n- **H9（仮）**: 医療は需要はあるが規制が重い。教育・不動産はカテゴリとして面白そうだが一次が薄い。小売エージェントは金額感が中堅寄り。\n- H6（安いポータル）の検証は、地図がもう少し埋まってから再開。\n\n### 次の方針\n1. `coverage.md` を正とする。まだ多い分野を優先してなめる。\n2. 1回の調査は未着手7割・既知3割。\n3. 個別の「どう作るか」は薄め。分野単位のメモまで。\n4. 次に舐める候補: 物流、建設、介護、士業、飲食。\n\n## 2026-09-07 — 空分野をなめたあと\n\n### 見たこと\n物流・建設・介護・士業・飲食・製造をカテゴリ単位でなめた。\n\n### 仮説の更新\n- **H10**: 物流は制度（改正物流効率化法）がなぜ今かを強くしてる。ただし専用SaaSも出始め。隙間の有無は後で。\n- **H11**: 建設・介護は「入れたい／要る」より「定着しない・余裕がない」が主。ツール不足というより現場適合の問題。\n- **H12**: 製造・士業・飲食は既存クラウドや補助金文脈が厚く、今の工場がすぐ入れる空白には見えにくい（一次はまだ薄い）。\n\n### 次\n地図の「まだ」はほぼ「薄い」になった。次は広さの穴埋めを続けるか、薄いなかで一次が取れそうなところ（例: 物流の制度周辺、不動産の小規模大家）を軽く優先度づけするか、PM判断。\n\n## 2026-09-07 — 地図一段落\n\n### 振り返り\n美容・農業・公共もなめた。「まだ」はおおむね解消。深掘りも作り方もまだしない、という前提は守れた。\n\n### いまの見立て\n- 厚いところが多い。美容・公共・製造・介護・物流（専用SaaS）はすぐの隙が薄い。\n- メモとして残す薄さは、不動産の小規模大家、教育・塾の料金、農業の超小規模事務くらい。一次はまだ弱い。\n- 建設・介護はツール不足より定着問題。\n\n### 次の方針（提案）\n1. 地図は一段落。具体プロダクト深掘りに戻る前に、薄い候補の一次ソースを少しだけ取るか、海外の未踏カテゴリをなめるか、PMが決める。\n2. 作らない前提は継続。\n\n\n## 2026-09-07 — 調査レンズ追加（James）\n\n業界マップだけではユーザー需要を取りこぼす、という指摘。\n\n仮説: 業界軸と価値観軸／ユーザーの時間の使い方はずれる。伸びてるアプリやショート動画、マクロ動向も見ないと地図が歪む。\n\n方針: preferences の Research lenses に従い、次サイクルから業界7割固定を緩め、ユーザー目線・価値観・マクロを混ぜる。\n\n## 2026-09-07 — PM：地図一段落と次の配分\n\n振り返り: 業界マップの初回パスはだいたい終わった。厚い分野が多い。薄いメモは小規模大家・塾料金・農業の超小規模事務くらい。\n\n方針:\n1. 作らないのは維持。\n2. 次の調査は coverage の穴埋めより、4レンズ混ぜ（ユーザー／マクロ／業界一次置き場／価値観）。\n3. 薄いメモ3つは「気になる」止め。まだ深掘りしない。\n4. テックリードは分野単位のまま。\n\n## 2026-09-07 — ユーザー目線＋マクロ初回\n\n### 仮説\n- **H13**: ユーザー時間は「AIチャット常連」と「安く買う／中古」と「短尺で探す・見る」に割かれてる。業界SaaSの困りごと地図とは別レイヤ。\n- **H14**: マクロはAIの“稼がせフェーズ”とエージェント購買の話が熱い。作るなら業界ツールより、この消費行動の近くのほうが温度と合うかも（まだ検証弱い）。\n- **H15**: cozy／倹約と、刺激の短尺消費が同居してる。一つの価値観に寄せすぎない。\n\n### 方針\n薄いメモ3つは触らない。次も業界穴埋めより、このレンズの続き（日本のアプルトレンドや具体的な価値観シーン）を軽くでいい。\n\n\n## 2026-09-07 — PM：4レンズ1回目のあと\n\n採用する仮説: 「熱い需要」と「安く出せる」は別レイヤ。時間が集まってる場所ほど決済・在庫・信頼で重くなりやすい。業界の困りごとは薄いツールで届きやすいことが多い。\n\n次:\n1. 作らない。\n2. 調査では「熱い」と「安く出せる」を分けて記録する。\n3. 次の1回は価値観軸（安心・コスパ・自分らしさなど）を少し足す。業界マップの穴埋めは主にしない。\n\n## 2026-09-07 — 価値観パス\n\n### 仮説\n- **H16**: 安心は「機能」より「疑われないこと」（根拠・口コミ・AI開示）。熱いAIまわりほど、ここが重い。\n- **H17**: コスパは最安競争だけじゃない。メリハリとご褒美が同居。安い買い物アプリと「払う価値」は別需要。\n- **H18**: 自分らしさは外部の流行の丸飲みより、自分の好きの再編集。ツールなら「自分用に組み立てられる余白」が効くかも。\n\n### 方針メモ\n熱い×重い／薄い×届きやすい、と重ねると: 安心・信頼が要る熱い領域は重い。メリハリ消費の「選ぶ・比べる」は薄いツール向きの可能性がある（要検証）。薄いメモ3つは未着手のまま。\n\n\n## 2026-09-07 — PM：価値観パス採用＋内部ビューア\n\n価値観: 安心＝疑ってから買う／コスパ＝最安とご褒美は別／自分らしさ＝好きの再編集。安心が要るほど重く、選ぶ・比べるは薄いツール向き、を仮採用。\n\n別件: 市場プロダクトは作らないまま、調査ストックをJamesが探索するための内部画面（tool-research-explorer）は作る。\n\n\n## 2026-09-08 — JPストア＋リユース現場\n\n### 仮説\n- **H19**: 日本のスマホ時間（as-of 2026-09-06週）は AIチャット＋生活インフラ（予約・決済・行政・天気）寄り。米無料上位の中古／予測市場とはズレる。ユーザー需要を見るとき国を混ぜると地図が歪む。\n- **H20**: リユース現場では「安い」より「品質保証がないと買えない」がボトルネック（メルカリ一次・2026-05）。安心＝疑われないこと、の具体シーン。熱い×重いレイヤに近い（保証・真贋は重い）。\n- **H21**: リユース日常層は売却益をご褒美体験に回す（コメ兵・2026-07）。節約とご褒美は別需要というより、同じ循環の表裏。\n\n### 検証メモ\n- オリコン週次はダウンロード数ベースの一次に近い。ジハンピは企業PRなので普及メモ止め。\n- メルカリ／コメ兵は当事者調査。サンプルと誘導はあるが、昨日の海外二次より現場に近い。\n- Airuncode／Kitは既知devtools波の延長。方向は変えない。\n\n### 振り返り\n- 業界穴埋めをせず、レンズ（JPユーザー＋価値観シーン）で進められた。\n- 「熱い需要」側のリユース安心は重い（鑑定・保証）。薄いツール向きかは低い。\n- 昨日の価値観仮説は捨てず、JP一次で具体化した。\n\n### 次（提案）\n1. 作らない前提は維持。\n2. H19の続きなら Google Play JP や「時間の使い方」一次をもう一段でもよい。ただし同じAppランキング繰り返しは避ける。\n3. H20/H21はストックとして残す。商品化は熱い×重い側なので急がない。\n4. 薄いメモ3つ・coverage穴埋めは引き続き主にしない。\n\n## 2026-09-08 — PM：JP一次のあと\n\n採用:\n1. 国は分けて残す。米の熱い需要をJPに薄く移植しない。\n2. JPで太い予約・決済・LINE・品質保証は、熱いほど重い。\n3. 薄いツール向きは「選ぶ・比べる・下調べ」層、を維持。\n4. 作らない前提は継続。\n\n## 2026-09-09 — マクロ一次＋エージェント学習切り口\n\n### いまの仮説（このサイクル）\n- H14の続き: AIは「箱」より「稼がせ／成果課金」側が熱い。2026は更新で本当に効いてるかが問われる。\n- H21の続き: 節約とご褒美は同居しうる。家計全体が絞っても体験支出は残りうる。\n- 新規 **H22（仮）**: runtime／アカウント不要の次に混み始めているのは「セッションや訂正からエージェントを学習・ルール更新させる」切り口。ローカル薄いもの（Blume）とSaaS重いもの（Reflexio）が両方出ている。\n\n### 何を見たか\n- 家計調査7月分（9/4公表・一次）: 実質−3.6%、8か月連続減。教養娯楽＋、宿泊・外食が押し上げ。\n- Bessemer AI pricing playbook: outcome／hybrid、soft ROIは更新で弱い、という投資家側の整理。\n- PH直近: Blume（セッション→rules）、Reflexio（本番学習 #2）、Catenary（空間IDE）。Airuncode／Kitの繰り返しではない。\n- 物流: 国交省ポータルを一次置き場として確認。中長期計画の2026年度締切（10月末目安）がなぜ今。\n\n### 仮説どう変わったか\n- H14: 強化。稼がせ＝成果課金＋更新プレッシャー、まで具体化。\n- H21: 強化寄り。リユース現場の話だけでなく、家計一次でも「全体マイナス×体験プラス」が出た。\n- H19〜H20: 触らない（App／リユース保証は昨日までで十分）。\n- H1: ゆるく支持。ただし新規の空きは runtime より学習・文脈メンテ側。003発想と近いが既に製品あり → 深掘り候補にはしない。\n- H10（物流制度）: 一次置き場をメモできた。地図メモの補強。作る話はしない。\n\n### 振り返り\n- レンズ混ぜ（マクロ＋devtools＋一次置き場）で、禁止の繰り返しを避けられた。\n- スマホ保険の「選ぶ・比べる」記事は二次SEOが多く、ストックに足さずスキップ。\n\n### 次の方針（提案）\n1. 作らない前提は維持。Codex briefも出さない。\n2. H22は観察メモ止め。同じ切り口の競合がさらに増えるかだけ、週次で軽く見る。\n3. 家計は月次が出たら as-of を更新する程度。深掘りしない。\n4. 薄いメモ3つ・coverage穴埋め・App週次の再取得は主にしない。\n5. 次も4レンズ混ぜ。選ぶ・比べるは一次か当事者調査が取れるときだけ足す。\n\n## 2026-09-09 — 4レンズ（家計＋AI課金）\n\n### H22\n観察メモ止め。内容は「全体は絞るが体験のご褒美は残る」（家計調査7月）と、AIは席より成果／更新で効き目が問われる、程度。作る候補にはしない。\n\n### 仮説更新\n- **H17 強化**: メリハリ消費は家計調査で一次あり（宿泊・外食は伸び、全体はマイナス）。\n- **H23**: AIプロダクトは「熱い」だけでは足りず、測れる成果がないと2026更新で落ちやすい。薄いツールでも「何が良くなったか」が見えるほうが残る。\n- 国分け・薄い＝選ぶ／比べる／下調べ、は維持。\n\n### 次\nApp週次の繰り返しは避ける。4レンズ継続。devtoolsのBlume／ReflexioはPMメモの観察に留め、深掘りしない。\n\n", "modified": "2026-09-09T00:18:51.700905+00:00"}, "signals.md": {"text": "# Signals\n\nDated trend notes with sources. Newest first.\n\n## 2026-09-09 — 4レンズ混ぜ（App週次なし）\n\n### 価値観／マクロ（家計調査・一次）\n総務省家計調査 2026年7月分（2026-09-04公表）。二人以上世帯の消費支出は実質−3.6%、8か月連続マイナス。一方で宿泊料は実質+24.5%、外食+5.9%。全体は絞るが体験のご褒美は残る、が数字で見える。\n- https://www.stat.go.jp/data/kakei/sokuhou/tsuki/\n\n### マクロ／AI課金（Bessemer系）\n席課金から usage／workflow／outcome へ。2026は更新で「本当に効いてるか」が問われる（renewal cliff）。成果が測れないソフトROIは厳しい、というトーン。\n- https://www.bvp.com/assets/uploads/2026/02/The_AI_pricing_playbook_for_founders_Bessemer_Venture_Partners_2026.pdf\n\n### ユーザー目線（動画・二次多め）\nJPのYouTube解説では節約・時短・体験／旅行系が定番テーマとして出てくる。家計のメリハリと方向は合うが、一次の視聴データではないので割り引き。\n\n### 業界一次置き場メモ\n物流: 国交省ポータルを一次置き場候補としてPMがメモ（深掘りなし）。\n\n### H22\n観察メモ止め（PM指示）。作る話には上げない。\n\n## 2026-09-09 — マクロ一次（家計）＋AI稼がせ／エージェント「学習」切り口\n\nレンズ: マクロ／投資家＋EN agent-devtools軽め＋業界一次置き場。Appランキング・リユース調査・価値観まとめは触ってない。薄いメモ3つも触ってない。\n\n### JP消費（一次・as-of）\n- 総務省統計局「家計調査報告」2026年7月分（**2026-09-04公表**）。二人以上世帯の消費支出は1世帯あたり301,245円。前年同月比**実質3.6%減・名目1.5%減**。実質減少は**8か月連続**。\n- 中身: 自動車等・設備修繕・電気などが押し下げ。一方で**教養娯楽は実質+4.8%**（2か月連続増）。増加寄与の目立つところは宿泊料・外食。\n- 読み方: 全体はまだ絞ってる。でも「体験のご褒美」は消えてない。昨日までのリユース売却→ご褒美循環（H21）と並ぶ、メリハリの数字。\n- https://www.stat.go.jp/data/kakei/sokuhou/tsuki/index.html\n- https://www.stat.go.jp/data/kakei/sokuhou/tsuki/pdf/fies_mr.pdf\n\n### AIの稼がせ方（投資家寄り・大手VC）\n- Bessemer「The AI pricing and monetization playbook」: 席課金より usage／workflow／**outcome**。Agentは成果・ROI結びが本命、という整理。\n- ポイント: 2025の「とりあえず導入」が**2026の更新（renewal cliff）**にぶつかる。ソフトなROI（助言だけCopilot）は支払い意思が落ちやすい。ハードな成果のほうが価格が立つ、という見立て。\n- 昨日までの「箱→稼がせ」マクロと方向は同じ。数字というより構造のなぜ今。\n- https://www.bvp.com/atlas/the-ai-pricing-and-monetization-playbook\n\n### EN agent-devtools（軽め・飽和カテゴリ以外）\n昨日メモした runtime（Airuncode／Kit）の繰り返しは避ける。ここ数日で目立つ別切り口:\n- **Blume.codes**（PH 2026-09-03、約105↑・#11）: コーディングエージェントのセッションを見て、繰り返し訂正→rules／skillsに落とす。ローカル・無料。ランタイムではなく「文脈メンテ」。\n- **Reflexio**（PH 2026-09-05、約282↑・日次#2）: 本番トレース／訂正から振る舞いを学習。見える・試せる・戻せる、という売り。SaaS寄りで重い。\n- **Catenary**（PH 2026-09-08、約86↑）: エージェント用の空間キャンバスIDE。ローカルファースト。オーケストレーションUI系。\n- 含意: H1（アカウント不要〜エージェント周り）の延長は続く。ただし次の混みは「runtime」より**セッションから学習・ルール更新**側に寄ってきてる。003の試行ログ発想と近いが、既に製品が出てる。\n- https://www.hunted.space/dashboard/blume-codes\n- https://www.hunted.space/product/reflexio-2\n- https://www.hunted.space/product/catenary\n\n### JP実務・一次置き場（物流・候補化なし）\n- 国交省「物流効率化法」理解促進ポータル: 努力義務は2025年度〜、特定事業者の義務は2026年度〜。中長期計画の初回提出は2026年度に限り**10月末**目安、という整理が公式側にまとまってる。\n- なぜ今: 制度カレンダー。深掘り候補にはしない。最新と前提を取る場所としてメモ。\n- https://www.revised-logistics-act-portal.mlit.go.jp/\n\n### 仮説メモ\n消費は全体マイナスでも体験は残る（家計一次）。AIは更新で「本当に効いてる？」が問われる（Bessemer）。devtoolsは「動かす」から「覚えさせる・整える」へ話が広がってる。作る話はしない。\n\n## 2026-09-08 — Play JP ＋時間の使い方一次（App週次の繰り返し回避）\n\nPMのiOS無料週次（〜9/6）と突き合わせ。米上位の中古・予測市場とは違う、という見立てを補強。\n\n### Play 日本・無料アプリ（AppBrain 2026-09-07時点）\n上位寄り: TikTok Lite / LINE / ChatGPT / TikTok / 天気 / X / Instagram / TVer / ホットペッパービューティー / Gemini / PayPay / 楽天 / ReelShort・NetShort系 / d払い / ジハンピ / Temu / メルカリ など。\n生活インフラ（決済・キャリア・天気・予約）＋短尺動画＋AIチャットが太い。Vinted級の中古特化や予測市場は目立たない。\n- https://www.appbrain.com/stats/google-play-rankings/top_free/application/jp\n\n### 時間の使い方（一次）\n総務省情報通信政策研究所「令和6年度情報通信メディアの利用時間と情報行動に関する調査」（対象期間2024-12、公表2025-06）。\n- 平日インターネット平均181.8分（+8.2）、テレビリアルタイム154.7分（-8.2）。休日もネットが最長。\n- SNS利用率: LINE 91.1% / Instagram 52.6% / X 43.3%。動画: YouTube 80.8% / TikTok 33.2%。\n- 「いち早く知る」はネット、「信頼できる情報」は全体ではテレビがまだ強い（若い年代はネット寄り）。\n- https://www.soumu.go.jp/menu_news/s-news/01iicp01_02000125.html\n\n### リユース×安心（メルカリ一次・PM所見の補強）\nメルカリ調査（2026-05、n本調査1040）: 高額リユースの最大の壁は品質不安。スマホ・PC等で品質保証を重視 85.9%。プロ保証があれば利用層の約半数が購入してもよい。\n- https://about.mercari.com/press/news/articles/20260714_research/\n\n### 仮説メモ\n国を混ぜると需要地図が歪む、を支持。JPの時間はネット長時間＋LINE基盤。安心はリユースで「品質保証がないと止まる」が数字で出ている。\n\n## 2026-09-08 — JPアプリ週次＋リユース価値観シーン（一次寄り）\n\nレンズ: ユーザー目線（日本ストア）＋価値観の具体シーン。業界穴埋めなし。薄いメモ3つは触ってない。\n\n### 日本 App Store 無料（非ゲーム）週次 — as-of 2026-09-07（集計 8/31–9/6）\n- オリコン週間: 1 setlog / 2 ChatGPT / 3 Gemini / 4 ホットペッパービューティー / 5 ジハンピ / 6 マイナアプリ / 7 ファミペイ / 8 Rocket Now / 9 U-NEXT / 10 ウェザーニュース\n- 読み方: AIチャットは米国と同じく上位固定。その下は予約・自販機決済・行政・コンビニ決済・出前・動画・天気＝**生活インフラ寄り**。昨日ストックの米無料上位（Vinted／Temu／予測市場）とはズレる。\n- ジハンピはサントリー系の自販機キャッシュレス。2026-06末でDL 2,000万・対応機21万台超（企業PR）。「伸びてるニッチ」というより日常タッチ決済の普及メモ。\n- https://www.oricon.co.jp/rank/faa/w/2026-09-07/\n- https://prtimes.jp/main/html/rd/p/000000843.000027480.html\n\n### 価値観シーン: リユース × 安心／コスパ（JP一次）\n- **メルカリ調査**（2026-05実施・7月公開）: 物価高でリユース検討が増えた人は約2割。一方で直近1–2年「全く買わない」も約5割。壁は汚れ・品質・価格妥当性・偽物不安。高額バッグ／スマホ等は不安約7割。品質保証を重視は8割超。プロ保証があればリユース利用層の約半数が「高額でも買ってよい」。\n  - 切り口: 昨日の「安心＝疑われないこと」の具体。**安いだけじゃ足りず、保証がないと買えない**。\n  - https://about.mercari.com/press/news/articles/20260714_research/\n- **コメ兵調査**（2026-07実施）: リユース経験約7割。「安いから」は前年比で減。日常売却層は売却益を旅行・外食へ（生活費は少数）。節約防衛とご褒美循環が同居。\n  - https://prtimes.jp/main/html/rd/p/000000382.000000884.html\n\n### ついで: エージェントruntime（ENワイルドカード・軽め）\n- Airuncode（PH 2026-09-07、約112 upvotes・日次#5）: ローカル複数コーディングエージェントruntime。\n- Kit by Speakeasy（PH 2026-09-06、約110・#7）: コーディングエージェントruntime／ACP。\n- 既知の agent-devtools 波の延長。AI Toolbox 系は昨日メモ済み。新規の「空き」は見えない。\n- https://www.hunted.space/product/airuncode\n- https://www.hunted.space/product/speakeasydev\n\n### ショート動画JP（二次・補強のみ）\n- 『ショート動画白書 vol.8』（調査2026-03）: 認知は全世代で高く、50–60代TikTokほぼ毎日も多い、という企業調査。昨日の「時間の使い方＝短尺」補強。新規需要仮説までは使わない。\n- https://prtimes.jp/main/html/rd/p/000000437.000012020.html\n\n\n\n\n\n\n\n\n## 2026-09-07 — 価値観パス（安心・コスパ・自分らしさ）\n\n業界マップ外。二次〜調査レポート中心。一次の現場声はまだ薄い。\n\n### 安心\n- 疑いは増えてる。買う前に根拠・口コミを見る。AI利用の開示を求める声も強い（海外調査）。\n- 日本: 物価高と健康不安が強い、という調査あり。\n- https://www.ey.com/en_us/insights/consulting/in-the-permission-economy-who-earns-the-right-to-act\n- https://corp.neo-m.jp/report/investigation/life_080_2026trends\n\n### コスパ\n- 「安いだけ」より「賢い節約／メリハリ」。ご褒美や「better」には払う、という両面。\n- デロイト国内調査: 節約と贅沢のメリハリが上位。ご褒美消費も少し上昇。\n- https://www.deloitte.com/jp/ja/Industries/consumer/research/consumer-behavior-survey.html\n- https://www.euromonitor.com/voice-of-the-consumer-lifestyles-survey-2026-key-insights/report\n\n### 自分らしさ\n- 電通まわり: 「セルフカルチャー消費」— 自分の好きを再編集して自分らしさを作る。\n- 海外: 匿名でいたい／刺激を減らしたい、コミュニティやローカルへの寄せも。\n- https://media-innovation.jp/article/2025/12/11/142967.html\n\n### 以前のアプリ／動画とのつなぎ\n- Vinted／Temu = コスパ・倹約の行動\n- cozy／短尺 = 刺激の減らし方と、それでも欲しい娯楽の同居\n- AI開示・本物っぽさ = 安心の条件\n\n## 2026-09-07 — ユーザー目線＋マクロ（業界マップ外）\n\n### 伸びてるアプリ側（ユーザーが開いてるもの）\n- 米国無料ランキング付近（2026-09頭）: ChatGPT / Claude / Grok などAIチャットが常連。Vinted（中古・リユース）、Temu も上位。上昇気味に Kalshi（予測市場）、Grok AI。\n  - https://top-apps.anerg.com/countries/us/top-free\n- 伸び加速の例（Peekly・レビュー速度）: AI音楽生成、短尺学習／ドラマ系、英会話AIなど。ノイズ多めなので「方向」だけ見る。\n  - https://peekly.app/reports/fastest-growing-apps\n\n### 動画まわり（時間の使い方）\n- ショート動画が発見と検索の入口。Gen ZはTikTokで商品探し。\n- 価値観っぽい流れ: cozy／倹約楽観、マイクロドラマ、本物っぽさ、ワークライフの話。\n  - https://www.hootsuite.com/research/social-trends\n  - https://www.sendible.com/insights/latest-social-media-trends-report\n\n### マクロの温度（投資家目線・軽く）\n- AIは「箱を作る」から「使って稼ぐ」へ話が広がってる、という市場コメントが多い（2026-09）。\n- エージェント買い物（agentic commerce）の話が出始め。規制側も透明性の話。\n- 金利・インフレはまだ敏感。消費は粘り強いがエネルギー価格に注意、というトーン。\n  - https://www.westernsouthern.com/fortwashington/insights/monthly-market-pulse-september-2026\n  - https://onlinestorenews.com/agentic-ai-shopping-is-rewriting-the-d2c-funnel-in-2026/\n\n### 価値観メモ（業界とずらして見る）\n- 安く・中古で済ませたい（Vinted／Temu）\n- AIを日常の相棒にしたい（チャット常連）\n- 刺激を減らして居心地よく／でも短尺ドラマは食べる\n- 「本物っぽさ」への反応（作り込みすぎ嫌い）\n\n## 2026-09-07 — 美容・農業・公共パス＋地図一段落\n\n### 美容\n- 予約・POS・カルテは特化プロダクトがすでに多い。課題は人手・集客コスト・月末事務。隙間は狭そう。\n- https://reservation-system-comparison.info/column/salon-reservation-case-study/\n\n### 農業\n- 高齢化・初期費用・通信。大規模はスマート農業、小規模は普及限定。補助金前提の話が多い。\n- https://seimitsu-nougyo.com/agriculture-digitalization/\n\n### 公共\n- 自治体システム標準化／ガバメントクラウドが主戦場。移行遅延・ベンダー不足。個人開発の初手向きではない。\n- https://debono.jp/1960\n\n一段落の整理は `coverage.md` の「一段落メモ」へ。\n\n## 2026-09-07 — 空分野パス（物流・建設・介護・士業・飲食・製造）\n\nカテゴリだけ。深掘りなし。\n\n### 物流\n- 改正物流効率化法（2026年4月全面施行あたり）で荷待ち時間等の把握・報告の話が強い。中小倉庫にデータ提出が波及、という一次に近い話あり。ヨビトラ等の専用SaaSも登場。\n- https://www.meti.go.jp/policy/economy/distribution/butsuryu-kouritsuka.html\n- https://yobitora.com/\n\n### 建設\n- 施工管理アプリ導入はまだ一部。未導入の壁は定着とコスト。導入後も「使いこなせない／定着しない」。\n- https://www.sankei.com/pressrelease/prtimes/M6QGZAFSK5MQRAS4H2U25XA3U4/\n\n### 介護\n- 記録ソフト未導入がまだ多い。人手不足で「入れる余裕がない」構造。カイポケ等の既存が強い印象。\n- https://voix.jp/biz/news/165255/\n\n### 士業・飲食・製造\n- 士業はプロジェクト型管理の文脈で少し触れた程度。飲食・食品製造は省力化の政府プランあり。製造は人手不足と属人化、既存の生産管理クラウドが厚い。\n- どれも「空白が一気に空いてる」感じではなく、既存プレイヤーか補助金前提の話が多い。\n\n## 2026-09-07 — 分野マップ広げ（具体は後）\n\n地図がないままピンに寄ってたので、空いてる分野をカテゴリ単位でなめた。詳細は `coverage.md`。\n\n### 医療\n- 小規模クリニック向けの事務・請求まわりは、大病院向けAIに取り残されてる、という話が多い。ただ規制・HIPAA等で個人開発の初手には重い。\n- https://agentman.ai/blog/5-billion-problem-small-practices-left-behind-healthcare-ai\n\n### 教育\n- EdTechは統合とセキュリティの話が主。学習塾・習い事の料金ルールは汎用SaaSに合いにくい、という二次メモあり。一次は薄い。\n- https://newagesysit.com/blog/cost-to-build-a-custom-fee-management-platform-for-us-schools-tutoring-centers-and-enrichment-academies-full-budget-breakdown/\n\n### 不動産\n- 小規模大家・独立PM向けの狭いツールが伸びてる、というマクロ。テナント連絡ハブ等のアイデアも多いが、まだ競合マップなし。\n- https://blog.mean.ceo/micro-saas-trends-september-2026/\n- https://www.pmtrends.com/\n\n### 小売・EC／人事\n- 小売は商品マスタ・問い合わせ自動化のエージェント話。中堅向けPoC金額が多く、いまの工場の「安く出す」とは距離あり。\n- 人事労務は弥生などがクラウドを寄せてる。隙間は未確認。\n- https://gxo.co.jp/column/mid-retail-ai-agent-2026\n- https://prtimes.jp/main/html/rd/p/000000400.000015865.html\n\n### まだほぼ空\n物流・建設・介護・士業・飲食・製造・美容・農業など。次の広げ先。\n\n## 2026-09-07 — widen scout (候補を増やす方針)\n\n### Agent DX 追記\n- **Ponytail** PH #3 on 2026-09-05 (~225 upvotes). Coding agents write too much code; plugin pushes reuse/stdlib first.\n  - https://www.hunted.space/dashboard/ponytail\n- dif.sh と同日帯。アカウント不要／エージェントの振る舞い制御の波が複数ある。\n\n### Freelance ops\n- MicroGaps: late pay / scope creep / cheap client portal が $20帯で未解決と主張（二次）。\n  - https://www.microgaps.com/blog/freelance-business-problems-tools-2026\n- ただし invoice chase は PaidUp / Dunningly / ChaseAI / Followio など既に多い → 追い込み系は飽和寄り。\n\n### JP SMB × 生成AI不安\n- ヤマネックス調査（2026-07）: 機密入力に強い不安 87.7%、自動マスキングあり 11.4%。ぶちAIゲートウェイは 2026-09-02 販売開始。\n  - https://prtimes.jp/main/html/rd/p/000000004.000168596.html\n- ソースネクスト「いきなりAI 情報マスキング」、個人開発の仮名化くんも存在 → 需要は本物、隙間は要精査。\n\n### JP SMB DX context\n- IT担当不在 55%、Excel/紙中心 40.5%、DX後回し 69%（Seldish 2026）。小さな成功体験需要。\n  - https://seldish.jp/column/smb-it-survey-2026/\n\n## 2026-09-07 — mode: research-first\n\nJames: しばらく作らない。トレンド・需要・動向の蓄積を優先。候補を急がない。003 building は保留。\n\n## 2026-09-07 — first open-field scout\n\n### Agent-native DX (repo-local, no account)\n- **dif.sh** hit Product Hunt #1 on 2026-09-05 (~359 upvotes). Markdown feature flags living in-repo; maker story: coding agents abandon account-gated flag tools and write `process.env` hacks instead.\n  - https://www.hunted.space/dashboard/dif-sh\n- Pattern: tools that agents can `init` without signup are pulling attention right now.\n\n### Multi-model / AI-stack sprawl\n- **AI Toolbox 3.0** PH #1 on 2026-09-06 (~278 upvotes): organize/search/export across ChatGPT, Claude, Gemini, Grok; claims 40k+ users. Category crowded (Echoes, Kioku) → organize-chats MVP is saturated for us.\n  - https://www.hunted.space/dashboard/chatgpt-toolbox\n- **SubHorizon** / **SubLens**: track AI coding-stack subscriptions (Cursor, Claude, Copilot, ChatGPT) without bank login; overlap/cancel narrative for vibe coders.\n  - https://subhorizon.app/\n  - https://github.com/heartleo/sublens\n- Consumer side still uses Excel trackers to cut $1k+ in renewals (How-To Geek) → willingness to act on subscription waste is real.\n\n### Local-first prompt eval\n- **Revalvo** launched ~2026-08-28 (≈85–95 upvotes): BYOK multi-model eval workbench. Demand rising but already has a credible indie product → full clone is weak.\n  - https://www.hunted.space/dashboard/revalvo\n\n### Japan: invoice receive-side check\n- 2026 comparison content flags **受領請求書** (registration-number verify + AI-OCR) as the newer, stronger search intent vs issue-side tools; 経過措置 drops from 80%→50% after 2026-09 → more pain to verify supplier invoices.\n  - https://atsoho.com/blog/small-business-invoice-system-ai-tool-compare\n  - https://ai-gyomu.jp/invoice-accounting-software-freee-mf-setup/\n\n### Macro (context only)\n- Micro-SaaS writeups push vertical AI, agent infra, cheap distribution; generic wrappers losing.\n  - https://bigideasdb.com/micro-saas-trends-2026\n  - https://blog.mean.ceo/micro-saas-trends-september-2026/\n", "modified": "2026-09-09T00:18:51.700905+00:00"}, "opportunities.csv": {"text": "id,title,field,status,demand_score,cost_score,speed_to_ship_days,why_now,evidence_links,build_brief_path,created,updated,kill_or_grow_notes\nopp-001,AI coding-stack overlap checker (no bank),devtools / finops,parked,3,4,2-3,Vibe coders stack ChatGPT+Claude+Cursor+Copilot and lose track of overlap/renewals; bank-free overlap report is rising while enterprise SaaS-mgmt is too heavy.,https://subhorizon.app/ | https://github.com/heartleo/sublens | https://www.howtogeek.com/microsoft-excel-subscription-tracker-saved-over-1000/,,2026-09-07,2026-09-07,SubHorizon/SubLens already own bank-free AI-stack overlap; thin wedge for us day one\nopp-002,受領インボイス登録番号チェッカー,japan / compliance,candidate,4,4,2-4,受領側の登録番号照合ニーズが比較記事で強調; 2026-09以降の経過措置80%→50%で確認インセンティブ上昇。発行側はfreee等で飽和、受領チェックの薄いMVP余地。,https://atsoho.com/blog/small-business-invoice-system-ai-tool-compare | https://ai-gyomu.jp/invoice-accounting-software-freee-mf-setup/,,2026-09-07,2026-09-07,JP receive-side + 2026-09 経過措置; recommend as #2\nopp-003,Agent try-log / decision markdown for repos,devtools / agent-dx,parked,4,5,2-3,\"dif.sh (#1 PH 2026-09-05, ~359↑) proves demand for no-account markdown agents can install; wedge is try/decision history (not feature flags) so agents stop re-trying failed paths.\",https://www.hunted.space/dashboard/dif-sh,,2026-09-07,2026-09-07,James: research-first; building deferred; keep watching signals\nopp-004,Agent restraint rulepack (AGENTS.md / checklist),devtools / agent-dx,signal,,,2,\"Ponytailが2026-09-05にPH3位（約225↑）。エージェントがコードを書きすぎる問題への需要。プラグイン競合あり、薄いルールパックなら差別化余地を要検証。\",\"https://www.hunted.space/dashboard/ponytail\",,2026-09-07,2026-09-07,expanding scout; same week as dif.sh\nopp-005,Free 向けでアカウント不要なら OSS（CLI / repo内 markdown）優先\n- 業務・課金・継続利用が要るなら薄いWeb/SaaS\n- スマホアプリは配布・審査コストが高いので、他で足りるなら後回し\n- 候補ごとに「なぜその形か」を brief に1行書く\n\n## Mode (2026-09-07)\n- いまは作らない。調査と情報ストックを優先\n- トレンド・世の中の状況・需要・動向を貯める\n- 作るかはあとで判断（003も含め building にしない）\n- 候補・シグナルは増やしてよい（全体が見えてない前提）。二本深掘りに閉じない\n\n## Wording\n- 「楔」は使わない\n- 代わりに「切り口」「同じことをやってる競合」「うちの独自のところ」など普通の言い方\n\n## Roles (clarified 2026-09-07)\n- アナリスト: 集めるだけじゃない。意思決定用に貯めて分析し、仮説→次の方針・全体方針の提案まで\n- テックリード: 待つだけじゃない。何をどう実現できるかを先に考える（作り方・工数感・リスク）\n- PM: 二人の情報と提案を総合して次の方針を決める\n\n## Loop (everyone, every cycle)\n仮説 → 検証 → 振り返り → 仮説の更新 → 方針の修正\n\n## Exploration (revised)\n- 候補は絞らず増やす。カバレッジが狭いあいだは「いまの一本が最適」とみなさない\n- 作るかは後で判断\n- どう作るかの検討は、作る決断と独立して進めてよい\n\n## Language (all talk)\n- James向けも、ボット同士も [natural-japanese](sand-workflow:natural-japanese)\n- 参照: https://github.com/coji/natural-japanese\n\n## Breadth before depth\n- 未調査の業界・分野が多いあいだは、具体候補の深掘りを抑えめに\n- coverage.md の空マスを先に埋める（目安: 新規分野7割 / 既知の深掘り3割）\n- どう作るかの詳細は、地図がある程度埋まるまでカテゴリ単位\n\n## Research lenses (James 2026-09-07)\n業界マップだけでは足りない。次も併用する。\n\n1. **ユーザー目線** — 伸びてるアプリ／サービスから需要を読む。アプリストア以外に YouTube・TikTok など「人が時間を使ってる場所」も見る\n2. **マクロ／投資家目線** — 株やマクロを見る人が押さえる世間の動向（テーマ、資金の流れ、規制・景気の話）を軽く追う\n3. **業界の一次置き場** — 分野ごとに「最新」と「これまでの前提」をどこで取るかを決めておく（省庁、業界紙、協会、大手レポートなど）\n4. **価値観軸** — 業界とユーザー需要は一致しない前提。便利・安心・コスパ・自分らしさ、みたいな価値観や生活シーンでも切る\n\n業界カバー（coverage.md）は残す。ただし調査配分に、ユーザー目線・価値観軸・マクロを混ぜる。\n\n\n## Industry primary places (growing)\n- 物流: 国交省ポータル（PMメモ・一次置き場候補）\n- 家計・消費: 総務省家計調査（月次）\n- メディア利用時間: 総務省情報通信政策研究所の年次調査\n", "modified": "2026-09-09T00:18:51.700905+00:00"}, "search_history.md": {"text": "# Search history\n\nLog scout runs so queries do not loop.\n\n## 2026-09-07 — first open-field scout (アナリスト)\nQueries:\n- Product Hunt top launches September 2026 micro SaaS\n- rising demand indie hacker SaaS ideas 2026 AI tools small businesses\n- trending Chrome extensions tools 2026 productivity AI\n- ChatGPT Claude Gemini search export organize chats extension demand 2026\n- SaaS spend zombie seat const labels={'coverage.md':'分野の地図','hypotheses.md':'仮説・方針','signals.md':'シグナル','opportunities.csv':'候補','preferences.md':'調査の前提・好み','search_history.md':'検索履歴','portfolio.md':'ポートフォリオ'};
const statuses={parked:'保留',candidate:'候補',signal:'シグナル',building:'作成中',killed:'終了',shipped:'公開済み'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urlPattern=/https?:\/\/[^\s<>"\u3000]+/g;
function urls(s){return [...new Set((s.match(urlPattern)||[]).map(u=>u.replace(/[)\]。,、]+$/g,'')))];}
function linked(s){let out='',last=0;for(const m of s.matchAll(urlPattern)){const u=m[0].replace(/[)\]。,、]+$/g,'');out+=esc(s.slice(last,m.index))+`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`;last=m.index+u.length;}return out+esc(s.slice(last));}
function sections(file){const text=sources[file].text;const matches=[...text.matchAll(/^## (.+)$/gm)];return matches.map((m,i)=>({id:String(i),title:m[1],text:text.slice(m.index,matches[i+1]?.index??text.length).trim(),file}));}
const coverage=sources['coverage.md'].text.split('\n').filter(l=>l.startsWith('|')).slice(2).filter(l=>!/^\|\s*[-:]/.test(l)).map((l,i)=>{const c=l.split('|').slice(1,-1).map(s=>s.trim());return {id:String(i),title:c[0],status:c[1],text:c[2],file:'coverage.md'};});
const collections={hypotheses:sections('hypotheses.md'),signals:sections('signals.md'),opportunities:data.opportunities,coverage};
function sourceLink(file){return `<a href="#sources/${encodeURIComponent(file)}">${esc(file)} の原文を見る</a>`;}
function badge(s){return `<span class="badge" data-state="${esc(s)}">${esc(statuses[s]||s)}</span>`;}
function references(text){const links=urls(text);return `<section class="panel"><h2>根拠・参照リンク <span class="meta">${links.length}件</span></h2>${links.length?`<ul class="links">${links.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></li>`).join('')}</ul>`:'<p class="muted">この項目にURLの記載はありません。ソースファイルから周辺の記述を確認できます。</p>'}</section>`;}
function overview(){return `<h2>調査ストックを見渡す</h2><p class="muted">項目を開くと、その記述と参照リンクを確認できます。</p><div class="notice">ファイル間で方針や状態が一致しない場合があります。例：portfolio.md の003は初回の推奨、opportunities.csv では保留です。記録を統合せず、それぞれの出典を表示しています。</div><div class="grid">${Object.entries(collections).map(([key,items])=>`<a class="card" href="#${key}"><div class="meta">${names[key]}</div><div class="stat">${items.length}<span class="meta"> ${key==='coverage'?'分野':key==='opportunities'?'件':'記録'}</span></div><p>${key==='hypotheses'?'検証・振り返り・方針変更を辿る':key==='signals'?'観測した需要と根拠を読む':key==='coverage'?'見た／薄い／まだを確認する':'状態・見立て・判断メモを読む'} →</p></a>`).join('')}</div><section class="panel"><h2>判断の前提に戻る</h2><p>${sourceLink('preferences.md')}</p><p>${sourceLink('search_history.md')}</p><p>${sourceLink('portfolio.md')}</p><p class="muted">仮説・シグナルはソース内の見出し順です。同日の記録もあり、「最新順」とは限りません。</p></section>`;}
function listing(key){const items=collections[key];return `<h2>${names[key]}</h2><p class="muted">${key==='coverage'?'業界・分野のカバレッジです。地理地図ではありません。':key==='opportunities'?'CSVに記録された状態をそのまま表示します。点数の尺度はソースに定義されていません。':'各カードはソース内の「##」見出し単位。記録の並びは原文順です。'}</p><div class="toolbar"><input id="query" type="search" aria-label="表示中の項目を絞り込み" placeholder="この一覧の記述を絞り込み">${['coverage','opportunities'].includes(key)?`<select id="status" aria-label="状態"><option value="">すべての状態</option>${[...new Set(items.map(x=>x.status))].map(s=>`<option value="${esc(s)}">${esc(statuses[s]||s)}</option>`).join('')}</select>`:''}</div><p class="meta" id="count" aria-live="polite"></p><div class="grid" id="cards"></div><p>${sourceLink(key+'.'+(key==='opportunities'?'csv':'md'))}</p>`;}
function updateList(key){const q=document.getElementById('query').value.toLowerCase(),state=document.getElementById('status')?.value;const list=collections[key].filter(x=>JSON.stringify(x).toLowerCase().includes(q)&&(!state||x.status===state));document.getElementById('count').textContent=`${list.length} / ${collections[key].length}件`;document.getElementById('cards').innerHTML=list.map(x=>`<a class="card" href="#${key}/${encodeURIComponent(x.id)}">${x.status?badge(x.status):'<span class="badge">記録</span>'}<h3>${esc(x.title)}</h3><p class="preview">${esc(x.why_now||x.text)}</p><span class="meta">${esc(x.field||x.file||'opportunities.csv')} · 詳細を見る →</span></a>`).join('')||'<p class="empty">一致する項目はありません。条件を変えてください。</p>';}
function detail(key,id){const item=collections[key].find(x=>x.id===id);if(!item)return '<h2>項目が見つかりません</h2><a href="#overview">全体に戻る</a>';const file=key==='opportunities'?'opportunities.csv':item.file;const fieldNames={id:'ID',title:'候補名',field:'分野',status:'状態（原文）',demand_score:'需要スコア',cost_score:'コストスコア',speed_to_ship_days:'出すまでの日数',why_now:'なぜ今か',evidence_links:'根拠リンク',build_brief_path:'ブリーフのパス',created:'作成日',updated:'更新日',kill_or_grow_notes:'継続・中止の判断メモ'};return `<a class="back" href="#${key}">← ${names[key]}の一覧</a><h2>${esc(item.title)}</h2><p class="meta">出典：${sourceLink(file)}</p>${item.status?badge(item.status):''}<section class="panel">${key==='opportunities'?`<dl>${Object.entries(item).map(([k,v])=>`<dt>${esc(fieldNames[k]||k)}</dt><dd>${v?linked(v):'<span class="muted">未記入</span>'}</dd>`).join('')}</dl>`:`<h3>${key==='coverage'?'分野メモ':'記録本文（原文に近い表示）'}</h3><div class="verbatim">${linked(item.text)}</div>`}</section>${references(key==='opportunities'?item.evidence_links||'':item.text)}<details class="panel"><summary>ソースファイル全体の原文</summary><pre>${esc(sources[file].text)}</pre></details>`;}
function sourcePage(id){if(!id)return `<h2>ソースファイル</h2><p class="muted">生成時に読み込んだ7ファイルの全文です。</p><div class="grid">${Object.entries(sources).map(([file,s])=>`<a class="card" href="#sources/${encodeURIComponent(file)}"><h3>${labels[file]}</h3><p>${file}</p><span class="meta">更新：${esc(s.modified)}</span></a>`).join('')}</div>`;if(!sources[id])return '<p>ファイルが見つかりません。</p>';return `<a class="back" href="#sources">← ソースファイル一覧</a><h2>${esc(labels[id])}</h2><p>${esc(id)} · <a href="../${encodeURIComponent(id)}" target="_blank" rel="noopener">親ディレクトリの実ファイルを開く</a></p><p class="meta">以下は生成時点の原文です。URLのみリンク化しています。</p><div class="panel verbatim">${linked(sources[id].text)}</div>`;}
function render(){let parts;try{parts=decodeURIComponent(location.hash.slice(1)).split('/');}catch{parts=['overview'];}let [key,id]=parts;if(!names[key])key='overview';document.getElementById('nav').innerHTML=Object.entries(names).map(([k,v])=>`<a href="#${k}" ${key===k?'aria-current="page"':''}>${v}</a>`).join('')+'<p class="navnote">読む → 根拠を開く →<br>原文で確かめる</p>';const main=document.getElementById('main');main.innerHTML=key==='overview'?overview():key==='sources'?sourcePage(id):id!==undefined?detail(key,id):listing(key);if(collections[key]&&id===undefined){updateList(key);document.getElementById('query').addEventListener('input',()=>updateList(key));document.getElementById('status')?.addEventListener('change',()=>updateList(key));}document.title=`${names[key]} | GTM工場`;}
document.getElementById('snapshot').textContent=`収録：7ファイル · 生成：${data.generated.replace('T',' ').replace(/\.\d+\+00:00/,' UTC')} · ソース変更後は再生成してください`;
window.addEventListener('hashchange',()=>{render();document.getElementById('main').focus();window.scrollTo(0,0);});render();
</script></body></html>
