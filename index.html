<script id="snapshot-data" type="application/json">{"overview": {"id": "overview-rising-demand.md", "title": "最近伸びている需要：いま見えている全体像", "summary": "個別の業界メモを並べる前に、横断で何が前に出ているかを書く。一次が薄いところは薄いと書く。更新日: 2026-09-15", "text": "# 最近伸びている需要：いま見えている全体像\n\n個別の業界メモを並べる前に、横断で何が前に出ているかを書く。一次が薄いところは薄いと書く。更新日: 2026-09-15\n\n## いま前に出ている動き\n1. **制度や義務が先に動く需要** — 物流の荷待ち計測・報告など。市場が勝手に熱くなる前に、法律が計測と提出を要求している。\n2. **道具はあるのに現場に残らない** — 建設の施工管理、介護の周辺事務に近い。「入れたい」は高いが、Excelや紙が残る。厚くするより、二度手間を消す一点のほうが話が近い。\n3. **使う人が増えて、ルールや安心が後から追いつく** — 法律事務所の生成AI、リユースの品質保証。利用は広がるが、「疑われない」「誰が何を渡してよいか」がボトルネック。\n4. **生活は絞りつつ、体験と動画には時間が残る** — 家計のメリハリ（宿泊・外食）、スマホの時間は動画が長い。生活インフラのアプリは太い。\n5. **店舗では店長まわりの裏仕事が詰まっている** — 飲食。調理・接客より店舗管理の人手不足が目立つ、という政府側の整理。\n\n## 個別メモへの入口\n- 物流の荷待ち計測・報告 → `jp-logistics-wait-report.md`\n- 建設の施工管理は必要でもExcelが残る → `jp-construction-apps-dont-stick.md`\n- 介護は特養記録が埋まり、空くのは周辺と別層 → `jp-care-layers-not-one.md`\n- 法律事務所はAI利用が先、ルールが後 → `jp-law-firm-ai-rules-lag.md`\n- 飲食は店長・店舗の裏仕事が詰まっている → `jp-food-store-ops-shortage.md`\n- 家計は絞りつつ宿泊・外食は残る → `jp-merihari-consumption.md`\n- スマホ上位は生活インフラ、時間は動画 → `jp-phone-daily-stack.md`\n- 中古は安さより品質保証が先 → `jp-reuse-quality-trust.md`\n- AI課金は席より「効いたか」 → `ai-pricing-renewal.md`\n- 横断：薄い道具は選ぶ・比べる・下調べ向き → `thin-tools-choose-compare.md`\n\n## まだ弱いところ\n塾の料金、小規模大家、農業の軽い事務は一次が足りず、メモにしていない。製造は見える化の話があるが、需要の「伸び」としてはまだ薄い。\n"}, "markets": [{"id": "ai-pricing-renewal.md", "title": "AIの課金は席より「効いたか」。更新で残るかどうかが問われている", "summary": "AIツールの課金需要は、人数（席）より使った量や成果に寄っている。更新で残らない。効き目が見えないと、更新のタイミングで削られる。2026年の課金の整理でも、席だけに頼らない形（利用量・ワークフロー・成果、その混ぜ）が増えており、売り手は席の数より効き目の見せ方を先に設計する必要がある、と読める。", "text": "# AIの課金は席より「効いたか」。更新で残るかどうかが問われている\n\n## ひとことで\nAIツールの課金需要は、人数（席）より使った量や成果に寄っている。更新で残らない。効き目が見えないと、更新のタイミングで削られる。2026年の課金の整理でも、席だけに頼らない形（利用量・ワークフロー・成果、その混ぜ）が増えており、売り手は席の数より効き目の見せ方を先に設計する必要がある、と読める。\n\n## これまで\nSaaSは席課金が当たり前だった。AIでも、まず席や定額で入り、効果はあとで見る、という売り方が多かった。導入そのものが目的になりやすかった時期もある。\n\n## いま\n形が変わっている。Bessemerの課金の整理では、席だけに頼らない形（利用量、ワークフロー、成果、その混ぜ）が増えている。成果課金は分かりやすい一方で、何をもって成功とするかの定義が難しい。\n\n更新のタイミングでは、効果が曖昧なままの道具は削られやすい、という見立てがある。devtoolsでも、ただ動かすだけでなく、あとで見返せる改善やルールに落ちるものが注目されやすい。\n\n## なぜ今か\n入れればよい、という時期は終わりつつある。残す理由が要る。測れない便利さは、熱くても更新で落ちやすい。\n\n## まだ分からないこと\n日本の中小で、成果課金がどこまで通るかは未確認だ。個人開発の薄いツールが、この圧力にどう応答すべきか。数字の見せ方の最小セットは何か。\n\n## 根拠\n- Bessemer Venture Partners「The AI pricing playbook for founders」（2026）\n- 同系統の解説・二次整理（席の比率低下、ハイブリッド増、などの要約）\n"}, {"id": "jp-care-layers-not-one.md", "title": "介護の記録ソフトは特養ではほぼ埋まった。空いているのは周辺と施設以外の層", "summary": "介護でいま動いている需要は、特養の介護記録ソフトそのものではない。都内特養の定点では導入95%前後とほぼ埋まっている。伸びているのは音声入力・議事録・文書作成など周辺と、訪問・通所など施設以外のレイヤだ。厚い一点を特養記録に置くのは遅く、空いている可能性があるのは周辺と別レイヤ、と読める。", "text": "# 介護の記録ソフトは特養ではほぼ埋まった。空いているのは周辺と施設以外の層\n\n## ひとことで\n介護でいま動いている需要は、特養の介護記録ソフトそのものではない。都内特養の定点では導入95%前後とほぼ埋まっている。伸びているのは音声入力・議事録・文書作成など周辺と、訪問・通所など施設以外のレイヤだ。厚い一点を特養記録に置くのは遅く、空いている可能性があるのは周辺と別レイヤ、と読める。\n\n## これまで\n記録は紙と手書き、連絡はPHSや電話が中心、というイメージが長かった。介護ソフト自体は入所系から先に広がり、国の補助やLIFE（科学的介護情報システム）も施設側を後押ししてきた。一方で「介護テクノロジー」という言葉は、リフトや見守りセンサーなどハードも含めて語られがちで、ソフトの飽和とハードの伸び悩みが同じ言葉の中で混ざりやすかった。\n\n## いま\n都内特養の定点調査（令和7年度。会員511施設中、有効回答343、回収率67%。ICTソフト設問はおおむね280前後が回答）では、介護記録ソフトの導入率は95.05%、日常的に使っているのは92.58%だった。前年も導入は9割超で、ここはほぼ埋まっている。\n\n同じ調査で、周辺は別の姿になる。音声入力は導入24.11%に対し日常活用は10.28%で、入れても日常で使えない施設が多い。議事録作成ソフトは導入が前年2.51%から18.09%へ、文書作成ソフト（ChatGPT等）は6.90%から17.73%へ跳ねた。日常活用はどちらも約11%で、関心は高いがまだ薄い。インカムは導入33.81%、日常活用24.91%。勤務表作成は導入16%前後にとどまる。\n\n国の側も動いている。厚労省の令和6年度改定後の効果検証（令和7年9〜11月、回答約6,875事業所）では、入所・居住・泊まり系で介護業務支援機器の導入が56.4%（前回調査時10.2%）、見守り支援機器が47.2%（同30.0%）と上がった、と結果概要に出ている。特養では介護テクノロジーを何かしら入れているところが約9割、という報道整理もある。ただ「生産性向上推進体制加算」まで見ると、加算Ⅱは特養でも請求ベースで3割前後、加算Ⅰは数％台で、導入したことと加算まで取れる運用は別問題だ。\n\n訪問・通所は、特養の記録ソフト飽和と同じ物差しでは切れない。厚労省委託の在宅系調査では、介護ロボットは訪問・通所とも未導入が9割前後で、費用が壁、という答えが多い。一方で連絡手段としてのスマホはほぼ当たり前で、記録の入力端末も据え置きPCがまだ厚い。レイヤが違う。\n\n## なぜ今か\n2024年度改定で生産性向上推進体制加算が入り、「見守り・インカム・記録ソフト」が制度の顔になった。賃上げ・職場環境の補助要件にも絡み始めている。特養では記録の土台が先に埋まり、関心が文書や議事録、生成AI寄りの周辺に移っている、と都高齢協もまとめている。\n\n推定だが、工場が狙う「薄い一点」を特養の記録ソフトに置くのは遅い。空いている可能性があるのは、(1) 特養でも導入と活用が割れている周辺（音声、議事録、文書）、(2) 訪問・通所・小規模居住など、施設記録ソフトとは別の運用の層、の二つだ。どちらも既存ベンダーと補助金の重力は強い。建設の「必要だが定着しない」に近いが、介護の特養記録はすでに定着側に寄っている。\n\n## まだ分からないこと\n訪問・通所・グループホームで、介護記録ソフトそのものの導入・日常活用が特養と比べてどれだけ薄いか。同じ定義の全国一次が、まだ揃いきっていない。音声や議事録を「入れたのに使わない」理由（音声認識の精度、記録様式との噛み合い、現場の余力）も、一次では切れていない。\n\n加算Ⅰまで取れない現場が、本当に欲しいのが薄いツールなのか、運用人材なのか。既存の大手介護ソフトの掲示板・シフト機能で足りているのか。ここも推定の域を出ない。\n\n## 根拠\n- （一次）東京都社会福祉協議会・東京都高齢者福祉施設協議会「令和7年度 デジタル機器（介護ロボット・ICT機器）等の導入及び活用に関する実態調査 報告書」https://www.tcsw.tvac.or.jp/bukai/kourei/chosa/documents/R7digital.pdf\n- （一次）厚生労働省「介護現場における生産性の向上等を通じた働きやすい職場環境づくりに資する調査研究事業（結果概要）」https://www.mhlw.go.jp/content/12300000/001696334.pdf\n- （一次寄り・委託）三菱総合研究所「訪問系や通所系サービスにおける介護ロボット・ICT等のテクノロジー活用…実態調査研究事業」報告書 https://pubpjt.mri.co.jp/pjt_related/roujinhoken/f6rq9400000012ed-att/R6_099_2_report.pdf\n- （二次・報道整理）CBnews「特養の9割で介護テクノロジー導入」（厚労省調査の紹介）https://www.cbnews.jp/news/entry/20260218174816\n"}, {"id": "jp-construction-apps-dont-stick.md", "title": "建設の施工管理は「必要」が9割超なのに、現場に残るのはまだExcel", "summary": "建設現場では施工管理をデジタル化したい、という需要はかなり共有されている。必要だと答えた人は9割を超える一方、主な手段はまだExcelで、クラウド型アプリ中心は1割未満だ。入れても二重入力で定着しない。足りないのは機能のカタログではなく、現場で使い続けられる一点の運用だ。", "text": "# 建設の施工管理は「必要」が9割超なのに、現場に残るのはまだExcel\n\n## ひとことで\n建設現場では施工管理をデジタル化したい、という需要はかなり共有されている。必要だと答えた人は9割を超える一方、主な手段はまだExcelで、クラウド型アプリ中心は1割未満だ。入れても二重入力で定着しない。足りないのは機能のカタログではなく、現場で使い続けられる一点の運用だ。\n\n## これまで\n日報、写真、工程、元請けへの提出様式は、Excel や紙で回すのが当たり前だった。DX の話は「入れれば進む」側に寄りやすく、現場の一日の動きまでは見ないことが多かった。\n\n## いま\n現場TECHが2026年3月に建設業従事者426人へ行った調査では、施工管理のデジタル化を必要だと答えた人が92.5%いる一方、主な手段は Excel 等の PC ソフトが68.5%、紙・手書きが12.7%、クラウド型の施工管理アプリ中心は8.5%にとどまる。\n\n施工管理アプリを「導入している」は31.9%。規模が大きいほど導入は進み、小規模では1割未満、大企業ではおよそ7割、という開きがある（同調査）。\n\n導入したあとも話は終わらない。アプリを入れた企業でも、業務の中心はまだ Excel、と答えた割合は62.5%。\n\nなぜ進まないか。現場で定着しない（36.9%）、操作の習得負担（35.9%）、既存の Excel・紙への転記による二重管理（32.2%）が上位に並ぶ。元請けへの提出が指定の Excel 様式のままだと、アプリに入れてもまた転記が要る。道具が増えたぶん、仕事が増える、という形になりやすい。\n\n導入済み企業の不満でも、現場定着、機能が多すぎて使いこなせない、操作性が並ぶ。乗り換え・追加を検討する理由でも、操作性が約半数と先頭に来る。\n\n負荷が高い作業としては、関係者との連絡・調整、日報・報告書、写真管理が上位に挙がる。ここは「機能を足す」より「同じことを二度やらない」側の話に近い。\n\n## なぜ今か\n働き方の上限や人手不足で、現場の余力は減っている。必要だという声は強いのに、道具を増やしただけでは仕事が増えるだけ、という経験が溜まっている、と読む。\n\n推定だが、薄い道具が刺さるとしたら、全部入りの施工管理スイートより、二重入力を減らす一点、あるいは元請け様式とのつなぎを楽にする一点のほうだろう。逆に、機能を足して厚くした製品は、定着の壁を高くしやすい。\n\n## まだ分からないこと\nこの調査は比較メディア側のインターネット調査で、国の統計ではない。サンプルの偏りはあるはずだ。職種（元請け／専門工事）、地方と都市、工種ごとの差はここからは切れない。\n\n「薄い一点ツール」が実際に払われるのか、既存大手（ANDPAD など）の隙間がどこまで空いているかも、まだ見ていない。小規模大家や介護の記録ソフトとは別レイヤで、提出様式の強制がどれだけ効いているかを、一次（国交省・業界団体）でも確認したい。\n\n## 根拠\n- （二次・調査）現場TECH「施工管理DX実態調査」（2026年3月、n=426）https://kensetsu.gemba-tech.jp/research/survey-sekokanridx/\n- （二次・調査）現場TECH「施工管理アプリの導入実態調査2026」（2026年3月調査／同年5月公開、n=426）https://kensetsu.gemba-tech.jp/research/survey-sekokanriapps-2026/\n- （二次・報道）ITmedia ビジネスオンライン、同調査の要約（2026年4月）https://www.itmedia.co.jp/business/articles/2604/03/news005.html\n"}, {"id": "jp-food-store-ops-shortage.md", "title": "飲食で足りないのは調理より店長。店舗の裏仕事が先に詰まっている", "summary": "飲食でいちばん足りないのは、調理や接客そのものではない。店舗管理を回す人だ。店長の有効求人倍率は約10倍と、接客・調理より高い。シフト、在庫・発注、売上の入力と見方、スタッフの人事に時間が吸われている。政府の省力化メニューにも、ロボットだけでなく店舗管理向けITが入っている。", "text": "# 飲食で足りないのは調理より店長。店舗の裏仕事が先に詰まっている\n\n## ひとことで\n飲食でいちばん足りないのは、調理や接客そのものではない。店舗管理を回す人だ。店長の有効求人倍率は約10倍と、接客・調理より高い。シフト、在庫・発注、売上の入力と見方、スタッフの人事に時間が吸われている。政府の省力化メニューにも、ロボットだけでなく店舗管理向けITが入っている。\n\n## これまで\n人手で回す前提が長かった。注文は口頭や紙。売上は手書きやExcel。発注は勘と経験。予約やPOS、モバイルオーダーが入っても、店の裏仕事まで一気に軽くなった店は少なかった、と政府側の整理でも読める。\n\n## いま\n数字がきつい。農林水産省・厚生労働省の「省力化投資促進プラン（飲食業）」（令和7年6月）では、飲食の従業者は約400万人、パート・アルバイトが約8割、資本金5,000万円未満が98％。有効求人倍率（令和5年度）は飲食店店長が約10倍、接客が約5倍、調理が約2.9倍で、地方の方が高い傾向もある。従業員1人あたり付加価値は約219万円。全産業より低く、時系列でも漸減だ。\n\n政府は2029年度までに労働生産性を35％上げる目標を置き、2025〜2029年を集中投資の期間にしている。令和8年2月には業界行動計画としてのガイドブックも出た。そこに並ぶのは調理ロボットや配膳ロボットだけではない。在庫・発注、販売管理、勤怠・シフト、教育動画など、店舗管理向けのITもメニューに入っている。小規模・個人の「平均的な水準」では、店舗管理の省力化が進んでいない、という整理もある。\n\n## なぜ今か\n不足の芯が「店を回す役」に寄っている。省力化投資補助金やIT導入補助金、公庫融資といった後押しも、設備とあわせて店舗管理のITに触れている。需要が急に生まれた、というより、足りなさが数値で見え、投資の話が揃ってきた、と読むのが近い（推定含む）。\n\nただ、カタログの顔はロボットや厨房機器が目立つ。町の一店が本当に詰まっているのがシフトと発注なのか、配膳ロボットなのか。プランだけではまだ切れない。\n\n## まだ分からないこと\n店舗管理ソフトの導入率や定着率の一次がない。Excelや紙のままの店がどれだけかも分からない。都市と地方、業態の差も未確認だ。建設のメモで見た「入れてもExcelが残る」が、飲食でも起きているかは不明。政策の本丸は、数店舗を持つ中小を中堅へ伸ばす支援なので、町の一店向けに薄い一点が空いているかまでは、まだ言えない。\n\n## 根拠\n- 農林水産省・厚生労働省「省力化投資促進プラン ―飲食業―」（令和7年6月13日）https://www.cas.go.jp/jp/seisaku/atarashii_sihonsyugi/shouryokukatousi/01.pdf\n- 農林水産省「飲食店の未来を変える自動化・省力化ガイドブック」（省力化投資促進業界行動計画、令和8年2月公表）https://www.maff.go.jp/j/shokusan/gaisyoku/syoryokuka.html\n- 同プランが引用する厚生労働省「職業安定業務統計」、経済産業省「企業活動基本調査」等\n"}, {"id": "jp-law-firm-ai-rules-lag.md", "title": "法律事務所は生成AIを使い始めた。事務所のルールが追いついていない", "summary": "法律事務所では、生成AIを業務に載せ始めた人が関心層で約7割まで広がっている。ルールは追いついていない。事務職員向けの研修やガイドラインはまだ薄い。使う人が先で、事務所としての枠が後から来る。需要の芯は機能カタログではない。「誰が・何を・どこまでAIに渡してよいか」の決まり方にある。", "text": "# 法律事務所は生成AIを使い始めた。事務所のルールが追いついていない\n\n## ひとことで\n法律事務所では、生成AIを業務に載せ始めた人が関心層で約7割まで広がっている。ルールは追いついていない。事務職員向けの研修やガイドラインはまだ薄い。使う人が先で、事務所としての枠が後から来る。需要の芯は機能カタログではない。「誰が・何を・どこまでAIに渡してよいか」の決まり方にある。\n\n## これまで\n事務の軽量化は生成AIの前から進んでいた。同じ小委員会の2022年調査では、メール・カレンダー共有やファイル共有・事件管理を入れた事務所の多くで、事務職員の業務量が減ったと弁護士自身が答えていた（減少率は7〜8割前後）。当時、AI契約書レビューの導入はまだごく少なかった。\n\n並行して、民事裁判の手続もデジタル化が進んだ。裁判所の説明では、令和8年5月21日から改正民事訴訟法等が全面施行され、訴訟代理人はオンラインでの申立て等が原則義務になった。当面はmints（民事裁判書類電子提出システム）を使う。\n\n## いま\n日弁連の弁護士業務改革委員会・事務職員関連小委員会が、2026年3月23日〜4月27日に「事務職員と生成AIに関するアンケート」を実施した（有効回答223件）。対象は「主に事務職員を雇用する会員、または生成AIの利用に関心のある会員」なので、全弁護士の縮図ではない。その前提で読む。\n\n事務所での利用は広がっている。弁護士と事務職員がともに業務で使うが26.7%、弁護士のみが43.4%。いずれかの形で使う事務所は合わせて約7割だ。使っていないのは29.4%。禁止はほぼいない（0.5%）。ツールはGeminiが突出している（利用者のうち79.4%）。Google Workspaceに付いて追加料金が要らない、というのが報告書の読みだ。ChatGPTは49.7%、リーガルリサーチ特化型は29.7%（Legalscapeが名寄せで多い）。\n\n一方、事務所の方針は薄い。事務職員の利用について「特にルールはなく個人の判断に任せている」が31.8%で最多。推奨は24.5%、許可制・一定ルール下は10.6%。研修やガイドラインを「実施・策定済み」は10.1%、「予定はない」が41.2%だった。事務職員まで使わせている事務所では策定済みが24.6%なのに対し、弁護士のみ利用では1.1%。使わせてから体制を考える、という順番が見える。\n\n懸念の上位は正確性（68.1%）とセキュリティ・機密（63.2%）。期待する効果は、弁護士の負担軽減や時間短縮が中心で、人件費抑制を挙げたのはごく少数だった。実際に事務職員を雇っている層ほど、採用を大きく減らす見通しは弱い。\n\n制度側の押しもある。民事裁判IT化の義務化はすでに始まっている。会員向けの意識調査（弁護士ドットコム、2026年4月、n=301）では登録済みが86.7%でも、担当事件で未使用が39.1%という数字が出ている。登録と日常の使いこなしは別、という話だ（ベンダー調査なので、日弁連一次ほど強くは置かない）。\n\n## なぜ今か\n三つの圧力が重なっている、と読むのが近い。汎用の生成AIが関心層では約7割まで業務に入ったこと。裁判手続のオンライン義務化で「紙だけ」がやりにくくなったこと。そして、事務職員の定型作業が、共有ツールの時代からすでに縮み続けていること。この三つだ。\n\n足りないのは機能カタログではない。禁止より放置の方が多い。この調査の芯に見えるのは、「誰が・何を・どこまでAIに渡してよいか」の事務所内の決まり方だ（推定含む）。建設メモで見た「入れても定着しない」とは形が違う。こちらは「もう使っているのに、事務所としての枠が後から来る」。\n\n## まだ分からないこと\n関心層・事務職員雇用層に寄ったサンプルなので、無関心の一人事務所や大事務所の実態は別だ。税理士・社労士など他の士業で同じギャップがあるかも、公開の一次ではまだ薄い。日税連の実態調査は会員向け資料が主で、今回は数字まで追えていない。\n\n「安心」の需要が、ガイドラインの雛形なのか、学習しない契約の確認支援なのか、事件情報を入れない使い方の型なのか。調査だけでは切れない。また、Legalscapeなど特化型と汎用の使い分けが、小規模事務所でどこまで広がるかも未確認だ。\n\n## 根拠\n- 日本弁護士連合会「第24回弁護士業務改革シンポジウム 第2分科会資料」内「事務職員と生成AIに関するアンケート調査 報告書」（調査期間2026年3月23日〜4月27日、有効回答223件）。分科会資料であり日弁連見解ではない旨の注記あり https://www.nichibenren.or.jp/library/pdf/document/symposium/gyoukaku_sympo/24th_report_2.pdf\n- 裁判所「改正民訴法等で変わる民事訴訟手続の概要」（令和8年5月21日施行のオンライン申立て等）https://www.courts.go.jp/saiban/minjidejitaruka/minso_gaiyou/index.html\n- （参考・二次）弁護士ドットコム「民事裁判IT化に向けた弁護士への意識調査2026年版」（2026年4月、会員弁護士301名）https://www.bengo4.com/corporate/news/article/xn0to2-8fmfr/\n"}, {"id": "jp-logistics-wait-report.md", "title": "物流の荷待ちは、市場より先に制度が計測と報告を求めている", "summary": "物流でいま前に出ているのは、荷待ち・荷役を測って短くし、国に報告する需要だ。改正物流効率化法で、一定規模以上には中長期計画と取組状況の定期報告が義務になった。厚い倉庫システム全体ではない。「測る・集める・様式に落とす」一点が、制度で先に動いている。", "text": "# 物流の荷待ちは、市場より先に制度が計測と報告を求めている\n\n## ひとことで\n物流でいま前に出ているのは、荷待ち・荷役を測って短くし、国に報告する需要だ。改正物流効率化法で、一定規模以上には中長期計画と取組状況の定期報告が義務になった。厚い倉庫システム全体ではない。「測る・集める・様式に落とす」一点が、制度で先に動いている。\n\n## これまで\nいわゆる2024年問題で、運び側の余力は先に削られた。ドライバーの時間外に上限がかかったからだ。荷待ち・荷役はホワイトボードや手書き、Excelで残すことが多かった。荷主が施設ごとの平均を、毎年きちんと出す運用は、まだ薄かった。\n\n国交省の拘束時間調査では、2024年度時点の1運行あたり荷待ち・荷役等は約3時間台だった（内訳の合計は3時間18分前後）。\n\n## いま\n2025年4月から、荷主・物流事業者には荷待ち・荷役短縮などの努力義務がかかった。2026年4月に改正法が全面施行され、一定規模以上の特定事業者には中長期計画の提出と取組状況の定期報告が義務になった。特定荷主と特定連鎖化事業者には、物流統括管理者（CLO）の選任も要る。\n\n指定の目安は公式ポータルと説明資料で次のとおりだ。特定荷主・特定連鎖化事業者は取扱貨物重量9万トン以上（上位3,200社程度）、特定貨物自動車運送事業者等は保有車両150台以上（上位720社程度）、特定倉庫業者は保管量70万トン以上（上位70社程度）。第一種（主に発）と第二種（主に着）は合算せず、基準を超えた区分で届出する。経産省は令和8年7月31日時点の特定荷主等の指定状況とリストを公開している。\n\n手続の山は、いま中長期計画側にある。2026年度に限り提出は10月末目安、2027年度以降は7月末。定期報告（様式第5）は、指定を受けた翌年度から毎年度7月末まで。初回の定期報告は、2026年度指定分なら2027年7月末が目安になる。提出は原則 e-Gov の電子申請だ。\n\n定期報告ではチェックリストに加え、施設ごとの荷待ち時間等が要る。原則は荷待ちと荷役を分けて測る。算定の起算は、指示時刻があればその時刻から、なければ到着から、とポータルの算定ページで整理されている。サンプリングも、受渡しが一定時間以内（荷待ち時間等1時間以内など）なら報告を省略できる仕組みもある。ポータルは、デジタルで把握するのが望ましい、としている。\n\n国交省の2025年度拘束時間調査（実運送向け。調査は2025年11〜12月、内容は同年4〜8月の通常期の代表運行）では、1運行の平均拘束は10時間13分、荷待ち・荷役等は2時間2分だった（荷待ち約1時間、荷役約48分、附帯約14分）。前年調査から拘束は約1時間33分減り、うち荷待ち・荷役等の減が約1時間16分と大きい。努力義務の開始が寄与した、と国交省は見ている。目標は1運行2時間以内。長いケースはまだある、とも書いている。\n\n一方で、様式第5向けの専用サービスも出始めている。受付から完了までの時刻を取り、平均を報告用に落とすものだ（例: ヨビトラ、Rentals 荷待ち記録）。既存のWMSやバース予約はそのままにして、計測だけ足す、という売り方も見える。\n\n## なぜ今か\n義務の期限が切れている。2026年度の実績は、後から作れない。努力義務の年に平均は縮んだ。いま中長期計画の提出が迫り、その先に定期報告が続く。「測れていない」ことのコストが上がる、と読む。\n\n推定だが、厚い物流スイート全体より、荷待ちの一点計測と報告寄せのほうが、制度の形に沿って需要が立ちやすい。ただ、その一点にも専用サービスがすでに並び始めている。「空いている」とは言い切れない。\n\n## まだ分からないこと\n特定荷主の規模帯ごとに、いま何で測っているか。手書きか、Excelか、バース予約か、専用SaaSか。一次の分布はまだ掴めていない。指定リストは出たが、現場の計測手段までは載っていない。\n\n運送会社や中小倉庫は義務の外でも、荷主からデータ提出を求められる、という二次の話はある。どこまで広がるかは未確認だ。建設の施工管理と同じ「二度入力」が現場で起きているか。制度対応の薄いツールが本当に払われるか。既存の予約システムとの隙間がどれだけ空いているか。ここも、まだ切れていない。\n\n## 根拠\n- （一次）国土交通省「物流効率化法」理解促進ポータル https://www.revised-logistics-act-portal.mlit.go.jp/\n- （一次）同ポータル／定期報告（計測・サンプリング・報告省略） https://www.revised-logistics-act-portal.mlit.go.jp/regular-report/\n- （一次）同ポータル／荷待ち・荷役等の算定方法 https://www.revised-logistics-act-portal.mlit.go.jp/method/\n- （一次）同ポータル／荷主判断基準解説書 https://www.revised-logistics-act-portal.mlit.go.jp/files/pdf/sippers-judgment-criteria-book.pdf\n- （一次）経済産業省「物流効率化法について」（様式第1〜5、対応の手引き、指定状況・リスト、判断基準解説） https://www.meti.go.jp/policy/economy/distribution/butsuryu-kouritsuka.html\n- （一次）国土交通省説明資料「物流効率化法における特定事業者の指定の届出及び統括物流管理者の選任について」（指定基準・スケジュール） https://www.mlit.go.jp/jidosha/content/002005608.pdf\n- （一次）国土交通省 報道発表「トラックドライバーの１運行当たりの平均拘束時間に関する調査結果の公表」（2025年度） https://www.mlit.go.jp/report/press/tokatsu02_hh_000084.html\n- （一次）同上・調査結果PDF https://www.mlit.go.jp/report/press/content/002011131.pdf\n- （二次・製品）ヨビトラ、Rentals 荷待ち記録など、様式・計測寄せの公開説明（存在確認用。導入率の一次ではない）\n"}, {"id": "jp-merihari-consumption.md", "title": "家計は全体を絞りつつ、宿泊と外食のご褒美は残している", "summary": "家計全体の消費は、実質でマイナスが続く。宿泊や外食には、まだお金が動いている。総務省の家計調査（2026年7月分）では、二人以上世帯の消費支出が実質前年同月比マイナス3.6%なのに対し、宿泊料は実質プラス24.5%、外食はプラス5.9%だった。生活費は抑え、体験のご褒美は残すメリハリ需要だ。ただ現場は予約・決済・席の…", "text": "# 家計は全体を絞りつつ、宿泊と外食のご褒美は残している\n\n## ひとことで\n家計全体の消費は、実質でマイナスが続く。宿泊や外食には、まだお金が動いている。総務省の家計調査（2026年7月分）では、二人以上世帯の消費支出が実質前年同月比マイナス3.6%なのに対し、宿泊料は実質プラス24.5%、外食はプラス5.9%だった。生活費は抑え、体験のご褒美は残すメリハリ需要だ。ただ現場は予約・決済・席の話になりやすく、小さなツールで取りに行きやすいとは限らない。\n\n## これまで\n節約といえば、外食や旅行から切る、というイメージが強かった。全体の消費が弱いときは、娯楽や外出も一緒に沈みやすかった。\n\n## いま\nマイナスは8か月続いている。全部を削っているわけではない。調理食品や飲料は減っている、という報道もある。日々の積み重ねは抑えつつ、泊まる・外で食べるには予算を残している、と読める。\n\n## なぜ今か\n物価高で生活防衛の圧力はある。同時に、節約疲れや「自分へのご褒美」も前から言われてきた。家計調査は、その両方が同居していることを裏づけている、と見る。\n\nただ、宿泊も外食も、予約や決済や席の話になりやすい。需要が熱いから、小さなツールで取りに行きやすい、とは限らない。\n\n## まだ分からないこと\nこのメリハリが、どの年代・所得帯で強いか。旅行と近場の外食のどちらが主か。物価が落ち着いたあとも続くか。\n\n## 根拠\n- 総務省統計局「家計調査報告」2026年7月分（2026年9月4日公表）\n- 同発表を伝える報道（宿泊・外食の伸び、調理食品・飲料の減少）\n"}, {"id": "jp-phone-daily-stack.md", "title": "日本のスマホ上位は生活インフラ。時間の中身では動画がいちばん長い", "summary": "日本でよく開かれる無料アプリは、予約や決済、LINE、天気など生活の土台が多い。時間の使い方では、ネットの中でもいちばん長いのが動画投稿・共有サービスの視聴だ。アメリカで目立った中古特化や予測市場の並びとは違う。国を混ぜると需要の地図が歪む。", "text": "# 日本のスマホ上位は生活インフラ。時間の中身では動画がいちばん長い\n\n## ひとことで\n日本でよく開かれる無料アプリは、予約や決済、LINE、天気など生活の土台が多い。時間の使い方では、ネットの中でもいちばん長いのが動画投稿・共有サービスの視聴だ。アメリカで目立った中古特化や予測市場の並びとは違う。国を混ぜると需要の地図が歪む。\n\n## これまで\nスマホの人気はゲームやSNSで語られがちだった。国ごとの差はあっても、同じグローバル地図でざっくり見ることが多かった。テレビとネットのどちらが長いかも、年によって揺れやすかった。\n\n## いま\n2026年9月前半の観測では、日本の無料ランキング上位に、LINE、決済、天気、予約（美容など）、短尺動画、AIチャットが並ぶ。Play側でも似た傾向がある。アメリカ側で目立っていた中古特化や予測市場は、同じ位置には来ていない。\n\n総務省情報通信政策研究所の令和7年度調査（実査は令和7年12月、概要は令和8年6月）では、全年代（13〜79歳）の平均利用時間は、平日インターネット183.9分・テレビ（リアルタイム）156.1分、休日はネット192.9分・テレビ189.2分。ネットがテレビを上回り、差は広がっている。60代以上の平日など、年代によってはまだテレビの方が長い。\n\nネットの中身では、平日・休日とも「動画投稿・共有サービスを見る」が最長で、平日全年代54.5分（行為者に限らない平均）。10代は平日127.2分、休日166.1分まで伸びる。利用率はLINE 92.9％、YouTube 81.5％、TikTok 36.7％（10代は67.9％）。オンデマンド型の動画共有は全年代84.7％。早く知るならネット、信頼できる情報となると全体ではまだテレビが強い、という構図も続いている。\n\n## なぜ今か\n日本では、スマホが「遊び場」だけでなく、支払い・予約・連絡の入口として先に埋まっている、と読める。そのうえで、余った注意の多くが動画に流れている。だから同じ「熱い」でも、国を混ぜると需要の地図が歪む。時間の奪い合いの相手は、テレビからネットへ、ネットの中ではテキストより動画へ、と移っている（推定含む）。\n\n## まだ分からないこと\niOSとAndroidでどこまで同じか（週次の揺らぎは大きい）。地方と都市の差。決済・予約のどれが「不便で困っている」のかは、ランキングだけでは分からない。動画の長さが、仕事や学習の道具需要にどうつながるかも、この調査だけでは言えない。\n\n## 根拠\n- Google Play 日本・無料アプリランキング（2026年9月7日前後の観測）\n- App Store 日本・無料週次の観測（PM、〜2026年9月6日）\n- 総務省情報通信政策研究所「令和7年度情報通信メディアの利用時間と情報行動に関する調査報告書（概要）」（令和8年6月）https://www.soumu.go.jp/main_content/001079136.pdf\n"}, {"id": "jp-reuse-quality-trust.md", "title": "中古は安さだけでは動かない。高額ほど品質保証が先に来る", "summary": "中古を検討する人は増えている。安さだけでは足りない。動かない。高額帯ほど「本物か」「傷はないか」が先に来て、品質保証がないと止まる人が多い一方、保証があると前に進む人も多い、という調査がある。疑われないことが、買う条件になっている。", "text": "# 中古は安さだけでは動かない。高額ほど品質保証が先に来る\n\n## ひとことで\n中古を検討する人は増えている。安さだけでは足りない。動かない。高額帯ほど「本物か」「傷はないか」が先に来て、品質保証がないと止まる人が多い一方、保証があると前に進む人も多い、という調査がある。疑われないことが、買う条件になっている。\n\n## これまで\nフリマや中古は、とにかく安く手に入れる場所、という印象が強かった。品質は自分の目と運に寄りがちだった。\n\n## いま\n物価が重い時期に、リユースを検討する人は増えている。メルカリの調査でもその動きは見える。一方で高額帯では、品質保証がないと止まる人が多い。保証があると、かなりの人が前に進む、という数字もある。\n\n日本のスマホでは、無料アプリの上位に予約や決済、生活インフラが並ぶ。アメリカで目立った中古特化アプリの並びとは違う。国をまたいで同じ地図を描くと歪む。\n\n## なぜ今か\n生活防衛で「賢く買う」圧力はある。疑ってから買う。安さより先に、疑われないことが条件になっている、と読める。\n\n## まだ分からないこと\nどこまで効くか。どの品目・価格帯で保証が効くのか。誰が保証のコストを払うのか。買取店など、フリマ以外でも同じ構造かは、まだ切れていない。\n\n## 根拠\n- メルカリ「リユースに関する意識調査」（2026年5月公表としてストック）\n- 日本のApp Store／Google Play無料ランキング（2026年9月前半の観測）\n"}, {"id": "thin-tools-choose-compare.md", "title": "横断の見立て：熱い需要そのものより、選ぶ・比べる・下調べの一点が薄い道具向き", "summary": "これは個別業界の需要メモではない。横断の見立てだ。人がたくさん集まる場所ほど、決済や信頼、在庫やプラットフォームが絡んで重くなりやすい。いまの前提で薄い道具が届きやすいのは、買う・予約する一段手前の「選ぶ・比べる・下調べ」、あとで見返せる記録、二度入力を消す一点だ。熱いからすぐ薄く作れる、ではない。", "text": "# 横断の見立て：熱い需要そのものより、選ぶ・比べる・下調べの一点が薄い道具向き\n\n## ひとことで\nこれは個別業界の需要メモではない。横断の見立てだ。人がたくさん集まる場所ほど、決済や信頼、在庫やプラットフォームが絡んで重くなりやすい。いまの前提で薄い道具が届きやすいのは、買う・予約する一段手前の「選ぶ・比べる・下調べ」、あとで見返せる記録、二度入力を消す一点だ。熱いからすぐ薄く作れる、ではない。\n\n## これまで\n熱い需要を見つけると、その熱い場所そのものにプロダクトを置きがちだった。アプリの上位や体験消費の伸びを、そのまま「作りやすい」と読み替えやすかった。\n\n## いま\n日本では予約・決済・LINEまわりが太い。壁が厚い。リユースでも、安いだけでなく品質保証がないと止まる。宿泊・外食は家計では伸びているが、現場は予約や席・決済の話になりやすい。\n\n一方で、AIまわりでは「席を売る」より「何が良くなったか」が見えることのほうが、あとで残りやすい、という話が出ている。devtoolsでも、セッションの結果をルールや記録として残す方向の動きがある。\n\n建設の施工管理でも、必要だという声は強いのに、専用アプリより Excel が残り、入れたあとも二重入力で定着しない、という数字が出ている（現場TECH調査、2026年3月）。機能を足すほど使いこなせない、という不満もある。\n\n重ねて読むと、熱いからすぐ薄く作れる、ではない。薄い道具向きなのは、買う前の比較や下調べ、あとで見返せる記録、そして「同じことを二度やらない」一点だと見る。\n\n## なぜ今か\n疑ってから買う空気が強い。成果が見えないと更新されない。だから「熱い市場に乗り込む」より、「判断や振り返りを軽くする」ほうが、小さく試しやすいはずだ、という推定。\n\n## まだ分からないこと\n空いている穴はどこか。「選ぶ・比べる」の具体的な困りごとで、まだ埋まっていない穴はどこか。devtoolsの「あとで見返せる記録」が、本当に払われるのか。建設で「二重入力を減らす一点」が本当に買われるのか。日本の生活アプリ上位のどれが不満で、どれが満足か。\n\n## 根拠\n- 日本のリユース品質不安（メルカリ調査）と、家計の宿泊・外食の伸び（家計調査）\n- 日本のスマホ無料ランキング観測（2026年9月前半）\n- Bessemer系のAI課金の議論（席より成果・更新で効き目が問われる）\n- 建設の施工管理定着ギャップ（現場TECH調査、2026年3月）→ `jp-construction-apps-dont-stick.md`\n"}], "generated": "2026-09-15T03:52:51.545432+00:00"}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('snapshot-data').textContent);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function link(label,url){return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;}
// HTMLは実行せず、HTTP(S)のリンクだけを有効にする。
function inline(text){
 const tokens=/`([^`]+)`|\[([^\]]+)\]\((https?:\/\/[^\s]+)\)|https?:\/\/[^\s<>]+|\*\*([^*]+)\*\*/g;
 let out='',last=0;
 for(const m of text.matchAll(tokens)){
  out+=esc(text.slice(last,m.index));
  if(m[1])out+=`<code>${esc(m[1])}</code>`;
  else if(m[2])out+=link(m[2],m[3]);
  else if(m[4])out+=`<strong>${esc(m[4])}</strong>`;
  else {const url=m[0].replace(/[。、，．）〉」』\]>]+$/g,'');out+=link(url,url)+esc(m[0].slice(url.length));}
  last=m.index+m[0].length;
 }
 return out+esc(text.slice(last));
}
function markdown(text){
 const lines=text.replace(/\r\n?/g,'\n').split('\n');let out='',paragraph=[],list='',code=null;
 const flush=()=>{if(paragraph.length){out+=`<p>${inline(paragraph.join('\n'))}</p>`;paragraph=[];}if(list){out+=`</${list}>`;list='';}};
 for(const line of lines){
  if(/^```/.test(line)){flush();if(code!==null){out+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;code=null;}else code=[];continue;}
  if(code!==null){code.push(line);continue;}
  const heading=line.match(/^(#{1,6})\s+(.+)$/),item=line.match(/^\s*(?:([-+*])|\d+\.)\s+(.+)$/);
  if(heading){flush();const level=heading[1].length;out+=`<h${level}>${inline(heading[2])}</h${level}>`;}
  else if(item){const type=item[1]?'ul':'ol';if(list!==type){flush();out+=`<${type}>`;list=type;}out+=`<li>${inline(item[2])}</li>`;}
  else if(!line.trim()){flush();}
  else if(/^>\s?/.test(line)){flush();out+=`<blockquote>${inline(line.replace(/^>\s?/,''))}</blockquote>`;}
  else{if(list)flush();paragraph.push(line);}
 }
 flush();if(code!==null)out+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;return out;
}
function render(){
 let id='';try{if(location.hash.startsWith('#markets/'))id=decodeURIComponent(location.hash.slice(9));}catch{id='?';}
 const main=document.getElementById('main');const memo=data.markets.find(m=>m.id===id);
 if(id){
  main.innerHTML='<a class="back" href="#markets">← 需要の全体像へ</a>'+(memo?`<article>${/^#\s/m.test(memo.text)?'':`<h1>${esc(memo.title)}</h1>`}${markdown(memo.text)}</article>`:'<h1>市場メモが見つかりません</h1><p>一覧から読みたいメモを選んでください。</p>');
 }else{
  main.innerHTML=`<article>${markdown(data.overview.text)}</article><section class="memo-list" aria-labelledby="memo-list-title"><h2 id="memo-list-title">個別の市場メモ <span class="meta">${data.markets.length}件</span></h2><div class="grid">${data.markets.map(m=>`<a class="card" href="#markets/${encodeURIComponent(m.id)}"><h3>${esc(m.title)}</h3><p>${esc(m.summary)}</p><span>全文を読む →</span></a>`).join('')||'<p class="empty">市場メモはまだありません。</p>'}</div></section>`;
 }
 document.title=`${memo?memo.title:id?'市場メモが見つかりません':data.overview.title} | GTM工場`;
}
document.getElementById('snapshot').textContent=`市場メモのスナップショット · 生成：${new Date(data.generated).toLocaleString('ja-JP',{timeZone:'UTC'})} UTC`;
window.addEventListener('hashchange',()=>{render();document.getElementById('main').focus();window.scrollTo(0,0);});render();
</script>
