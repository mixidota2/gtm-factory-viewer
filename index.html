7%、高額バッグで51.2%あったと記されています。一次記事で、誰を分母にした割合か、どのような保証を尋ねたかを再確認する作業は終わっていません。"}, {"id": "jp-coffee", "label": "日本：家庭のコーヒー購入支出・量", "period": "2024年9月〜2025年8月→2025年9月〜2026年8月", "population": "全国の二人以上世帯、1世帯当たり。家計調査のコーヒー購入。粉・粒・固形、インスタントを含み、液体飲料・喫茶代は別", "unit": "円／世帯・12か月、g／世帯・12か月、円／100g", "values": {"expenditure_previous": 8696, "expenditure_current": 11088, "expenditure_change_pct": 27.51, "quantity_previous": 2494, "quantity_current": 2501, "quantity_change_pct": 0.28, "unit_value_previous": 348.6768, "unit_value_current": 443.3427, "unit_value_change_pct": 27.15}, "source_urls": ["https://www.e-stat.go.jp/stat-search/file-download?fileKind=1\u0026statInfId=000040270650", "https://www.e-stat.go.jp/stat-search/file-download?fileKind=1\u0026statInfId=000040270651", "https://www.e-stat.go.jp/dbview?sid=0004023602"], "source_publication_date": "数量表：2026-10-09 08:30 JST（既存の取得情報で確認）。支出2ファイルの個別公表日は未確認。", "primary_read_scope": "選んだ24か月の支出と数量について、以前に元の表と照合した記録に基づきます。海外事例とつなぐ原稿を作成した際には、原典を閲覧し直していません。", "independent_verification_scope": "同じ24か月の入力データから、12か月合計と平均購入単価を計算し直した記録に基づきます。海外事例とつなぐ原稿を作成した際に、別の手順で再検証したわけではありません。", "unconfirmed": "支出の2ファイルそれぞれの公表日は確認できていません。購入量は、実際に飲んだ量ではありません。単身世帯、外食、市場全体の結果にも広げられません。平均購入単価は、品質や銘柄を固定した価格指数ではありません。", "evidence_type": "家計の購入支出・数量", "source_locator": "品目382。数量：表011、品目内部コード011020010、世帯03、地域00000、表章02、1g", "verification_as_of": "2026-10-16", "method_source_urls": [], "observation_text": "各12か月のコーヒー購入支出は、1世帯当たり8,696円から11,088円へ、27.51%増えました。購入量は2,494gから2,501gへ、0.28%増です。支出を数量で割った平均購入単価は、100g当たり348.6768円から443.3427円へ、27.15%上がっています。"}], "cards": [{"id": "es-hotel", "title": "スペインのホテル：延べ宿泊数は小幅増。販売した客室の平均収入はより大きく上昇", "entry": "2026年8月の延べ宿泊数は前年同月比+1.38%、販売済み客室の1室・1日当たり収入は+7.32%でした。宿泊の量が増えたことと、料金や売れた客室の構成が変わったことを分けて読みます。", "observations": ["es-nights", "es-adr", "es-annual"], "body": "## 延べ宿泊数は、国内居住者で減り、国外居住者で増えた\n\nホテルの延べ宿泊数は増えています。ただし、スペイン国内に住む人の宿泊は減り、国外に住む人の宿泊が増えています。分類は国籍ではなく居住地です。全体が増えたからといって、国内に住む人も旅行を増やしたとは言えません。\n\n## 泊数から、満足度や費用を払った人までは分からない\n\n利用者は国内外の宿泊者です。費用は本人、勤務先、旅行手配者などが負担し得ますが、この統計では分けられません。泊数は宿泊した量を示しており、立地や体験に満足したかを尋ねた結果ではありません。\n\n立地、体験、行きやすさが宿泊を支えているという解釈は可能です。ただし、価格改定、売れた客室の構成、客室の供給制約、為替の影響も考えられます。満足度や再訪との関係は、別に確かめる必要があります。\n\n## 延べ宿泊数と客室単価を掛けても、売上にはならない\n\n延べ宿泊数は、人の数に泊数を掛けた「人泊」です。一方、販売済み客室の1室・1日当たり収入を表すADRは、客室が単位です。人泊とADRを掛けても、単位が合わないため売上は計算できません。日本のコーヒーや米国の電力と同じく金額と量の違いを考える例ですが、日本の宿泊と数値を比べるには、対象とする施設の範囲もそろえる必要があります。\n\n## 追加で確かめたいこと\n\n同じ施設範囲で比較できるよう統計系列をそろえても、延べ宿泊数の増加が残るかを確認します。対象施設や構成の変化で増加を説明できるなら、宿泊需要が量的に拡大したという解釈は弱まります。満足度や再訪が伴わない場合も、体験への評価が増加を支えたという解釈を見直します。", "text": "# スペインのホテル：延べ宿泊数は小幅増。販売した客室の平均収入はより大きく上昇\n\n2026年8月の延べ宿泊数は前年同月比+1.38%、販売済み客室の1室・1日当たり収入は+7.32%でした。宿泊の量が増えたことと、料金や売れた客室の構成が変わったことを分けて読みます。\n\n## 延べ宿泊数は、国内居住者で減り、国外居住者で増えた\n\nホテルの延べ宿泊数は増えています。ただし、スペイン国内に住む人の宿泊は減り、国外に住む人の宿泊が増えています。分類は国籍ではなく居住地です。全体が増えたからといって、国内に住む人も旅行を増やしたとは言えません。\n\n## 泊数から、満足度や費用を払った人までは分からない\n\n利用者は国内外の宿泊者です。費用は本人、勤務先、旅行手配者などが負担し得ますが、この統計では分けられません。泊数は宿泊した量を示しており、立地や体験に満足したかを尋ねた結果ではありません。\n\n立地、体験、行きやすさが宿泊を支えているという解釈は可能です。ただし、価格改定、売れた客室の構成、客室の供給制約、為替の影響も考えられます。満足度や再訪との関係は、別に確かめる必要があります。\n\n## 延べ宿泊数と客室単価を掛けても、売上にはならない\n\n延べ宿泊数は、人の数に泊数を掛けた「人泊」です。一方、販売済み客室の1室・1日当たり収入を表すADRは、客室が単位です。人泊とADRを掛けても、単位が合わないため売上は計算できません。日本のコーヒーや米国の電力と同じく金額と量の違いを考える例ですが、日本の宿泊と数値を比べるには、対象とする施設の範囲もそろえる必要があります。\n\n## 追加で確かめたいこと\n\n同じ施設範囲で比較できるよう統計系列をそろえても、延べ宿泊数の増加が残るかを確認します。対象施設や構成の変化で増加を説明できるなら、宿泊需要が量的に拡大したという解釈は弱まります。満足度や再訪が伴わない場合も、体験への評価が増加を支えたという解釈を見直します。\n\n## 根拠と確認範囲\n\n### スペイン：ホテルの延べ宿泊数\n\n2026年8月の延べ宿泊数は4,879.8万人泊で、前年同月より1.38%増えました。国内居住者の延べ宿泊数は1.11%減、国外居住者は2.77%増でした。1〜8月累計では前年同期より1.45%増えています。1人が1泊すると1人泊と数えます。\n\n- 期間：2026年8月／2025年8月、2026年1〜8月／2025年1〜8月\n- 調べた対象・割合の分母：スペインのホテル・類似施設の宿泊者。国内・国外は居住地分類\n- 単位：人泊、前年同月・前年同期比%\n- 何を調べた値か：行動や取引を数えた集計\n- 出典の公表日：2026-09-22\n- 原典で確認した範囲：2026年8月分の公表表で、使用した数値の欄を確認しています。調査方法の資料では、対象、定義、過去の系列とのつながりに関する箇所を確認しています。収益の調査方法を説明する資料は、全ページを読了したわけではありません。\n- 別の手順で確かめた範囲：元の表の数値を別途照合し、延べ宿泊数の前年比と累計を計算し直しています。ADRと価格指数の増加率は、公表表に掲載された値との照合までで、前年の元の値から計算し直す作業はしていません。\n- 未確認の点・読み違えやすい点：速報値です。同じ人の重複を除いた宿泊者数、誰が料金を払ったかの内訳、旅行の目的は確認できていません。\n- 元資料の位置：EOH_Hoja1 I12/I22/K22/M22/I23\n- 出典：[原典1](https://www.ine.es/prensa/anexo_tablas/en/CTH0826_en.xlsx)\n\n補足資料：[定義・照合資料1](https://www.ine.es/en/daco/daco42/ocuphotel/meto_eoh_en.pdf) ／ [定義・照合資料2](https://www.ine.es/en/daco/daco42/irsh/meto_irsh_en.pdf)\n\n### スペイン：販売済み客室当たり収入と価格指数\n\n販売済み客室の1室・1日当たり収入（ADR）は166.90ユーロで、前年同月より7.32%上がりました。別の指標であるホテル価格指数は6.34%上昇しています。\n\n- 期間：2026年8月／2025年8月\n- 調べた対象・割合の分母：スペインのホテルの販売済み客室。価格指数は別の価格指標\n- 単位：ユーロ／販売済み客室・日、前年同月比%\n- 何を調べた値か：収入単価・価格指標\n- 出典の公表日：2026-09-22\n- 原典で確認した範囲：2026年8月分の公表表で、使用した数値の欄を確認しています。調査方法の資料では、対象、定義、過去の系列とのつながりに関する箇所を確認しています。収益の調査方法を説明する資料は、全ページを読了したわけではありません。\n- 別の手順で確かめた範囲：元の表の数値を別途照合し、延べ宿泊数の前年比と累計を計算し直しています。ADRと価格指数の増加率は、公表表に掲載された値との照合までで、前年の元の値から計算し直す作業はしていません。\n- 未確認の点・読み違えやすい点：ADRは、販売済み客室の1室・1日当たり収入です。総売上でも、品質を固定した価格指数でもありません。延べ宿泊数の単位である人泊と掛け合わせて、売上を求めることはできません。\n- 元資料の位置：IRSH C11/E11、IPH E12\n- 出典：[原典1](https://www.ine.es/prensa/anexo_tablas/en/CTH0826_en.xlsx)\n\n補足資料：[定義・照合資料1](https://www.ine.es/en/daco/daco42/ocuphotel/meto_eoh_en.pdf) ／ [定義・照合資料2](https://www.ine.es/en/daco/daco42/irsh/meto_irsh_en.pdf)\n\n### スペイン：2025年の宿泊数確報\n\n2025年の延べ宿泊数は、確報で約366,146,835人泊でした。前年比は+0.85%です。年初の速報値ではなく、確報値を採用しています。\n\n- 期間：2025年／2024年\n- 調べた対象・割合の分母：スペインのホテル・類似施設の宿泊者\n- 単位：人泊、前年比%\n- 何を調べた値か：行動や取引を数えた集計\n- 出典の公表日：2026-09-11（年次確報）、2026-09-22（月次表更新）\n- 原典で確認した範囲：2025年の確報表と現行の月次表で、使用した数値の欄を確認しています。\n- 別の手順で確かめた範囲：現行の月次表から年間の合計を別途計算し、確報の値と、数値がどちらの方向へ改定されたかを照合しています。\n- 未確認の点・読み違えやすい点：2019年まで、同じ条件で比較できる系列かは確認できていません。2025年には調査対象を分ける区分が変更されているため、その前後をまたぐ長期の成長率は採用していません。\n- 元資料の位置：年次表 EOH_Hoja1 I12/I22、月次表2009\n- 出典：[原典1](https://ine.es/en/daco/daco42/ocuphotel/eoh0025_en.xlsx) ／ [原典2](https://www.ine.es/jaxiT3/files/t/en/csv_bdsc/2009.csv)\n\n補足資料：[定義・照合資料1](https://www.ine.es/en/daco/daco42/ocuphotel/meto_eoh_en.pdf) ／ [定義・照合資料2](https://www.ine.es/en/daco/daco42/irsh/meto_irsh_en.pdf)\n"}, {"id": "uk-video", "title": "英国の動画配信：購読収入は増加。視聴時間の前年比は保留", "entry": "定額動画配信の購読収入は、2024年の43.7億ポンドから2025年の51.7億ポンドへ増えました。同年の家庭内での配信視聴時間は、利用しない人も含む英国の4歳以上全体で、1人1日42分です。ただし、2024年の時間が本文と図で食い違うため、視聴時間の前年比は保留しています。収入と時間は対象が違うため、別々に読みます。", "observations": ["uk-revenue", "uk-viewing", "uk-households"], "body": "## 収入・時間・世帯の割合は、それぞれ対象が違う\n\n購読収入は前年より増えました。42分という視聴時間は、定額制（SVoD）と広告型（AVoD）の動画配信を家庭内で見た時間です。一方、70%という値は、2026年第1四半期に定額動画配信を有料で契約している、または無料で試している世帯の割合です。この3つを同じ人の支払い・視聴の記録として結びつけることはできません。\n\n## 誰が使い、誰が払っているか\n\n視聴時間は英国の4歳以上全体を分母にしています。購読収入は契約側が払う料金で、広告主が払う広告費を含めません。契約・試用する世帯の割合も、人数や契約の総数とは違います。\n\n好きな時間に作品を見られることが、利用者に役立っている可能性はあります。ただし、今回の指標だけでは利用の動機や増収の原因は分かりません。料金改定や、複数サービスをまとめて売る契約なども関係し得ます。元報告には別調査の満足度もありますが、今回の数値には採用していません。\n\n## 日本の動画利用と比べるには、対象をそろえる\n\n視聴時間、契約、支払額が同じように増えるかを確かめるには、それぞれの対象をそろえる必要があります。日本のネット動画と比較する場合も、年齢、家庭内・外の範囲、対象サービスを合わせます。収入を視聴時間で割って利用単価を計算することはしません。\n\n## 報告内で食い違う値は、比較に使っていない\n\n総視聴時間、2024年の定額制・広告型配信の時間、契約・試用世帯の比較開始年には、報告内で食い違いがあります。そのため、総時間の増減と配信時間の前年比は保留しています。収入の図では単位の見出しが食い違いますが、本文・軸・棒の値が一致する10億ポンド単位を採用しています。\n\n## 追加で確かめたいこと\n\n視聴計測会社Barbの元データと照合して食い違いを解消できれば、視聴時間の変化を再評価できます。増収が料金改定、まとめ売り、契約数の変化で説明できる場合は、増収だけを根拠に、見たいという需要や支払意思が高まったとは判断しません。", "text": "# 英国の動画配信：購読収入は増加。視聴時間の前年比は保留\n\n定額動画配信の購読収入は、2024年の43.7億ポンドから2025年の51.7億ポンドへ増えました。同年の家庭内での配信視聴時間は、利用しない人も含む英国の4歳以上全体で、1人1日42分です。ただし、2024年の時間が本文と図で食い違うため、視聴時間の前年比は保留しています。収入と時間は対象が違うため、別々に読みます。\n\n## 収入・時間・世帯の割合は、それぞれ対象が違う\n\n購読収入は前年より増えました。42分という視聴時間は、定額制（SVoD）と広告型（AVoD）の動画配信を家庭内で見た時間です。一方、70%という値は、2026年第1四半期に定額動画配信を有料で契約している、または無料で試している世帯の割合です。この3つを同じ人の支払い・視聴の記録として結びつけることはできません。\n\n## 誰が使い、誰が払っているか\n\n視聴時間は英国の4歳以上全体を分母にしています。購読収入は契約側が払う料金で、広告主が払う広告費を含めません。契約・試用する世帯の割合も、人数や契約の総数とは違います。\n\n好きな時間に作品を見られることが、利用者に役立っている可能性はあります。ただし、今回の指標だけでは利用の動機や増収の原因は分かりません。料金改定や、複数サービスをまとめて売る契約なども関係し得ます。元報告には別調査の満足度もありますが、今回の数値には採用していません。\n\n## 日本の動画利用と比べるには、対象をそろえる\n\n視聴時間、契約、支払額が同じように増えるかを確かめるには、それぞれの対象をそろえる必要があります。日本のネット動画と比較する場合も、年齢、家庭内・外の範囲、対象サービスを合わせます。収入を視聴時間で割って利用単価を計算することはしません。\n\n## 報告内で食い違う値は、比較に使っていない\n\n総視聴時間、2024年の定額制・広告型配信の時間、契約・試用世帯の比較開始年には、報告内で食い違いがあります。そのため、総時間の増減と配信時間の前年比は保留しています。収入の図では単位の見出しが食い違いますが、本文・軸・棒の値が一致する10億ポンド単位を採用しています。\n\n## 追加で確かめたいこと\n\n視聴計測会社Barbの元データと照合して食い違いを解消できれば、視聴時間の変化を再評価できます。増収が料金改定、まとめ売り、契約数の変化で説明できる場合は、増収だけを根拠に、見たいという需要や支払意思が高まったとは判断しません。\n\n## 根拠と確認範囲\n\n### 英国：定額動画配信の購読収入\n\nインターネット経由の定額動画配信（subscription-OTT）の購読収入は、2024年の43.7億ポンドから2025年の51.7億ポンドへ増えました。価格変動を調整していない収入の推計です。\n\n- 期間：2024年→2025年\n- 調べた対象・割合の分母：英国のインターネット経由の定額動画配信（subscription-OTT）。Ampere Analysisの民間推計をOfcomが掲載\n- 単位：価格変動を調整していない10億ポンド\n- 何を調べた値か：購読収入の民間推計\n- 出典の公表日：2026-07-29\n- 原典で確認した範囲：英国の通信規制機関Ofcomの報告から抽出した本文・図の文字と、調査方法の付録の該当箇所を確認しています。データ提供元であるBarbとAmpereの元データは取得していません。\n- 別の手順で確かめた範囲：Ofcom報告から抽出した文字を、別途照合しています。データ提供元の数値から計算し直す作業と、図を画像で確認する作業はしていません。\n- 未確認の点・読み違えやすい点：税込みか税抜きか、複数サービスをまとめて売った料金をどう配分したか、対象サービスの完全な一覧は確認できていません。広告収入を含む総収入ではありません。\n- 元資料の位置：本文51頁、図42・52頁。図見出し£mと軸・棒£bnが不一致。本文と軸・棒が一致する£bnを採用\n- 出典：[原典1](https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/multi-sector/media-nations/2026/media-nations-2026-uk-report.pdf?v=423157)\n\n補足資料：[定義・照合資料1](https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/multi-sector/media-nations/2026/annex-methodologies.pdf?v=423148)\n\n### 英国：家庭内の配信視聴時間\n\n定額制と広告型の動画配信（SVoD/AVoD）を家庭内で見た時間は、2025年に1人1日42分でした。英国の4歳以上全体について、利用しない人も含めた平均です。\n\n- 期間：2025年\n- 調べた対象・割合の分母：英国4歳以上全体。利用者・契約者のみの平均ではない。家庭内TV受像機と家庭内Wi-Fi機器\n- 単位：分／人・日\n- 何を調べた値か：行動や取引を数えた集計\n- 出典の公表日：2026-07-29\n- 原典で確認した範囲：英国の通信規制機関Ofcomの報告から抽出した本文・図の文字と、調査方法の付録の該当箇所を確認しています。データ提供元であるBarbとAmpereの元データは取得していません。\n- 別の手順で確かめた範囲：Ofcom報告から抽出した文字を、別途照合しています。データ提供元の数値から計算し直す作業と、図を画像で確認する作業はしていません。\n- 未確認の点・読み違えやすい点：家庭の外での視聴は対象外です。広告型の動画配信を含み、配信サービスNOWを除いています。2024年の値が本文と図で食い違うため、前年比は保留しています。\n- 元資料の位置：本文18頁、図29・35頁。原提供者Barb\n- 出典：[原典1](https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/multi-sector/media-nations/2026/media-nations-2026-uk-report.pdf?v=423157)\n\n補足資料：[定義・照合資料1](https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/multi-sector/media-nations/2026/annex-methodologies.pdf?v=423148)\n\n### 英国：定額動画配信を契約・試用する世帯\n\n2026年第1四半期には、英国の世帯の70%が、定額動画配信（SVoD）を有料で契約しているか、無料で試していました。有料契約だけの割合ではありません。\n\n- 期間：2026年第1四半期\n- 調べた対象・割合の分母：英国世帯。有料契約または無料試用を保有\n- 単位：全世帯に占める割合（%）\n- 何を調べた値か：有料契約か無料試用をしている世帯の割合\n- 出典の公表日：2026-07-29\n- 原典で確認した範囲：英国の通信規制機関Ofcomの報告から抽出した本文・図の文字と、調査方法の付録の該当箇所を確認しています。データ提供元であるBarbとAmpereの元データは取得していません。\n- 別の手順で確かめた範囲：Ofcom報告から抽出した文字を、別途照合しています。データ提供元の数値から計算し直す作業と、図を画像で確認する作業はしていません。\n- 未確認の点・読み違えやすい点：有料契約だけの世帯割合、利用人数、契約総数、契約の純増を示す値ではありません。公表されたすべての資料の中で、この四半期が最も新しいかは確認できていません。\n- 元資料の位置：図28・34頁。原提供者Barb\n- 出典：[原典1](https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/multi-sector/media-nations/2026/media-nations-2026-uk-report.pdf?v=423157)\n\n補足資料：[定義・照合資料1](https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/multi-sector/media-nations/2026/annex-methodologies.pdf?v=423148)\n"}, {"id": "us-electricity", "title": "米国の小売電力：家庭向けの販売量はほぼ横ばい、商業向けは増加", "entry": "2024年8月〜2025年7月と、2025年8月〜2026年7月の各12か月を比べると、家庭向けの電力販売量は+0.06%、料金収入は+6.62%でした。商業向けの販売量は+3.11%です。支払う金額と購入する量は、同じ割合では変わっていません。", "observations": ["us-household", "us-commercial", "us-industrial", "us-all"], "body": "## 料金収入は、販売量より大きく増えている\n\n家庭・商業・産業のすべてで、料金収入の増加率が電力販売量の増加率を上回っています。家庭向けの販売量はほぼ横ばいで、商業向けでは量も増えています。同じ対象範囲・期間での比較ですが、天候や電気の使い道の変化は調整していません。\n\n## 契約者数から、世帯数や電気の使い道までは分からない\n\n対象は、電力会社などから電気を買う最終顧客です。最終的に費用を負担する人や、照明・空調・設備運転にどれだけ役立ったかは分かりません。契約数やメーター数も、重複を除いた世帯数・企業数とは限りません。\n\n## 平均単価の上昇は、同じ料金プランの値上げ率とは違う\n\n日本のコーヒー購入と同じく、支払額が増えても、購入量がほぼ変わらない場合があります。ここでの平均単価は、料金収入を販売量で割った値です。固定料金や地域・用途の構成を含むため、同じ料金プランの値上げ率ではありません。\n\n商業部門の表は、用途別の内訳を示していません。したがって、商業向け販売量の増加を、そのままAIやデータセンターの需要増とは呼べません。\n\n## 暫定値のため、小さな増減は改定される可能性がある\n\n12か月比較には、2026年9月24日公表の月報を使っています。別に公表された2025年の年次確報（EIA-861）でも長期的な方向は変わりませんでした。ただし、年次の改定分を各月にどう振り分けるかは分からないため、月報の12か月値を確報には置き換えていません。家庭向け販売量の小さな増減も、改定後に増加・減少の向きが変わる可能性があります。\n\n## 追加で確かめたいこと\n\n天候、地域や顧客の構成、部門の分類変更を調整しても、商業向けの販売量増加が残るかを確かめます。これらの調整で増加が消える場合や、自家発電から電力購入への切り替えで説明できる場合は、用途ごとの電力需要が増えたという解釈を弱めます。", "text": "# 米国の小売電力：家庭向けの販売量はほぼ横ばい、商業向けは増加\n\n2024年8月〜2025年7月と、2025年8月〜2026年7月の各12か月を比べると、家庭向けの電力販売量は+0.06%、料金収入は+6.62%でした。商業向けの販売量は+3.11%です。支払う金額と購入する量は、同じ割合では変わっていません。\n\n## 料金収入は、販売量より大きく増えている\n\n家庭・商業・産業のすべてで、料金収入の増加率が電力販売量の増加率を上回っています。家庭向けの販売量はほぼ横ばいで、商業向けでは量も増えています。同じ対象範囲・期間での比較ですが、天候や電気の使い道の変化は調整していません。\n\n## 契約者数から、世帯数や電気の使い道までは分からない\n\n対象は、電力会社などから電気を買う最終顧客です。最終的に費用を負担する人や、照明・空調・設備運転にどれだけ役立ったかは分かりません。契約数やメーター数も、重複を除いた世帯数・企業数とは限りません。\n\n## 平均単価の上昇は、同じ料金プランの値上げ率とは違う\n\n日本のコーヒー購入と同じく、支払額が増えても、購入量がほぼ変わらない場合があります。ここでの平均単価は、料金収入を販売量で割った値です。固定料金や地域・用途の構成を含むため、同じ料金プランの値上げ率ではありません。\n\n商業部門の表は、用途別の内訳を示していません。したがって、商業向け販売量の増加を、そのままAIやデータセンターの需要増とは呼べません。\n\n## 暫定値のため、小さな増減は改定される可能性がある\n\n12か月比較には、2026年9月24日公表の月報を使っています。別に公表された2025年の年次確報（EIA-861）でも長期的な方向は変わりませんでした。ただし、年次の改定分を各月にどう振り分けるかは分からないため、月報の12か月値を確報には置き換えていません。家庭向け販売量の小さな増減も、改定後に増加・減少の向きが変わる可能性があります。\n\n## 追加で確かめたいこと\n\n天候、地域や顧客の構成、部門の分類変更を調整しても、商業向けの販売量増加が残るかを確かめます。これらの調整で増加が消える場合や、自家発電から電力購入への切り替えで説明できる場合は、用途ごとの電力需要が増えたという解釈を弱めます。\n\n## 根拠と確認範囲\n\n### 米国：家庭向け小売電力\n\n2024年8月〜2025年7月と2025年8月〜2026年7月の各12か月を比べると、家庭向けの電力販売量は1,511.617から1,512.462へ、0.06%増えました（単位：10億kWh）。料金収入は255.238から272.140へ、6.62%増えています（単位：10億ドル）。料金収入を販売量で割った平均単価は6.56%上がりました。\n\n- 期間：2024年8月〜2025年7月→2025年8月〜2026年7月\n- 調べた対象・割合の分母：米国50州と首都ワシントンDCの最終顧客向け小売販売・家庭\n- 単位：販売量＝10億kWh、料金収入＝価格変動を調整していない10億ドル、増減＝%\n- 何を調べた値か：小売購入量・料金収入\n- 出典の公表日：2026-09-24\n- 原典で確認した範囲：米国エネルギー情報局（EIA）の月報について、表5.1・5.2・5.3・5.7の使用した数値を確認しています。単価の定義と、顧客・天候などに関する注記も読んでいます。\n- 別の手順で確かめた範囲：公式のExcelファイルを別の計算手順で読み直し、12か月欄の数値、月次値の合計、料金収入を販売量で割った単価を計算し直しています。2025年の年次確報（EIA-861）も別途集計して、長期的な増減の方向を照合しています。ただし、これによって月報の12か月値が確報になったわけではありません。\n- 未確認の点・読み違えやすい点：2025・2026年の数値は月報の暫定値です。天候などの影響は調整していません。自家発電・自家消費を含むすべての電力需要ではなく、AIやデータセンターに使われた量も識別できません。増減の差が小さい場合、今後の改定で増加と減少が入れ替わる可能性があります。\n- 元資料の位置：表5.1・5.2 B54:F55。単価率は同期間収入÷数量から計算\n- 出典：[原典1](https://www.eia.gov/electricity/monthly/xls/table_5_01.xlsx) ／ [原典2](https://www.eia.gov/electricity/monthly/xls/table_5_02.xlsx)\n\n補足資料：[定義・照合資料1](https://www.eia.gov/electricity/monthly/pdf/AppendixC.pdf) ／ [定義・照合資料2](https://www.eia.gov/analysis/handbook/pdf/STEO_Electricity_Consumption.pdf) ／ [定義・照合資料3](https://www.eia.gov/electricity/data/eia861/zip/f8612025.zip)\n\n### 米国：商業向け小売電力\n\n2024年8月〜2025年7月と2025年8月〜2026年7月の各12か月を比べると、商業向けの電力販売量は1,477.431から1,523.363へ、3.11%増えました（単位：10億kWh）。料金収入は193.253から210.918へ、9.14%増えています（単位：10億ドル）。料金収入を販売量で割った平均単価は5.85%上がりました。\n\n- 期間：2024年8月〜2025年7月→2025年8月〜2026年7月\n- 調べた対象・割合の分母：米国50州と首都ワシントンDCの最終顧客向け小売販売・商業\n- 単位：販売量＝10億kWh、料金収入＝価格変動を調整していない10億ドル、増減＝%\n- 何を調べた値か：小売購入量・料金収入\n- 出典の公表日：2026-09-24\n- 原典で確認した範囲：米国エネルギー情報局（EIA）の月報について、表5.1・5.2・5.3・5.7の使用した数値を確認しています。単価の定義と、顧客・天候などに関する注記も読んでいます。\n- 別の手順で確かめた範囲：公式のExcelファイルを別の計算手順で読み直し、12か月欄の数値、月次値の合計、料金収入を販売量で割った単価を計算し直しています。2025年の年次確報（EIA-861）も別途集計して、長期的な増減の方向を照合しています。ただし、これによって月報の12か月値が確報になったわけではありません。\n- 未確認の点・読み違えやすい点：2025・2026年の数値は月報の暫定値です。天候などの影響は調整していません。自家発電・自家消費を含むすべての電力需要ではなく、AIやデータセンターに使われた量も識別できません。増減の差が小さい場合、今後の改定で増加と減少が入れ替わる可能性があります。\n- 元資料の位置：表5.1・5.2 B54:F55。単価率は同期間収入÷数量から計算\n- 出典：[原典1](https://www.eia.gov/electricity/monthly/xls/table_5_01.xlsx) ／ [原典2](https://www.eia.gov/electricity/monthly/xls/table_5_02.xlsx)\n\n補足資料：[定義・照合資料1](https://www.eia.gov/electricity/monthly/pdf/AppendixC.pdf) ／ [定義・照合資料2](https://www.eia.gov/analysis/handbook/pdf/STEO_Electricity_Consumption.pdf) ／ [定義・照合資料3](https://www.eia.gov/electricity/data/eia861/zip/f8612025.zip)\n\n### 米国：産業向け小売電力\n\n2024年8月〜2025年7月と2025年8月〜2026年7月の各12か月を比べると、産業向けの電力販売量は1,042.720から1,046.292へ、0.34%増えました（単位：10億kWh）。料金収入は87.564から93.267へ、6.51%増えています（単位：10億ドル）。料金収入を販売量で割った平均単価は6.15%上がりました。\n\n- 期間：2024年8月〜2025年7月→2025年8月〜2026年7月\n- 調べた対象・割合の分母：米国50州と首都ワシントンDCの最終顧客向け小売販売・産業\n- 単位：販売量＝10億kWh、料金収入＝価格変動を調整していない10億ドル、増減＝%\n- 何を調べた値か：小売購入量・料金収入\n- 出典の公表日：2026-09-24\n- 原典で確認した範囲：米国エネルギー情報局（EIA）の月報について、表5.1・5.2・5.3・5.7の使用した数値を確認しています。単価の定義と、顧客・天候などに関する注記も読んでいます。\n- 別の手順で確かめた範囲：公式のExcelファイルを別の計算手順で読み直し、12か月欄の数値、月次値の合計、料金収入を販売量で割った単価を計算し直しています。2025年の年次確報（EIA-861）も別途集計して、長期的な増減の方向を照合しています。ただし、これによって月報の12か月値が確報になったわけではありません。\n- 未確認の点・読み違えやすい点：2025・2026年の数値は月報の暫定値です。天候などの影響は調整していません。自家発電・自家消費を含むすべての電力需要ではなく、AIやデータセンターに使われた量も識別できません。増減の差が小さい場合、今後の改定で増加と減少が入れ替わる可能性があります。\n- 元資料の位置：表5.1・5.2 B54:F55。単価率は同期間収入÷数量から計算\n- 出典：[原典1](https://www.eia.gov/electricity/monthly/xls/table_5_01.xlsx) ／ [原典2](https://www.eia.gov/electricity/monthly/xls/table_5_02.xlsx)\n\n補足資料：[定義・照合資料1](https://www.eia.gov/electricity/monthly/pdf/AppendixC.pdf) ／ [定義・照合資料2](https://www.eia.gov/analysis/handbook/pdf/STEO_Electricity_Consumption.pdf) ／ [定義・照合資料3](https://www.eia.gov/electricity/data/eia861/zip/f8612025.zip)\n\n### 米国：全部門（運輸を含む）向け小売電力\n\n2024年8月〜2025年7月と2025年8月〜2026年7月の各12か月を比べると、全部門の電力販売量は4,039.004から4,089.342へ、1.25%増えました（単位：10億kWh）。料金収入は537.016から577.419へ、7.52%増えています（単位：10億ドル）。料金収入を販売量で割った平均単価は6.20%上がりました。\n\n- 期間：2024年8月〜2025年7月→2025年8月〜2026年7月\n- 調べた対象・割合の分母：米国50州と首都ワシントンDCの最終顧客向け小売販売・全部門（運輸を含む）\n- 単位：販売量＝10億kWh、料金収入＝価格変動を調整していない10億ドル、増減＝%\n- 何を調べた値か：小売購入量・料金収入\n- 出典の公表日：2026-09-24\n- 原典で確認した範囲：米国エネルギー情報局（EIA）の月報について、表5.1・5.2・5.3・5.7の使用した数値を確認しています。単価の定義と、顧客・天候などに関する注記も読んでいます。\n- 別の手順で確かめた範囲：公式のExcelファイルを別の計算手順で読み直し、12か月欄の数値、月次値の合計、料金収入を販売量で割った単価を計算し直しています。2025年の年次確報（EIA-861）も別途集計して、長期的な増減の方向を照合しています。ただし、これによって月報の12か月値が確報になったわけではありません。\n- 未確認の点・読み違えやすい点：2025・2026年の数値は月報の暫定値です。天候などの影響は調整していません。自家発電・自家消費を含むすべての電力需要ではなく、AIやデータセンターに使われた量も識別できません。増減の差が小さい場合、今後の改定で増加と減少が入れ替わる可能性があります。\n- 元資料の位置：表5.1・5.2 B54:F55。単価率は同期間収入÷数量から計算\n- 出典：[原典1](https://www.eia.gov/electricity/monthly/xls/table_5_01.xlsx) ／ [原典2](https://www.eia.gov/electricity/monthly/xls/table_5_02.xlsx)\n\n補足資料：[定義・照合資料1](https://www.eia.gov/electricity/monthly/pdf/AppendixC.pdf) ／ [定義・照合資料2](https://www.eia.gov/analysis/handbook/pdf/STEO_Electricity_Consumption.pdf) ／ [定義・照合資料3](https://www.eia.gov/electricity/data/eia861/zip/f8612025.zip)\n"}, {"id": "in-upi", "title": "インドの送金・決済システムUPI：取引件数は増加。利用人数や消費額の増加は未確認", "entry": "銀行口座間の送金や店舗への支払いに使うUPIでは、2025年10月〜2026年9月の取引件数が、前の12か月より25.09%増えました。ただし、件数の増加だけでは、利用する人や家計の消費額が増えたとは分かりません。", "observations": ["in-upi-rolling", "in-upi-month", "in-p2m"], "body": "## 取扱金額に加え、取引件数も増えている\n\n取扱金額と取引件数の両方が増えています。個人から加盟店への支払い（P2M）も増えており、個人間送金の金額だけが増えたわけではありません。ただし、今回確認した最新月の9月は、8月より件数・金額とも減っています。単月の値だけでなく、前年同月や同じ長さの12か月を比較して読みます。\n\n## 決済を利用した金額と、サービスの料金は別\n\nUPIには、送金する人、受け取る人、加盟店が関わります。取扱金額は送金・決済されたお金であり、運営者の売上や手数料収入ではありません。無料利用や制度の支援を伴う利用も、実際に使われている証拠です。ただし、誰が料金を負担しているか、有料になっても使いたいかは別に確かめる必要があります。\n\n便利さや速さが役立っている可能性はありますが、今回の集計は利用者にその実感を尋ねていません。政策側が説明する利点を、利用者本人の回答として扱うことはできません。\n\n## 導入した数と、実際に使った回数を区別する\n\nケアプラン連携の有効ライセンスは、システムを使える状態を数えています。UPIの件数は、実際に処理された取引を数えています。件数は同じ人の利用頻度や、支払いを小口に分ける行動でも増えるため、人数には換算できません。\n\n## 現金・カードからの移行は、まだ確認できていない\n\n現金やカードからUPIへ支払い方法が移った可能性はありますが、同じ人の同じ支出を追っていません。運営機関NPCIの集計はインドの全決済を網羅しないため、全国シェアの分母には使えません。\n\n補足の小売決済PDFには、項目の構成が急に変わる箇所や、内訳を足しても上位項目の合計と一致しない箇所があります。その内訳行は主要指標に使っていません。また、ファイル名にある月と、収録データの最終月も違います。\n\n## 追加で確かめたいこと\n\n集計対象の改定や定義変更で件数増の大半を説明できる場合は、利用が拡大したという解釈を見直します。現金・カードから移ったかを判断するには、同じ人や加盟店について、同じ用途の支払いを追うデータが必要です。", "text": "# インドの送金・決済システムUPI：取引件数は増加。利用人数や消費額の増加は未確認\n\n銀行口座間の送金や店舗への支払いに使うUPIでは、2025年10月〜2026年9月の取引件数が、前の12か月より25.09%増えました。ただし、件数の増加だけでは、利用する人や家計の消費額が増えたとは分かりません。\n\n## 取扱金額に加え、取引件数も増えている\n\n取扱金額と取引件数の両方が増えています。個人から加盟店への支払い（P2M）も増えており、個人間送金の金額だけが増えたわけではありません。ただし、今回確認した最新月の9月は、8月より件数・金額とも減っています。単月の値だけでなく、前年同月や同じ長さの12か月を比較して読みます。\n\n## 決済を利用した金額と、サービスの料金は別\n\nUPIには、送金する人、受け取る人、加盟店が関わります。取扱金額は送金・決済されたお金であり、運営者の売上や手数料収入ではありません。無料利用や制度の支援を伴う利用も、実際に使われている証拠です。ただし、誰が料金を負担しているか、有料になっても使いたいかは別に確かめる必要があります。\n\n便利さや速さが役立っている可能性はありますが、今回の集計は利用者にその実感を尋ねていません。政策側が説明する利点を、利用者本人の回答として扱うことはできません。\n\n## 導入した数と、実際に使った回数を区別する\n\nケアプラン連携の有効ライセンスは、システムを使える状態を数えています。UPIの件数は、実際に処理された取引を数えています。件数は同じ人の利用頻度や、支払いを小口に分ける行動でも増えるため、人数には換算できません。\n\n## 現金・カードからの移行は、まだ確認できていない\n\n現金やカードからUPIへ支払い方法が移った可能性はありますが、同じ人の同じ支出を追っていません。運営機関NPCIの集計はインドの全決済を網羅しないため、全国シェアの分母には使えません。\n\n補足の小売決済PDFには、項目の構成が急に変わる箇所や、内訳を足しても上位項目の合計と一致しない箇所があります。その内訳行は主要指標に使っていません。また、ファイル名にある月と、収録データの最終月も違います。\n\n## 追加で確かめたいこと\n\n集計対象の改定や定義変更で件数増の大半を説明できる場合は、利用が拡大したという解釈を見直します。現金・カードから移ったかを判断するには、同じ人や加盟店について、同じ用途の支払いを追うデータが必要です。\n\n## 根拠と確認範囲\n\n### インド：UPIの取引件数と取扱金額\n\n2024年10月〜2025年9月から2025年10月〜2026年9月にかけて、UPIの取引件数は214,276.28百万件から268,041.79百万件へ、25.09%増えました。取扱金額は28,648,310.30から34,319,572.64 crore INRへ、19.80%増えています。crore INRは千万インドルピーを表す単位です。\n\n- 期間：2024年10月〜2025年9月→2025年10月〜2026年9月\n- 調べた対象・割合の分母：NPCIが集計するUPI取引。重複を除いた利用者の人数ではない。国内外対象の詳しい定義は未確認\n- 単位：百万件、価格変動を調整していない千万インドルピー（crore INR。1 crore＝1,000万）\n- 何を調べた値か：行動や取引を数えた集計\n- 原典で確認した範囲：UPIを運営するNPCIの公開表をブラウザで閲覧し、30か月分の月次値と、個人間送金（P2P）・個人から加盟店への支払い（P2M）の表を確認しています。小売決済のPDFでは該当ページを、政府の広報機関PIBの資料では年間の図を確認しています。\n- 別の手順で確かめた範囲：保存した元の表の抽出結果を、別の計算手順で読み直し、30か月の合計と各増加率などを計算し直しています。保存PDFから文字を再抽出し、画像でも確認しています。ただし、公開中の元の表を別途取得し直すことはできていません。\n- 未確認の点・読み違えやすい点：公開ウェブ表の各公表日と改定履歴は確認できていません。この取引集計からは、利用者の純増、使い続けた割合、消費の総額、有料サービスの収入は分かりません。\n- 元資料の位置：UPIタブ FY2024–25／2025–26／2026–27。各月表示値の合計\n- 出典：[原典1](https://www.npci.org.in/product/upi/product-statistics)\n\n補足資料：[定義・照合資料1](https://www.npci.org.in/uploads/RETAIL_PAYMENTS_STATISTICS_Sep_2026_c8e68ec8a1.pdf) ／ [定義・照合資料2](https://www.pib.gov.in/PressReleasePage.aspx?PRID=2257087\u0026lang=1\u0026reg=1)\n\n### インド：UPIの最新月\n\n2026年9月のUPI取引は24,068.38百万件、取扱金額は2,937,396.67 crore INRでした。前年同月比は件数+22.59%、金額+17.98%です。前月比では件数−1.80%、金額−1.51%でした。crore INRは千万インドルピーを表します。\n\n- 期間：2026年9月／2025年9月、2026年8月\n- 調べた対象・割合の分母：NPCIが集計するUPI取引\n- 単位：百万件、価格変動を調整していない千万インドルピー（crore INR）、増減%\n- 何を調べた値か：行動や取引を数えた集計\n- 原典で確認した範囲：UPIを運営するNPCIの公開表をブラウザで閲覧し、30か月分の月次値と、個人間送金（P2P）・個人から加盟店への支払い（P2M）の表を確認しています。小売決済のPDFでは該当ページを、政府の広報機関PIBの資料では年間の図を確認しています。\n- 別の手順で確かめた範囲：保存した元の表の抽出結果を、別の計算手順で読み直し、30か月の合計と各増加率などを計算し直しています。保存PDFから文字を再抽出し、画像でも確認しています。ただし、公開中の元の表を別途取得し直すことはできていません。\n- 未確認の点・読み違えやすい点：最も新しい観測月と、資料が公表された日は別です。公表日と改定履歴は未確認です。取引件数の増加が、利用頻度、新たな利用者、支払いの分割などにそれぞれどの程度よるかも、分かっていません。\n- 元資料の位置：UPIタブ Sep 2026／Sep 2025／Aug 2026\n- 出典：[原典1](https://www.npci.org.in/product/upi/product-statistics)\n\n補足資料：[定義・照合資料1](https://www.npci.org.in/uploads/RETAIL_PAYMENTS_STATISTICS_Sep_2026_c8e68ec8a1.pdf) ／ [定義・照合資料2](https://www.pib.gov.in/PressReleasePage.aspx?PRID=2257087\u0026lang=1\u0026reg=1)\n\n### インド：UPIの個人から加盟店への支払い\n\n2026年9月の、個人から加盟店へのUPI支払い（P2M）は15,229.11百万件、取扱金額は886,987.14 crore INRでした。前年同月比は件数+23.14%、金額+23.27%です。UPI全体に占める割合は、件数で63.27%、金額で30.20%でした。crore INRは千万インドルピーを表します。\n\n- 期間：2026年9月／2025年9月\n- 調べた対象・割合の分母：UPIのP2M（個人→加盟店）取引\n- 単位：百万件、価格変動を調整していない千万インドルピー（crore INR）、増減・構成比%\n- 何を調べた値か：行動や取引を数えた集計\n- 原典で確認した範囲：UPIを運営するNPCIの公開表をブラウザで閲覧し、30か月分の月次値と、個人間送金（P2P）・個人から加盟店への支払い（P2M）の表を確認しています。小売決済のPDFでは該当ページを、政府の広報機関PIBの資料では年間の図を確認しています。\n- 別の手順で確かめた範囲：保存した元の表の抽出結果を、別の計算手順で読み直し、30か月の合計と各増加率などを計算し直しています。保存PDFから文字を再抽出し、画像でも確認しています。ただし、公開中の元の表を別途取得し直すことはできていません。\n- 未確認の点・読み違えやすい点：個人間送金と加盟店への支払いを分けた、連続する12か月の系列は取得していません。加盟店への取扱金額も、最終消費額、付加価値、純売上とは異なります。現金やカードからUPIへ移ったことが増加の原因かどうかは、この集計では分かりません。\n- 元資料の位置：P2P and P2M Transactions、Sep 2025／Sep 2026\n- 出典：[原典1](https://www.npci.org.in/product/ecosystem-statistics/upi)\n\n補足資料：[定義・照合資料1](https://www.npci.org.in/uploads/RETAIL_PAYMENTS_STATISTICS_Sep_2026_c8e68ec8a1.pdf) ／ [定義・照合資料2](https://www.pib.gov.in/PressReleasePage.aspx?PRID=2257087\u0026lang=1\u0026reg=1)\n"}], "cross_industry_entries": [{"id": "money-and-quantity", "title": "お金と量：支払額が増えたとき、量も増えた？", "entry": "日本のコーヒー購入と米国の家庭向け電力では、支出・料金収入が増えた一方、量はほぼ横ばいでした。スペインのホテルは、客室単価と延べ宿泊数を並べた例です。総額と量を直接結びつけられない理由も確かめます。", "observations": ["jp-coffee", "us-household", "es-nights", "es-adr"], "body": "## コーヒーと電力では、支出・料金収入と量を比べる\n\n- 日本のコーヒーは、各12か月の購入支出が27.51%増え、購入量は0.28%増えました。同じ世帯範囲と品目について、金額と量を分けて見られます。\n- 米国の家庭向け電力は、各12か月の販売量が0.06%増え、料金収入は6.62%増えました。1年間を比べても、天候の違いを取り除いた比較にはなりません。\n\n## ホテルは、総額と量を直接結びつけられない例\n\nスペインのホテルは、8月の延べ宿泊数が1.38%増え、販売済み客室の1室・1日当たり収入は7.32%増えました。人泊と客室単価は単位が異なるため、掛け合わせて売上を出すことはできません。\n\nこの3例は成長率の順位をつけるための比較ではありません。コーヒーは二人以上世帯当たり、電力は米国の部門合計、ホテルはスペインの施設が対象で、期間も違います。\n\n## 支払額が増えた理由と、本人の評価は別に確かめる\n\n支払額が増えたのは、楽しさや快適さを以前より高く評価したからかもしれませんし、同じ生活を続ける費用が増えたからかもしれません。購入額や収入だけでは、どちらかを決められません。価格や購入品の構成を考慮した量と、本人の回答を合わせて確かめる必要があります。", "text": "# お金と量：支払額が増えたとき、量も増えた？\n\n日本のコーヒー購入と米国の家庭向け電力では、支出・料金収入が増えた一方、量はほぼ横ばいでした。スペインのホテルは、客室単価と延べ宿泊数を並べた例です。総額と量を直接結びつけられない理由も確かめます。\n\n## コーヒーと電力では、支出・料金収入と量を比べる\n\n- 日本のコーヒーは、各12か月の購入支出が27.51%増え、購入量は0.28%増えました。同じ世帯範囲と品目について、金額と量を分けて見られます。\n- 米国の家庭向け電力は、各12か月の販売量が0.06%増え、料金収入は6.62%増えました。1年間を比べても、天候の違いを取り除いた比較にはなりません。\n\n## ホテルは、総額と量を直接結びつけられない例\n\nスペインのホテルは、8月の延べ宿泊数が1.38%増え、販売済み客室の1室・1日当たり収入は7.32%増えました。人泊と客室単価は単位が異なるため、掛け合わせて売上を出すことはできません。\n\nこの3例は成長率の順位をつけるための比較ではありません。コーヒーは二人以上世帯当たり、電力は米国の部門合計、ホテルはスペインの施設が対象で、期間も違います。\n\n## 支払額が増えた理由と、本人の評価は別に確かめる\n\n支払額が増えたのは、楽しさや快適さを以前より高く評価したからかもしれませんし、同じ生活を続ける費用が増えたからかもしれません。購入額や収入だけでは、どちらかを決められません。価格や購入品の構成を考慮した量と、本人の回答を合わせて確かめる必要があります。\n\n## 根拠と確認範囲\n\n### 日本：家庭のコーヒー購入支出・量\n\n各12か月のコーヒー購入支出は、1世帯当たり8,696円から11,088円へ、27.51%増えました。購入量は2,494gから2,501gへ、0.28%増です。支出を数量で割った平均購入単価は、100g当たり348.6768円から443.3427円へ、27.15%上がっています。\n\n- 期間：2024年9月〜2025年8月→2025年9月〜2026年8月\n- 調べた対象・割合の分母：全国の二人以上世帯、1世帯当たり。家計調査のコーヒー購入。粉・粒・固形、インスタントを含み、液体飲料・喫茶代は別\n- 単位：円／世帯・12か月、g／世帯・12か月、円／100g\n- 何を調べた値か：家計の購入支出・数量\n- 出典の公表日：数量表：2026-10-09 08:30 JST（既存の取得情報で確認）。支出2ファイルの個別公表日は未確認。\n- 原典で確認した範囲：選んだ24か月の支出と数量について、以前に元の表と照合した記録に基づきます。海外事例とつなぐ原稿を作成した際には、原典を閲覧し直していません。\n- 別の手順で確かめた範囲：同じ24か月の入力データから、12か月合計と平均購入単価を計算し直した記録に基づきます。海外事例とつなぐ原稿を作成した際に、別の手順で再検証したわけではありません。\n- 未確認の点・読み違えやすい点：支出の2ファイルそれぞれの公表日は確認できていません。購入量は、実際に飲んだ量ではありません。単身世帯、外食、市場全体の結果にも広げられません。平均購入単価は、品質や銘柄を固定した価格指数ではありません。\n- 元資料の位置：品目382。数量：表011、品目内部コード011020010、世帯03、地域00000、表章02、1g\n- 出典：[原典1](https://www.e-stat.go.jp/stat-search/file-download?fileKind=1\u0026statInfId=000040270650) ／ [原典2](https://www.e-stat.go.jp/stat-search/file-download?fileKind=1\u0026statInfId=000040270651) ／ [原典3](https://www.e-stat.go.jp/dbview?sid=0004023602)\n\n### 米国：家庭向け小売電力\n\n2024年8月〜2025年7月と2025年8月〜2026年7月の各12か月を比べると、家庭向けの電力販売量は1,511.617から1,512.462へ、0.06%増えました（単位：10億kWh）。料金収入は255.238から272.140へ、6.62%増えています（単位：10億ドル）。料金収入を販売量で割った平均単価は6.56%上がりました。\n\n- 期間：2024年8月〜2025年7月→2025年8月〜2026年7月\n- 調べた対象・割合の分母：米国50州と首都ワシントンDCの最終顧客向け小売販売・家庭\n- 単位：販売量＝10億kWh、料金収入＝価格変動を調整していない10億ドル、増減＝%\n- 何を調べた値か：小売購入量・料金収入\n- 出典の公表日：2026-09-24\n- 原典で確認した範囲：米国エネルギー情報局（EIA）の月報について、表5.1・5.2・5.3・5.7の使用した数値を確認しています。単価の定義と、顧客・天候などに関する注記も読んでいます。\n- 別の手順で確かめた範囲：公式のExcelファイルを別の計算手順で読み直し、12か月欄の数値、月次値の合計、料金収入を販売量で割った単価を計算し直しています。2025年の年次確報（EIA-861）も別途集計して、長期的な増減の方向を照合しています。ただし、これによって月報の12か月値が確報になったわけではありません。\n- 未確認の点・読み違えやすい点：2025・2026年の数値は月報の暫定値です。天候などの影響は調整していません。自家発電・自家消費を含むすべての電力需要ではなく、AIやデータセンターに使われた量も識別できません。増減の差が小さい場合、今後の改定で増加と減少が入れ替わる可能性があります。\n- 元資料の位置：表5.1・5.2 B54:F55。単価率は同期間収入÷数量から計算\n- 出典：[原典1](https://www.eia.gov/electricity/monthly/xls/table_5_01.xlsx) ／ [原典2](https://www.eia.gov/electricity/monthly/xls/table_5_02.xlsx)\n\n補足資料：[定義・照合資料1](https://www.eia.gov/electricity/monthly/pdf/AppendixC.pdf) ／ [定義・照合資料2](https://www.eia.gov/analysis/handbook/pdf/STEO_Electricity_Consumption.pdf) ／ [定義・照合資料3](https://www.eia.gov/electricity/data/eia861/zip/f8612025.zip)\n\n### スペイン：ホテルの延べ宿泊数\n\n2026年8月の延べ宿泊数は4,879.8万人泊で、前年同月より1.38%増えました。国内居住者の延べ宿泊数は1.11%減、国外居住者は2.77%増でした。1〜8月累計では前年同期より1.45%増えています。1人が1泊すると1人泊と数えます。\n\n- 期間：2026年8月／2025年8月、2026年1〜8月／2025年1〜8月\n- 調べた対象・割合の分母：スペインのホテル・類似施設の宿泊者。国内・国外は居住地分類\n- 単位：人泊、前年同月・前年同期比%\n- 何を調べた値か：行動や取引を数えた集計\n- 出典の公表日：2026-09-22\n- 原典で確認した範囲：2026年8月分の公表表で、使用した数値の欄を確認しています。調査方法の資料では、対象、定義、過去の系列とのつながりに関する箇所を確認しています。収益の調査方法を説明する資料は、全ページを読了したわけではありません。\n- 別の手順で確かめた範囲：元の表の数値を別途照合し、延べ宿泊数の前年比と累計を計算し直しています。ADRと価格指数の増加率は、公表表に掲載された値との照合までで、前年の元の値から計算し直す作業はしていません。\n- 未確認の点・読み違えやすい点：速報値です。同じ人の重複を除いた宿泊者数、誰が料金を払ったかの内訳、旅行の目的は確認できていません。\n- 元資料の位置：EOH_Hoja1 I12/I22/K22/M22/I23\n- 出典：[原典1](https://www.ine.es/prensa/anexo_tablas/en/CTH0826_en.xlsx)\n\n補足資料：[定義・照合資料1](https://www.ine.es/en/daco/daco42/ocuphotel/meto_eoh_en.pdf) ／ [定義・照合資料2](https://www.ine.es/en/daco/daco42/irsh/meto_irsh_en.pdf)\n\n### スペイン：販売済み客室当たり収入と価格指数\n\n販売済み客室の1室・1日当たり収入（ADR）は166.90ユーロで、前年同月より7.32%上がりました。別の指標であるホテル価格指数は6.34%上昇しています。\n\n- 期間：2026年8月／2025年8月\n- 調べた対象・割合の分母：スペインのホテルの販売済み客室。価格指数は別の価格指標\n- 単位：ユーロ／販売済み客室・日、前年同月比%\n- 何を調べた値か：収入単価・価格指標\n- 出典の公表日：2026-09-22\n- 原典で確認した範囲：2026年8月分の公表表で、使用した数値の欄を確認しています。調査方法の資料では、対象、定義、過去の系列とのつながりに関する箇所を確認しています。収益の調査方法を説明する資料は、全ページを読了したわけではありません。\n- 別の手順で確かめた範囲：元の表の数値を別途照合し、延べ宿泊数の前年比と累計を計算し直しています。ADRと価格指数の増加率は、公表表に掲載された値との照合までで、前年の元の値から計算し直す作業はしていません。\n- 未確認の点・読み違えやすい点：ADRは、販売済み客室の1室・1日当たり収入です。総売上でも、品質を固定した価格指数でもありません。延べ宿泊数の単位である人泊と掛け合わせて、売上を求めることはできません。\n- 元資料の位置：IRSH C11/E11、IPH E12\n- 出典：[原典1](https://www.ine.es/prensa/anexo_tablas/en/CTH0826_en.xlsx)\n\n補足資料：[定義・照合資料1](https://www.ine.es/en/daco/daco42/ocuphotel/meto_eoh_en.pdf) ／ [定義・照合資料2](https://www.ine.es/en/daco/daco42/irsh/meto_irsh_en.pdf)\n"}, {"id": "use-and-adoption", "title": "実際に使った回数・時間と使える状態を分けて読む", "entry": "インドの送金・決済システムUPIでは、取引件数が増えています。日本のケアプラン連携では、システムを使える有効ライセンスに基づく導入率が上がっています。取引、視聴時間、導入状況は、それぞれ何を数えた値かを確かめて読みます。", "observations": ["in-upi-rolling", "jp-care-license", "jp-care-time", "uk-viewing", "uk-households"], "body": "## 導入したことと、使ったことは別に数える\n\n- UPIの25.09%増は、各12か月の取引件数を比べた値です。利用人数や有料契約数の増加率ではありません。\n- ケアプラン連携の5.3%から53.1%への変化は、約14か月の間に、全国の対象事業所数を分母として有効ライセンス数から算出した導入率が上がったことを示します。全国のデータ送受信量ではありません。\n- 英国の42分は、2025年の家庭内の動画配信視聴時間を、利用しない人も含む4歳以上全体で平均した、1人1日当たりの値です。一方、70%は、2026年第1四半期に定額動画配信を有料で契約するか、無料で試していた世帯の割合です。\n\n## ケアプラン連携の9事業所では、作業時間も比べている\n\n9事業所の実証では、追加の連携作業を含めて月6.51時間の減少が見られました。全国で同じ効果があるとは言えませんが、導入の有無に加えて、仕事にかかる時間を調べた例です。本人の満足、有料での継続、導入しなかった事業所と比べた効果は、まだ確認できていません。\n\n## 次は利用頻度と、併用する作業の負担を確かめる\n\n取引・送受信・視聴の頻度、使い続けた割合、実際にデータをやり取りできる相手の範囲、紙などの別手段を併用する作業を調べます。無料で使っている場合も利用の記録に含め、誰が費用を負担するかは別に示します。", "text": "# 実際に使った回数・時間と使える状態を分けて読む\n\nインドの送金・決済システムUPIでは、取引件数が増えています。日本のケアプラン連携では、システムを使える有効ライセンスに基づく導入率が上がっています。取引、視聴時間、導入状況は、それぞれ何を数えた値かを確かめて読みます。\n\n## 導入したことと、使ったことは別に数える\n\n- UPIの25.09%増は、各12か月の取引件数を比べた値です。利用人数や有料契約数の増加率ではありません。\n- ケアプラン連携の5.3%から53.1%への変化は、約14か月の間に、全国の対象事業所数を分母として有効ライセンス数から算出した導入率が上がったことを示します。全国のデータ送受信量ではありません。\n- 英国の42分は、2025年の家庭内の動画配信視聴時間を、利用しない人も含む4歳以上全体で平均した、1人1日当たりの値です。一方、70%は、2026年第1四半期に定額動画配信を有料で契約するか、無料で試していた世帯の割合です。\n\n## ケアプラン連携の9事業所では、作業時間も比べている\n\n9事業所の実証では、追加の連携作業を含めて月6.51時間の減少が見られました。全国で同じ効果があるとは言えませんが、導入の有無に加えて、仕事にかかる時間を調べた例です。本人の満足、有料での継続、導入しなかった事業所と比べた効果は、まだ確認できていません。\n\n## 次は利用頻度と、併用する作業の負担を確かめる\n\n取引・送受信・視聴の頻度、使い続けた割合、実際にデータをやり取りできる相手の範囲、紙などの別手段を併用する作業を調べます。無料で使っている場合も利用の記録に含め、誰が費用を負担するかは別に示します。\n\n## 根拠と確認範囲\n\n### インド：UPIの取引件数と取扱金額\n\n2024年10月〜2025年9月から2025年10月〜2026年9月にかけて、UPIの取引件数は214,276.28百万件から268,041.79百万件へ、25.09%増えました。取扱金額は28,648,310.30から34,319,572.64 crore INRへ、19.80%増えています。crore INRは千万インドルピーを表す単位です。\n\n- 期間：2024年10月〜2025年9月→2025年10月〜2026年9月\n- 調べた対象・割合の分母：NPCIが集計するUPI取引。重複を除いた利用者の人数ではない。国内外対象の詳しい定義は未確認\n- 単位：百万件、価格変動を調整していない千万インドルピー（crore INR。1 crore＝1,000万）\n- 何を調べた値か：行動や取引を数えた集計\n- 原典で確認した範囲：UPIを運営するNPCIの公開表をブラウザで閲覧し、30か月分の月次値と、個人間送金（P2P）・個人から加盟店への支払い（P2M）の表を確認しています。小売決済のPDFでは該当ページを、政府の広報機関PIBの資料では年間の図を確認しています。\n- 別の手順で確かめた範囲：保存した元の表の抽出結果を、別の計算手順で読み直し、30か月の合計と各増加率などを計算し直しています。保存PDFから文字を再抽出し、画像でも確認しています。ただし、公開中の元の表を別途取得し直すことはできていません。\n- 未確認の点・読み違えやすい点：公開ウェブ表の各公表日と改定履歴は確認できていません。この取引集計からは、利用者の純増、使い続けた割合、消費の総額、有料サービスの収入は分かりません。\n- 元資料の位置：UPIタブ FY2024–25／2025–26／2026–27。各月表示値の合計\n- 出典：[原典1](https://www.npci.org.in/product/upi/product-statistics)\n\n補足資料：[定義・照合資料1](https://www.npci.org.in/uploads/RETAIL_PAYMENTS_STATISTICS_Sep_2026_c8e68ec8a1.pdf) ／ [定義・照合資料2](https://www.pib.gov.in/PressReleasePage.aspx?PRID=2257087\u0026lang=1\u0026reg=1)\n\n### 日本：ケアプラン連携の有効ライセンスから算出した導入率\n\nケアプランデータ連携システムについて、全国の対象事業所数を分母に、有効ライセンス数を使って算出した導入率は、5.3%から53.1%へ上がりました。システムを使える状態を示す値で、全国のデータ送受信量の増加率ではありません。\n\n- 期間：2025年5月末→2026年7月末\n- 調べた対象・割合の分母：全国の対象事業所数を分母に、有効ライセンス数を使って算出した導入率\n- 単位：%\n- 何を調べた値か：導入・利用可能な状態\n- 出典の公表日：2026-08-28\n- 原典で確認した範囲：以前に原典の該当ページを確認した記録に基づきます。対象はPDF20頁（印刷頁19頁）です。海外事例とつなぐ原稿を作成した際には、原典を閲覧し直していません。\n- 別の手順で確かめた範囲：以前に原典と照合した記録に基づきます。海外事例とつなぐ原稿を作成した際に、別の手順で再検証したわけではありません。\n- 未確認の点・読み違えやすい点：全国のデータ送受信量、実際に使っている事業所の割合、料金を払って使い続けた実績は確認できていません。無料化と制度対応が導入に与えた影響も、切り分けられていません。\n- 元資料の位置：PDF20頁／印刷19頁\n- 出典：[原典1](https://www.mhlw.go.jp/content/12300000/001743315.pdf#page=20)\n\n### 日本：ケアプラン連携の時間比較\n\n居宅介護支援9事業所では、導入前後の月平均作業時間が15.62時間から9.11時間へ、6.51時間減りました。導入後に新たに生じた連携作業の時間も含めた比較です。対象数が少なく、対照群はありません。\n\n- 期間：2025年12月分→2026年6月または7月分\n- 調べた対象・割合の分母：居宅介護支援9事業所の前後比較、速報値\n- 単位：時間／月\n- 何を調べた値か：対象数の少ない調査の時間観測\n- 出典の公表日：2026-08-28\n- 原典で確認した範囲：以前に原典の該当ページを確認した記録に基づきます。対象はPDF70–71頁です。海外事例とつなぐ原稿を作成した際には、原典を閲覧し直していません。\n- 別の手順で確かめた範囲：以前に原典と照合した記録に基づきます。海外事例とつなぐ原稿を作成した際に、別の手順で再検証したわけではありません。\n- 未確認の点・読み違えやすい点：導入しなかった事業所を対照群として比べた調査ではありません。全国で得られる効果、導入によって生じたと特定できる効果、本人の価値評価、料金を払って使い続けた実績は確認できていません。\n- 元資料の位置：PDF70頁の実証概要、71頁の時間比較。追加連携作業を含む\n- 出典：[原典1](https://www.mhlw.go.jp/content/12300000/001743315.pdf#page=71)\n\n### 英国：家庭内の配信視聴時間\n\n定額制と広告型の動画配信（SVoD/AVoD）を家庭内で見た時間は、2025年に1人1日42分でした。英国の4歳以上全体について、利用しない人も含めた平均です。\n\n- 期間：2025年\n- 調べた対象・割合の分母：英国4歳以上全体。利用者・契約者のみの平均ではない。家庭内TV受像機と家庭内Wi-Fi機器\n- 単位：分／人・日\n- 何を調べた値か：行動や取引を数えた集計\n- 出典の公表日：2026-07-29\n- 原典で確認した範囲：英国の通信規制機関Ofcomの報告から抽出した本文・図の文字と、調査方法の付録の該当箇所を確認しています。データ提供元であるBarbとAmpereの元データは取得していません。\n- 別の手順で確かめた範囲：Ofcom報告から抽出した文字を、別途照合しています。データ提供元の数値から計算し直す作業と、図を画像で確認する作業はしていません。\n- 未確認の点・読み違えやすい点：家庭の外での視聴は対象外です。広告型の動画配信を含み、配信サービスNOWを除いています。2024年の値が本文と図で食い違うため、前年比は保留しています。\n- 元資料の位置：本文18頁、図29・35頁。原提供者Barb\n- 出典：[原典1](https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/multi-sector/media-nations/2026/media-nations-2026-uk-report.pdf?v=423157)\n\n補足資料：[定義・照合資料1](https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/multi-sector/media-nations/2026/annex-methodologies.pdf?v=423148)\n\n### 英国：定額動画配信を契約・試用する世帯\n\n2026年第1四半期には、英国の世帯の70%が、定額動画配信（SVoD）を有料で契約しているか、無料で試していました。有料契約だけの割合ではありません。\n\n- 期間：2026年第1四半期\n- 調べた対象・割合の分母：英国世帯。有料契約または無料試用を保有\n- 単位：全世帯に占める割合（%）\n- 何を調べた値か：有料契約か無料試用をしている世帯の割合\n- 出典の公表日：2026-07-29\n- 原典で確認した範囲：英国の通信規制機関Ofcomの報告から抽出した本文・図の文字と、調査方法の付録の該当箇所を確認しています。データ提供元であるBarbとAmpereの元データは取得していません。\n- 別の手順で確かめた範囲：Ofcom報告から抽出した文字を、別途照合しています。データ提供元の数値から計算し直す作業と、図を画像で確認する作業はしていません。\n- 未確認の点・読み違えやすい点：有料契約だけの世帯割合、利用人数、契約総数、契約の純増を示す値ではありません。公表されたすべての資料の中で、この四半期が最も新しいかは確認できていません。\n- 元資料の位置：図28・34頁。原提供者Barb\n- 出典：[原典1](https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/multi-sector/media-nations/2026/media-nations-2026-uk-report.pdf?v=423157)\n\n補足資料：[定義・照合資料1](https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/multi-sector/media-nations/2026/annex-methodologies.pdf?v=423148)\n"}, {"id": "felt-value", "title": "感じる価値：何が困る、何が役立つと答えている？", "entry": "建設では二重管理の負担、飲食店の導入者には効果実感の回答があります。法律事務所の懸念と中古購入の保証への期待は、既存要約では見られますが原典再確認待ちです。本人の回答と行動からの推測を分けて読みます。", "observations": ["jp-construction-burden", "jp-law-concerns", "jp-reuse-intent", "jp-food-effects"], "body": "## 困りごと、効果の実感、購入意向を分けて読む\n\n- 建設では、回答者の32.2%が、施工管理のデジタル化が進まない主な理由に二重管理を挙げています。元記事の本文と質問4（Q4）の図で確認した自己申告で、転記にかかった時間ではありません。\n- 飲食店では、シフト・勤怠管理システムを導入した103人の89.3%が、何らかの効果を実感したと答えています。公式の訂正版PDFで確認した回答です。全店舗の効果や時間短縮率には置き換えられません。\n- 法律事務所についての既存要約には、正確性68.1%、セキュリティ・機密63.2%という懸念の回答が記されています。一次PDFを取得できていないため、数値と設問条件は再確認待ちです。\n- 中古購入についての既存要約には、保証があれば高額品を買ってもよいという条件付きの意向が記されています。一次記事を取得できていないため、数値、割合の分母、保証の条件は再確認待ちです。\n\n建設と飲食は、公開本文・図表の該当箇所を確認していますが、個々の回答データを集め直して再計算したものではありません。法律と中古は、同じ確認済み表示にせず、既存要約として残します。\n\n## 回答割合だけで、価値の強さを順位づけない\n\n困っている、役立った、条件が整えば買いたいという回答は、尋ねた内容が異なります。割合の大小だけで、どの業界で価値が強いかは決められません。飲食店の効果実感も2024年の調査であり、2026年現在の需要増を示す数字ではありません。\n\n宿泊、視聴、決済が増えても、本人が何を大切にしたかは行動だけでは分かりません。本人の回答、実際に使った時間・回数、支払いを合わせて読むと、何が役立つのかをより具体的に確かめられます。", "text": "# 感じる価値：何が困る、何が役立つと答えている？\n\n建設では二重管理の負担、飲食店の導入者には効果実感の回答があります。法律事務所の懸念と中古購入の保証への期待は、既存要約では見られますが原典再確認待ちです。本人の回答と行動からの推測を分けて読みます。\n\n## 困りごと、効果の実感、購入意向を分けて読む\n\n- 建設では、回答者の32.2%が、施工管理のデジタル化が進まない主な理由に二重管理を挙げています。元記事の本文と質問4（Q4）の図で確認した自己申告で、転記にかかった時間ではありません。\n- 飲食店では、シフト・勤怠管理システムを導入した103人の89.3%が、何らかの効果を実感したと答えています。公式の訂正版PDFで確認した回答です。全店舗の効果や時間短縮率には置き換えられません。\n- 法律事務所についての既存要約には、正確性68.1%、セキュリティ・機密63.2%という懸念の回答が記されています。一次PDFを取得できていないため、数値と設問条件は再確認待ちです。\n- 中古購入についての既存要約には、保証があれば高額品を買ってもよいという条件付きの意向が記されています。一次記事を取得できていないため、数値、割合の分母、保証の条件は再確認待ちです。\n\n建設と飲食は、公開本文・図表の該当箇所を確認していますが、個々の回答データを集め直して再計算したものではありません。法律と中古は、同じ確認済み表示にせず、既存要約として残します。\n\n## 回答割合だけで、価値の強さを順位づけない\n\n困っている、役立った、条件が整えば買いたいという回答は、尋ねた内容が異なります。割合の大小だけで、どの業界で価値が強いかは決められません。飲食店の効果実感も2024年の調査であり、2026年現在の需要増を示す数字ではありません。\n\n宿泊、視聴、決済が増えても、本人が何を大切にしたかは行動だけでは分かりません。本人の回答、実際に使った時間・回数、支払いを合わせて読むと、何が役立つのかをより具体的に確かめられます。\n\n## 根拠と確認範囲\n\n### 日本：建設現場の二重管理の課題回答\n\n現場TECHが2026年3月に建設業従事者426人へ行ったネット調査では、32.2%が、施工管理のデジタル化が進まない主な理由として二重管理を挙げました。Excelや紙への転記・再入力を伴う作業への回答です。\n\n- 期間：2026年3月\n- 調べた対象・割合の分母：建設業従事者426人のインターネット調査。Q4図の分母もn=426。企業数ではない\n- 単位：回答%\n- 何を調べた値か：回答者が挙げた課題\n- 出典の公表日：2026-03-26（原調査記事）。関連記事は2026-05-01。\n- 原典で確認した範囲：原典の本文、質問4（Q4）の画像、調査概要を確認しています。記事の日付と、図の割合の分母も確認しています。\n- 別の手順で確かめた範囲：公開本文と質問4（Q4）の画像を別途照合しています。個々の回答を集め直して再集計したわけではありません。\n- 未確認の点・読み違えやすい点：複数回答だったかの明記、個々の回答データ、全国を代表する調査かどうかは確認できていません。32.2%は、転記にかかった時間、導入した人だけの不満率、料金を払う意思を示す値ではありません。関連記事も、独立して同じ調査をやり直した結果とは数えません。\n- 元資料の位置：記事冒頭日付、「現場定着」「操作習得の負担」「二重管理」の壁の本文・Q4図、末尾調査概要\n- 出典：[原典1](https://kensetsu.gemba-tech.jp/research/survey-sekokanridx/) ／ [原典2](https://kensetsu.gemba-tech.jp/research/survey-sekokanriapps-2026/)\n\n### 日本：シフト・勤怠ツールの効果実感\n\n2024年3月の飲食店経営者などへのネット調査では、シフト・勤怠管理システムを導入している103人の89.3%が、何らかの効果を実感したと答えました。ツールごとに、当てはまる効果を複数選べる設問です。\n\n- 期間：2024年3月8〜12日\n- 調べた対象・割合の分母：全国47都道府県の飲食店経営者等、マクロミル登録モニターのネット調査1,029人のうち導入者103人。一部役員やテイクアウト専門店等を含む\n- 単位：回答%\n- 何を調べた値か：本人の効果実感\n- 出典の公表日：2024-06-03（公式記事・訂正版PDF p.1を確認）\n- 原典で確認した範囲：公式のHot Pepper記事と、リンク先の訂正版PDFの1・2・8頁を確認しています。2・8頁は画像でも確認しています。recruit.co.jp側のPDFは取得できておらず、両方のPDFが同じ内容かは確認できていません。\n- 別の手順で確かめた範囲：公式記事と訂正版PDFの数値、分母、設問、期間を別途照合しています。個々の回答を集め直して再集計したわけではありません。\n- 未確認の点・読み違えやすい点：年齢条件は公式ウェブ記事と訂正版PDFで食い違うため、記載していません。無作為に選んだ全国を代表する調査かどうかと、個々の回答データの公開は確認できていません。自己申告の結果であり、全店舗の効果、時間短縮率、2026年現在の需要増を示す値ではありません。\n- 元資料の位置：訂正版PDF p.2調査概要、p.8「デジタルツールの導入効果」シフト・勤怠管理システム行。各ツール複数回答。複数店経営は代表的な店舗について回答\n- 出典：[原典1](https://www.hotpepper.jp/ggs/research/article/column/20240603) ／ [原典2](https://www.hotpepper.jp/ggs/wp-content/uploads/2024/06/%E8%A8%82%E6%AD%A3_%E6%9C%80%E7%B5%82_DX%E8%AA%BF%E6%9F%BB2024%E5%B9%B43%E6%9C%88%E5%AE%9F%E6%96%BD_0603%E3%83%AA%E3%83%AA%E3%83%BC%E3%82%B9.pdf)\n\n### 日本：生成AIの正確性と機密への懸念\n\n既存の要約には、生成AIへの懸念として、正確性を68.1%、セキュリティ・機密を63.2%が挙げたと記されています。一次資料のPDFで、数値と設問条件を再確認する作業は終わっていません。\n\n- 期間：既存要約：2026年3月23日〜4月27日（今回未確認）\n- 調べた対象・割合の分母：既存要約：日弁連分科会資料の有効223件、主に事務職員雇用会員または生成AI関心層（今回未確認）\n- 単位：回答%\n- 何を調べた値か：回答者が挙げた懸念\n- 原典で確認した範囲：指定された一次資料のPDFを取得できず、海外事例とつなぐ原稿の作成時には、本文・図表・該当ページを読めていません。数値、対象、期間、設問は、既存の要約に書かれていた内容を残しています。\n- 別の手順で確かめた範囲：一次資料のPDFの再確認は終わっていません。数値、対象、設問条件の別途照合と、個々の回答の再集計もしていません。\n- 未確認の点・読み違えやすい点：公表日、設問、回答形式、分科会の位置づけは、海外事例とつなぐ原稿の作成時には再確認できていません。全国の法律事務所の割合、短縮できた時間、ルールの整備に料金を払う意思を示す値とは扱いません。\n- 出典：[原典1](https://www.nichibenren.or.jp/library/pdf/document/symposium/gyoukaku_sympo/24th_report_2.pdf)\n\n### 日本：中古購入と保証への意向\n\n既存の要約には、プロの保証があれば高額品を買ってもよいという回答が、スマホなどで51.7%、高額バッグで51.2%あったと記されています。一次記事で、誰を分母にした割合か、どのような保証を尋ねたかを再確認する作業は終わっていません。\n\n- 期間：既存要約：2026年5月20〜21日（今回未確認）\n- 調べた対象・割合の分母：既存要約：20〜60代1,040人調査のうち中古を習慣的・時々買う人。対象・設問分母は今回未確認。1,040人全体の割合とは扱わない\n- 単位：回答%\n- 何を調べた値か：本人の条件付き購入意向\n- 出典の公表日：2026-07-14（既存要約記載、今回未確認）\n- 原典で確認した範囲：指定された一次記事を取得できず、海外事例とつなぐ原稿の作成時には、本文・図表を読めていません。数値、対象、期間、条件は、既存の要約に書かれていた内容を残しています。\n- 別の手順で確かめた範囲：一次記事の再確認は終わっていません。数値、設問の割合の分母、保証の条件の別途照合と、個々の回答の再集計もしていません。\n- 未確認の点・読み違えやすい点：数値、対象、日付、設問の割合の分母、保証の条件、回答形式は、海外事例とつなぐ原稿の作成時には再確認できていません。実際の購入、追加料金を払うことへの同意、保証が市場成長を生んだ効果を示す値ではありません。\n- 出典：[原典1](https://about.mercari.com/press/news/articles/20260714_research/)\n"}]}}</script>

function inline(text){
 const tokens=/`([^`]+)`|\[([^\]]+)\]\(([^\s)]+)\)|https?:\/\/[^\s<>]+|\*\*([^*]+)\*\*|overview-[a-z0-9-]+|[a-zA-Z0-9_-]+\.md/g;
 let out='',last=0;
 for(const m of text.matchAll(tokens)){
  out+=esc(text.slice(last,m.index));
  if(m[1])out+=m[1].endsWith('.md')?fileLink(m[1]):`<code>${esc(m[1])}</code>`;
  else if(m[2]){const id=m[3].split('/').pop();out+=knownLocalRoutes.has(m[3])?`<a href="${esc(m[3])}">${esc(m[2])}</a>`:titles.has(id)?fileLink(id):/^https?:\/\//.test(m[3])?link(m[2],m[3]):esc(m[2]);}
  else if(m[4])out+=`<strong>${esc(m[4])}</strong>`;
  else if(data.claims.some(c=>c.claim_id===m[0]))out+=`<a href="#claim/${esc(m[0])}">${esc(m[0])}</a>`;
  else if(m[0].endsWith('.md')&&!m[0].startsWith('http'))out+=fileLink(m[0]);
  else{const url=m[0].replace(/[。、，．）〉」』\]>]+$/g,'');out+=link(url,url)+esc(m[0].slice(url.length));}
  last=m.index+m[0].length;
 }
 return out+esc(text.slice(last));
}

function originalMarkdown(text,prefix='section'){
 const lines=text.replace(/\r\n?/g,'\n').split('\n');let out='',paragraph=[],list='',code=null,n=0;
 const flush=()=>{if(paragraph.length){out+=`<p>${inline(paragraph.join('\n'))}</p>`;paragraph=[];}if(list){out+=`</${list}>`;list='';}};
 const cells=line=>line.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'));
 for(let row=0;row<lines.length;row++){
  const line=lines[row];
  if(code===null&&line.includes('|')&&row+1<lines.length&&/^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[row+1])){
   flush();const headers=cells(line);out+='<div class="table-scroll" role="region" aria-label="比較表" tabindex="0"><table><thead><tr>'+headers.map(c=>`<th scope="col">${inline(c)}</th>`).join('')+'</tr></thead><tbody>';row++;
   while(row+1<lines.length&&lines[row+1].trim()&&lines[row+1].includes('|')){const values=cells(lines[++row]);out+='<tr>'+headers.map((_,i)=>`<td>${inline(values[i]||'')}</td>`).join('')+'</tr>';}
   out+='</tbody></table></div>';continue;
  }
  if(/^```/.test(line)){flush();if(code!==null){out+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;code=null;}else code=[];continue;}
  if(code!==null){code.push(line);continue;}
  const heading=line.match(/^(#{1,6})\s+(.+)$/),item=line.match(/^\s*(?:([-+*])|\d+\.)\s+(.+)$/);
  if(heading){flush();const level=heading[1].length;out+=`<h${level} id="${prefix}-${n++}">${inline(heading[2])}</h${level}>`;}
  else if(item){const type=item[1]?'ul':'ol';if(list!==type){flush();out+=`<${type}>`;list=type;}out+=`<li>${inline(item[2])}</li>`;}
  else if(!line.trim())flush();
  else if(/^>\s?/.test(line)){flush();out+=`<blockquote>${inline(line.replace(/^>\s?/,''))}</blockquote>`;}
  else{if(list)flush();paragraph.push(line);}
 }
 flush();if(code!==null)out+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;return out;
}

 ${comparison()}
 <section class="section" id="claim-register"><h2>主張ごとの出典・検証状況（${data.claims.length}件）</h2><p>観測・解釈・仮説・検証計画を分けて表示します。</p>${data.claims.map(c=>claimCard(c,true)).join('')}</section>
 <details class="overview" id="overview"><summary>調査範囲と全体の結果を読む</summary><div class="prose">${markdown(data.overview.text.replace(/^# /,'## '),'overview-section')}</div></details>
 <section class="section" id="library" aria-labelledby="library-title"><div class="section-head"><h2 id="library-title">調査記事を読む</h2><p>記事を選ぶと、調査結果と出典を読めます。</p></div><div class="filters"><label>概要・タイトル・本文を検索<input id="search" type="search" placeholder="保育、紙、ルールなど" value="${esc(state.query)}"></label><label>比較するテーマ<select id="filter"><option value="all">すべてのテーマ</option>${data.themes.map(t=>`<option value="${esc(t.id)}" ${state.filter===t.id?'selected':''}>${esc(t.label)}</option>`).join('')}</select></label><label>記事の種類<select id="kind"><option value="all">すべての記事</option><option value="regular" ${state.kind==='regular'?'selected':''}>利用・導入・支出などの記事</option><option value="proxy" ${state.kind==='proxy'?'selected':''}>開発者の注目・未検証の仮説</option></select></label></div><button class="reset" id="reset">検索条件をすべて解除</button><p class="results" id="result-count" role="status"></p><div id="claim-results" class="claim-results" aria-live="polite"></div><div id="card-results"></div></section>`;
 drawTheme();drawQuestion();drawCards();
 document.getElementById('editorial-search').addEventListener('input',e=>{state.query=e.target.value;document.getElementById('search').value=state.query;drawCards();});
 document.getElementById('editorial-reset').addEventListener('click',()=>document.getElementById('reset').click());
 document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{state.theme=b.dataset.theme;drawTheme();}));
 for(const [id,key] of [['search','query'],['filter','filter'],['kind','kind']])document.getElementById(id).addEventListener(id==='search'?'input':'change',e=>{state[key]=e.target.value;drawCards();});
 document.getElementById('reset').addEventListener('click',()=>{state.query='';state.filter='all';state.kind='all';document.getElementById('search').value='';document.getElementById('filter').value='all';document.getElementById('kind').value='all';drawCards();});
}
function render(){
 const hash=location.hash;
 if(hash.startsWith('#candidate/')){renderCandidate(hash.slice(11));return;}
 if(hash.startsWith('#global/')){renderGlobal(hash.slice(8));return;}
 let id='';try{if(hash.startsWith('#markets/'))id=decodeURIComponent(hash.slice(9));}catch{id='?';}
 const main=document.getElementById('main');
 if(id){
  if(route==='home')homeScroll=window.scrollY;
  const memo=data.markets.find(m=>m.id===id);route='memo';
  if(memo){let n=0;const headings=[...memo.text.matchAll(/^(#{1,6})\s+(.+)$/gm)].map(m=>({level:m[1].length,title:m[2],id:n++}));
   main.innerHTML=`<div class="reader"><aside><a class="back" href="#library">記事一覧に戻る</a><a href="#markets">調査の全体像に戻る</a><nav aria-label="記事の目次">${headings.filter(h=>h.level===2).map(h=>`<a href="#memo-section-${h.id}">${esc(h.title)}</a>`).join('')}</nav></aside><article class="prose">${memo.proxy_map?'<span class="badge">'+esc(proxyLabel(memo.id))+'</span>':''}${markdown(memo.text,'memo-section')}<section><h2>出典・検証状況</h2>${claimsFor(memo.id.replace(/\.md$/,'')+'-')}</section><div class="article-end"><a href="#library">記事一覧に戻る</a></div></article></div>`;
   // Keep the memo route in the address while scrolling to its sections.
   main.querySelectorAll('aside nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const target=document.getElementById(a.hash.slice(1));target.tabIndex=-1;target.focus({preventScroll:true});target.scrollIntoView();}));
  }else main.innerHTML='<div class="missing"><h1>記事が見つかりません</h1><p><a href="#library">一覧から記事を選んでください。</a></p></div>';
  document.title=`${memo?memo.title:'記事が見つかりません'} | GTM工場`;window.scrollTo(0,0);main.focus({preventScroll:true});
 }else{
  const returning=route==='memo';if(route!=='home'){home();route='home';}document.title='需要の変化を読む | GTM工場';
  if(hash.startsWith('#question/')){state.question=hash.slice(10);drawQuestion();document.getElementById('questions').scrollIntoView();}
  else if(hash.startsWith('#observation/')){const el=document.getElementById('observation-'+hash.slice(13));if(el){el.open=true;el.scrollIntoView();}}
  else if(['#global-library','#questions','#comparison','#coverage','#candidates'].includes(hash)){const el=document.getElementById(hash.slice(1));if(hash==='#coverage')el.open=true;el.scrollIntoView();}
  else if(hash.startsWith('#claim/')){const el=document.getElementById('claim-'+hash.slice(7));if(el){el.open=true;el.scrollIntoView();}}
  else if(hash.startsWith('#theme/')){state.theme=hash.slice(7);drawTheme();document.getElementById('theme-detail').scrollIntoView();}
  else if(hash==='#overview'){document.getElementById('overview').open=true;document.getElementById('overview').scrollIntoView();}
  else if(hash==='#library'){if(returning&&homeScroll>0)window.scrollTo(0,homeScroll);else document.getElementById('library').scrollIntoView();}
  else if(hash==='#markets'||!hash)window.scrollTo(0,0);
  if(returning)main.focus({preventScroll:true});
 }
}
document.getElementById('snapshot').textContent=`この保存版を作成した日時：${new Date(data.generated).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})}（日本時間）`;
window.addEventListener('hashchange',render);render();
</script>
</body></html>
