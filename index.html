<script id="snapshot-data" type="application/json">{"overview": {"id": "overview-rising-demand.md", "title": "最近伸びている需要：いま見えている全体像", "summary": "個別の業界メモを並べる前に、横断で何が前に出ているかを書く。一次が薄いところは薄いと書く。更新日: 2026-09-21。短いメモを足すほど、横断の絵が少しずつはっきりする。", "text": "# 最近伸びている需要：いま見えている全体像\n\n個別の業界メモを並べる前に、横断で何が前に出ているかを書く。一次が薄いところは薄いと書く。更新日: 2026-09-21。短いメモを足すほど、横断の絵が少しずつはっきりする。\n\n## いま前に出ている動き\n1. **制度や義務が先に動く需要** — 物流の荷待ち計測・報告など。市場が勝手に熱くなる前に、法律が計測と提出を要求している。現場の「欲しい」より、提出期限のほうが先に来ることもある。\n2. **道具はあるのに現場に残らない** — 建設の施工管理。介護の周辺事務。入れたい声は高い。それでもExcelや紙が残る。厚くするより、二度手間を消す一点のほうが話が近い。\n3. **使う人が増えて、ルールや安心が後から追いつく** — 法律事務所の生成AI、リユースの品質保証。利用は広がる。一方で「疑われない」「誰が何を渡してよいか」がボトルネックになる。\n4. **生活は絞りつつ、体験と動画には時間が残る** — 家計のメリハリ（宿泊・外食）。スマホの時間は動画が長い。生活インフラのアプリは太い。\n5. **店舗では店長まわりの裏仕事が詰まっている** — 飲食だ。調理・接客より店舗管理の人手不足が目立つ、という政府側の整理がある。\n6. **保育は「入れた」が8割超でも、補助4機能が揃う園は1割強** — 連絡・登降園は進む。キャッシュレスは15%。紙や自治体とのつなぎが残る。政策は端末から4機能・施設管理PFへ移る。\n7. **産廃の電子マニフェストは捕捉率まだ3分の2、年約1割で伸びる** — 加入・登録とも2025年度に約1割増。国の目標75%（2030）に向け、建設・がれきなどが重点だ。\n8. **歯科はレセコンが主流なのに、国の言う電子カルテは1割強** — 厳しめの定義で12%。レセコン系は79%。2030年末ほぼ100%の法目標と、標準仕様・補助がこれから厚くなる。保育の「入っているのに揃わない」と、形が近い。\n\n## 個別メモへの入口\n- 物流の荷待ち計測・報告 → `jp-logistics-wait-report.md`\n- 建設の施工管理は必要でもExcelが残る → `jp-construction-apps-dont-stick.md`\n- 介護は特養記録が埋まり、空くのは周辺と別層 → `jp-care-layers-not-one.md`\n- 法律事務所はAI利用が先、ルールが後 → `jp-law-firm-ai-rules-lag.md`\n- 飲食は店長・店舗の裏仕事が詰まっている → `jp-food-store-ops-shortage.md`\n- 家計は絞りつつ宿泊・外食は残る → `jp-merihari-consumption.md`\n- スマホ上位は生活インフラ、時間は動画 → `jp-phone-daily-stack.md`\n- 中古は安さより品質保証が先 → `jp-reuse-quality-trust.md`\n- AI課金は席より「効いたか」 → `ai-pricing-renewal.md`\n- 横断：薄い道具は選ぶ・比べる・下調べ向き → `thin-tools-choose-compare.md`\n- 保育は入っているのに4機能が揃わない → `jp-nursery-ict-halfway.md`\n- 産廃の電子マニフェストはまだ捕捉率3分の2 → `jp-waste-emanifest-catchup.md`\n- 歯科はレセコン主流のまま電子カルテが1割強 → `jp-dental-ehr-rececon-gap.md`\n\n## まだ弱いところ\n薄い。\n\n塾の料金、小規模大家、農業の軽い事務は、一次が足りないのでメモにしていない。製造は見える化偏重の一次がある。だが「最近伸びている」時系列としては、まだ切れていない。美容は採用・定着の一次はある。事務道具の隙間は薄い。訪問看護は、記録の電子化が8割を超えていても、出退勤や経費などの事務システムは半分強にとどまる、という協会一次がある。介護メモと隣接するので、今回は深掘りしない。障害福祉には、ICT等で業務量を縮減する事業所のKPI（現状32.3%→2026年50%）がある。放課後デイ固有の事務導入率は、まだ薄い。柔整のオンライン請求は中間とりまとめ段階で、稼働前だ。家計調査の8月分は、2026年10月9日の公表を待つ。\n"}, "markets": [{"id": "ai-pricing-renewal.md", "title": "AIの課金は席より「効いたか」。更新で残るかどうかが問われている", "summary": "AIツールの課金需要は、人数（席）より使った量や成果に寄っている。更新で残らない。効き目が見えないと、更新のタイミングで削られる。2026年の課金の整理でも、席だけに頼らない形（利用量・ワークフロー・成果、その混ぜ）が増えており、売り手は席の数より効き目の見せ方を先に設計する必要がある、と読める。", "text": "# AIの課金は席より「効いたか」。更新で残るかどうかが問われている\n\n## ひとことで\nAIツールの課金需要は、人数（席）より使った量や成果に寄っている。更新で残らない。効き目が見えないと、更新のタイミングで削られる。2026年の課金の整理でも、席だけに頼らない形（利用量・ワークフロー・成果、その混ぜ）が増えており、売り手は席の数より効き目の見せ方を先に設計する必要がある、と読める。\n\n## これまで\nSaaSは席課金が当たり前だった。AIでも、まず席や定額で入り、効果はあとで見る、という売り方が多かった。導入そのものが目的になりやすかった時期もある。\n\n## いま\n形が変わっている。Bessemerの課金の整理では、席だけに頼らない形（利用量、ワークフロー、成果、その混ぜ）が増えている。成果課金は分かりやすい一方で、何をもって成功とするかの定義が難しい。\n\n更新のタイミングでは、効果が曖昧なままの道具は削られやすい、という見立てがある。devtoolsでも、ただ動かすだけでなく、あとで見返せる改善やルールに落ちるものが注目されやすい。\n\n## なぜ今か\n入れればよい、という時期は終わりつつある。残す理由が要る。測れない便利さは、熱くても更新で落ちやすい。\n\n## まだ分からないこと\n日本の中小で、成果課金がどこまで通るかは未確認だ。個人開発の薄いツールが、この圧力にどう応答すべきか。数字の見せ方の最小セットは何か。\n\n## 根拠\n- Bessemer Venture Partners「The AI pricing playbook for founders」（2026）\n- 同系統の解説・二次整理（席の比率低下、ハイブリッド増、などの要約）\n"}, {"id": "jp-care-layers-not-one.md", "title": "介護の記録ソフトは特養ではほぼ埋まった。空いているのは周辺と施設以外の層", "summary": "介護でいま動いている需要は、特養の介護記録ソフトそのものではない。都内特養の定点では導入95%前後とほぼ埋まっている。伸びているのは音声入力・議事録・文書作成など周辺と、訪問・通所など施設以外のレイヤだ。厚い一点を特養記録に置くのは遅く、空いている可能性があるのは周辺と別レイヤ、と読める。", "text": "# 介護の記録ソフトは特養ではほぼ埋まった。空いているのは周辺と施設以外の層\n\n## ひとことで\n介護でいま動いている需要は、特養の介護記録ソフトそのものではない。都内特養の定点では導入95%前後とほぼ埋まっている。伸びているのは音声入力・議事録・文書作成など周辺と、訪問・通所など施設以外のレイヤだ。厚い一点を特養記録に置くのは遅く、空いている可能性があるのは周辺と別レイヤ、と読める。\n\n## これまで\n記録は紙と手書き、連絡はPHSや電話が中心、というイメージが長かった。介護ソフト自体は入所系から先に広がり、国の補助やLIFE（科学的介護情報システム）も施設側を後押ししてきた。一方で「介護テクノロジー」という言葉は、リフトや見守りセンサーなどハードも含めて語られがちで、ソフトの飽和とハードの伸び悩みが同じ言葉の中で混ざりやすかった。\n\n## いま\n都内特養の定点調査（令和7年度。会員511施設中、有効回答343、回収率67%。ICTソフト設問はおおむね280前後が回答）では、介護記録ソフトの導入率は95.05%、日常的に使っているのは92.58%だった。前年も導入は9割超で、ここはほぼ埋まっている。\n\n同じ調査で、周辺は別の姿になる。音声入力は導入24.11%に対し日常活用は10.28%で、入れても日常で使えない施設が多い。議事録作成ソフトは導入が前年2.51%から18.09%へ、文書作成ソフト（ChatGPT等）は6.90%から17.73%へ跳ねた。日常活用はどちらも約11%で、関心は高いがまだ薄い。インカムは導入33.81%、日常活用24.91%。勤務表作成は導入16%前後にとどまる。\n\n国の側も動いている。厚労省の令和6年度改定後の効果検証（令和7年9〜11月、回答約6,875事業所）では、入所・居住・泊まり系で介護業務支援機器の導入が56.4%（前回調査時10.2%）、見守り支援機器が47.2%（同30.0%）と上がった、と結果概要に出ている。特養では介護テクノロジーを何かしら入れているところが約9割、という報道整理もある。ただ「生産性向上推進体制加算」まで見ると、加算Ⅱは特養でも請求ベースで3割前後、加算Ⅰは数％台で、導入したことと加算まで取れる運用は別問題だ。\n\n訪問・通所は、特養の記録ソフト飽和と同じ物差しでは切れない。厚労省委託の在宅系調査では、介護ロボットは訪問・通所とも未導入が9割前後で、費用が壁、という答えが多い。一方で連絡手段としてのスマホはほぼ当たり前で、記録の入力端末も据え置きPCがまだ厚い。レイヤが違う。\n\n## なぜ今か\n2024年度改定で生産性向上推進体制加算が入り、「見守り・インカム・記録ソフト」が制度の顔になった。賃上げ・職場環境の補助要件にも絡み始めている。特養では記録の土台が先に埋まり、関心が文書や議事録、生成AI寄りの周辺に移っている、と都高齢協もまとめている。\n\n推定だが、工場が狙う「薄い一点」を特養の記録ソフトに置くのは遅い。空いている可能性があるのは、(1) 特養でも導入と活用が割れている周辺（音声、議事録、文書）、(2) 訪問・通所・小規模居住など、施設記録ソフトとは別の運用の層、の二つだ。どちらも既存ベンダーと補助金の重力は強い。建設の「必要だが定着しない」に近いが、介護の特養記録はすでに定着側に寄っている。\n\n## まだ分からないこと\n訪問・通所・グループホームで、介護記録ソフトそのものの導入・日常活用が特養と比べてどれだけ薄いか。同じ定義の全国一次が、まだ揃いきっていない。音声や議事録を「入れたのに使わない」理由（音声認識の精度、記録様式との噛み合い、現場の余力）も、一次では切れていない。\n\n加算Ⅰまで取れない現場が、本当に欲しいのが薄いツールなのか、運用人材なのか。既存の大手介護ソフトの掲示板・シフト機能で足りているのか。ここも推定の域を出ない。\n\n## 根拠\n- （一次）東京都社会福祉協議会・東京都高齢者福祉施設協議会「令和7年度 デジタル機器（介護ロボット・ICT機器）等の導入及び活用に関する実態調査 報告書」https://www.tcsw.tvac.or.jp/bukai/kourei/chosa/documents/R7digital.pdf\n- （一次）厚生労働省「介護現場における生産性の向上等を通じた働きやすい職場環境づくりに資する調査研究事業（結果概要）」https://www.mhlw.go.jp/content/12300000/001696334.pdf\n- （一次寄り・委託）三菱総合研究所「訪問系や通所系サービスにおける介護ロボット・ICT等のテクノロジー活用…実態調査研究事業」報告書 https://pubpjt.mri.co.jp/pjt_related/roujinhoken/f6rq9400000012ed-att/R6_099_2_report.pdf\n- （二次・報道整理）CBnews「特養の9割で介護テクノロジー導入」（厚労省調査の紹介）https://www.cbnews.jp/news/entry/20260218174816\n"}, {"id": "jp-construction-apps-dont-stick.md", "title": "建設の施工管理は「必要」が9割超なのに、現場に残るのはまだExcel", "summary": "建設現場では施工管理をデジタル化したい、という需要はかなり共有されている。必要だと答えた人は9割を超える一方、主な手段はまだExcelで、クラウド型アプリ中心は1割未満だ。入れても二重入力で定着しない。足りないのは機能のカタログではなく、現場で使い続けられる一点の運用だ。", "text": "# 建設の施工管理は「必要」が9割超なのに、現場に残るのはまだExcel\n\n## ひとことで\n建設現場では施工管理をデジタル化したい、という需要はかなり共有されている。必要だと答えた人は9割を超える一方、主な手段はまだExcelで、クラウド型アプリ中心は1割未満だ。入れても二重入力で定着しない。足りないのは機能のカタログではなく、現場で使い続けられる一点の運用だ。\n\n## これまで\n日報、写真、工程、元請けへの提出様式は、Excel や紙で回すのが当たり前だった。DX の話は「入れれば進む」側に寄りやすく、現場の一日の動きまでは見ないことが多かった。\n\n## いま\n現場TECHが2026年3月に建設業従事者426人へ行った調査では、施工管理のデジタル化を必要だと答えた人が92.5%いる一方、主な手段は Excel 等の PC ソフトが68.5%、紙・手書きが12.7%、クラウド型の施工管理アプリ中心は8.5%にとどまる。\n\n施工管理アプリを「導入している」は31.9%。規模が大きいほど導入は進み、小規模では1割未満、大企業ではおよそ7割、という開きがある（同調査）。\n\n導入したあとも話は終わらない。アプリを入れた企業でも、業務の中心はまだ Excel、と答えた割合は62.5%。\n\nなぜ進まないか。現場で定着しない（36.9%）、操作の習得負担（35.9%）、既存の Excel・紙への転記による二重管理（32.2%）が上位に並ぶ。元請けへの提出が指定の Excel 様式のままだと、アプリに入れてもまた転記が要る。道具が増えたぶん、仕事が増える、という形になりやすい。\n\n導入済み企業の不満でも、現場定着、機能が多すぎて使いこなせない、操作性が並ぶ。乗り換え・追加を検討する理由でも、操作性が約半数と先頭に来る。\n\n負荷が高い作業としては、関係者との連絡・調整、日報・報告書、写真管理が上位に挙がる。ここは「機能を足す」より「同じことを二度やらない」側の話に近い。\n\n## なぜ今か\n働き方の上限や人手不足で、現場の余力は減っている。必要だという声は強いのに、道具を増やしただけでは仕事が増えるだけ、という経験が溜まっている、と読む。\n\n推定だが、薄い道具が刺さるとしたら、全部入りの施工管理スイートより、二重入力を減らす一点、あるいは元請け様式とのつなぎを楽にする一点のほうだろう。逆に、機能を足して厚くした製品は、定着の壁を高くしやすい。\n\n## まだ分からないこと\nこの調査は比較メディア側のインターネット調査で、国の統計ではない。サンプルの偏りはあるはずだ。職種（元請け／専門工事）、地方と都市、工種ごとの差はここからは切れない。\n\n「薄い一点ツール」が実際に払われるのか、既存大手（ANDPAD など）の隙間がどこまで空いているかも、まだ見ていない。小規模大家や介護の記録ソフトとは別レイヤで、提出様式の強制がどれだけ効いているかを、一次（国交省・業界団体）でも確認したい。\n\n## 根拠\n- （二次・調査）現場TECH「施工管理DX実態調査」（2026年3月、n=426）https://kensetsu.gemba-tech.jp/research/survey-sekokanridx/\n- （二次・調査）現場TECH「施工管理アプリの導入実態調査2026」（2026年3月調査／同年5月公開、n=426）https://kensetsu.gemba-tech.jp/research/survey-sekokanriapps-2026/\n- （二次・報道）ITmedia ビジネスオンライン、同調査の要約（2026年4月）https://www.itmedia.co.jp/business/articles/2604/03/news005.html\n"}, {"id": "jp-dental-ehr-rececon-gap.md", "title": "歯科の電子カルテは「本当の」導入が1割強。レセコンが主流のまま、2030年ほぼ100%へ押されている", "summary": "歯科診療所では、カルテまわりの道具はすでに入っていることが多い。ただし厚労省委託の定義で「電子カルテ」と言えるのは約12%にとどまる。カルテ作成支援つきレセコンが約79%で主流だ。法律は2030年末までに電子カルテ普及率をほぼ100%にするよう政府に義務づけている。いま前に出ている需要は、「紙から何かを入れる」より、…", "text": "# 歯科の電子カルテは「本当の」導入が1割強。レセコンが主流のまま、2030年ほぼ100%へ押されている\n\n## ひとことで\n歯科診療所では、カルテまわりの道具はすでに入っていることが多い。ただし厚労省委託の定義で「電子カルテ」と言えるのは約12%にとどまる。カルテ作成支援つきレセコンが約79%で主流だ。法律は2030年末までに電子カルテ普及率をほぼ100%にするよう政府に義務づけている。いま前に出ている需要は、「紙から何かを入れる」より、「レセコン中心の現場を、共有できる電子カルテ側へ移す・つなぐ」ことだ。壁は費用だ。\n\n## これまで\n歯科ではレセプトコンピュータ（レセコン）が長く当たり前だった。カルテ作成を手伝う機能つきレセコンで回り、紙のカルテと併用する院も少なくない。医科診療所より電子カルテの導入は遅れて見えていた。国の医療DXは、電子処方箋や情報共有を進める一方で、歯科向けの標準仕様や普及支援は後から厚くなってきた。\n\n## いま、何が伸びているか\n数字は二つある。定義が違うので、並べて読む。\n\nひとつは、厚労省委託「歯科電子カルテシステムの仕様の検討及び普及に向けた調査研究」（2026年7月21日〜8月14日、n=4,209）。「いつ・だれが修正したかの履歴をカルテシステム内で確認できる」場合だけを電子カルテと数える。この定義では電子カルテ12%、カルテ作成支援機能つきレセコン51%、同レセコンと紙カルテの併用28%、紙への手書き9%。レセコン側を合わせると約79%。主流はレセコンだ。\n\nもうひとつは、社会保険診療報酬支払基金のアンケート（2026年6月5〜10日）。回答した歯科診療所44,609施設のうち「電子カルテシステム導入済み」は18,533施設、41.5%（未回答を未導入に入れると36.8%）。こちらは自己申告の導入済みで、委託調査より広い。言い方がゆるいと4割前後、厳しく見ると1割強、という開きがある。\n\n政策の物差しは厳しいほうに寄っている。地域医療介護総合確保法第12条の3は、令和12年（2030年）12月31日までに電子カルテ普及率を約100%にするよう政府に求めている。厚労省の電子カルテ普及計画（2026年9月9日付）では、歯科向けに令和8年度中の標準仕様策定、認証製品の普及、パッケージ版への移行支援を並べ、令和9年度概算要求では歯科電子カルテ普及に54億円規模を計上している。未導入の理由は、導入・運用費用が高い、が先頭に来る。動機になり得る条件も、月額利用料が大きく増えないこと、既存端末を使えること、予約・画像・文書を一つにまとめられること、など費用と統合の話が多い。\n\n電子処方箋の側を見ると、薬局の導入はすでに9割前後まで進んでいる一方、歯科診療所は1割前後にとどまる、という整理もある（デジタル庁ダッシュボード系の2026年夏時点の紹介）。処方箋の受け皿は薬局側が先に揃い、発行側の歯科はまだ薄い、という構図だ。\n\n## なぜ今か\n三つが重なっている。\n\nひとつは、道具が「ない」のではなく、「あるが電子カルテとしては足りない」状態が厚いこと。レセコン79%は、現場がゼロから始まる話ではない。ふたつ目は、2030年末の法的目標が明示されたこと。みっつ目は、標準仕様・認証・導入補助が令和8〜9年度にまとまって動く予定であること。\n\n保育のICTが「入っているのに4機能が揃わない」のと似た形だ。ここでも、「入れたつもり」と「国が言う電子カルテ」のあいだに段差がある。伸びる需要の中身は、新規の厚物一式というより、レセコンからの移行・データ移行・政府の医療DXサービスへの接続・費用を抑えたクラウド寄りの製品、の側に近い、と読む。\n\n## まだ分からないこと\n支払基金の41.5%と委託調査の12%のあいだを、院ごとに突き合わせた全国表はない。ベンダー別のシェア、クラウドネイティブ製品の実際の供給量、データ移行の失敗率も、ここでは切れていない。電子処方箋の歯科側がどこまで追いつくか、標準仕様の中身が現場の入力負担をどう変えるかも、これからだ。\n\n工場向きの薄い道具だとすれば、全部入りの電子カルテ入れ替えより、移行時の転記・二重入力の消し込み、画像と歯式の画面一本化、費用比較の透明化、のどれかが近いかもしれない。どれが払われるかは、未確認だ。厚物の電子カルテ本体は、規制と認証が重い。\n\n## 根拠\n- （一次・政策・調査）厚生労働省「電子カルテ普及計画」（令和8年9月9日。支払基金アンケート2026年6月、歯科41.5%/36.8%。委託調査2026年7〜8月 n=4,209、電子カルテ12%・レセコン系79%。法的目標2030年末約100%。歯科向け概算要求54億円規模の記述）https://www.mhlw.go.jp/content/10808000/001748251.pdf\n- （二次・数値の再掲）MC Plus等による同資料の抜粋ページ（円グラフ内訳12%/51%/28%/9%の確認用）https://www.wic-net.com/material/document/25753/36\n- （一次・ダッシュボード）デジタル庁「電子処方箋の導入状況に関するダッシュボード」（薬局先行・医科/歯科は低め、という整理の入口）https://www.digital.go.jp/resources/govdashboard/electronic-prescription\n- （二次・報道だが法目標と整合）読売系報道「ほぼ全ての歯科医療機関、2030年までに電子カルテを導入へ」（2026年9月頃）※数値の根拠は上記厚労一次を優先\n"}, {"id": "jp-food-store-ops-shortage.md", "title": "飲食で足りないのは調理より店長。店舗の裏仕事が先に詰まっている", "summary": "飲食でいちばん足りないのは、調理や接客そのものではない。店舗管理を回す人だ。店長の有効求人倍率は約10倍と、接客・調理より高い。シフト、在庫・発注、売上の入力と見方、スタッフの人事に時間が吸われている。政府の省力化メニューにも、ロボットだけでなく店舗管理向けITが入っている。", "text": "# 飲食で足りないのは調理より店長。店舗の裏仕事が先に詰まっている\n\n## ひとことで\n飲食でいちばん足りないのは、調理や接客そのものではない。店舗管理を回す人だ。店長の有効求人倍率は約10倍と、接客・調理より高い。シフト、在庫・発注、売上の入力と見方、スタッフの人事に時間が吸われている。政府の省力化メニューにも、ロボットだけでなく店舗管理向けITが入っている。\n\n## これまで\n人手で回す前提が長かった。注文は口頭や紙。売上は手書きやExcel。発注は勘と経験。予約やPOS、モバイルオーダーが入っても、店の裏仕事まで一気に軽くなった店は少なかった、と政府側の整理でも読める。\n\n## いま\n数字がきつい。農林水産省・厚生労働省の「省力化投資促進プラン（飲食業）」（令和7年6月）では、飲食の従業者は約400万人、パート・アルバイトが約8割、資本金5,000万円未満が98％。有効求人倍率（令和5年度）は飲食店店長が約10倍、接客が約5倍、調理が約2.9倍で、地方の方が高い傾向もある。従業員1人あたり付加価値は約219万円。全産業より低く、時系列でも漸減だ。\n\n政府は2029年度までに労働生産性を35％上げる目標を置き、2025〜2029年を集中投資の期間にしている。令和8年2月には業界行動計画としてのガイドブックも出た。そこに並ぶのは調理ロボットや配膳ロボットだけではない。在庫・発注、販売管理、勤怠・シフト、教育動画など、店舗管理向けのITもメニューに入っている。小規模・個人の「平均的な水準」では、店舗管理の省力化が進んでいない、という整理もある。\n\n## なぜ今か\n不足の芯が「店を回す役」に寄っている。省力化投資補助金やIT導入補助金、公庫融資といった後押しも、設備とあわせて店舗管理のITに触れている。需要が急に生まれた、というより、足りなさが数値で見え、投資の話が揃ってきた、と読むのが近い（推定含む）。\n\nただ、カタログの顔はロボットや厨房機器が目立つ。町の一店が本当に詰まっているのがシフトと発注なのか、配膳ロボットなのか。プランだけではまだ切れない。\n\n## まだ分からないこと\n店舗管理ソフトの導入率や定着率の一次がない。Excelや紙のままの店がどれだけかも分からない。都市と地方、業態の差も未確認だ。建設のメモで見た「入れてもExcelが残る」が、飲食でも起きているかは不明。政策の本丸は、数店舗を持つ中小を中堅へ伸ばす支援なので、町の一店向けに薄い一点が空いているかまでは、まだ言えない。\n\n## 根拠\n- 農林水産省・厚生労働省「省力化投資促進プラン ―飲食業―」（令和7年6月13日）https://www.cas.go.jp/jp/seisaku/atarashii_sihonsyugi/shouryokukatousi/01.pdf\n- 農林水産省「飲食店の未来を変える自動化・省力化ガイドブック」（省力化投資促進業界行動計画、令和8年2月公表）https://www.maff.go.jp/j/shokusan/gaisyoku/syoryokuka.html\n- 同プランが引用する厚生労働省「職業安定業務統計」、経済産業省「企業活動基本調査」等\n"}, {"id": "jp-law-firm-ai-rules-lag.md", "title": "法律事務所は生成AIを使い始めた。事務所のルールが追いついていない", "summary": "法律事務所では、生成AIを業務に載せ始めた人が関心層で約7割まで広がっている。ルールは追いついていない。事務職員向けの研修やガイドラインはまだ薄い。使う人が先で、事務所としての枠が後から来る。需要の芯は機能カタログではない。「誰が・何を・どこまでAIに渡してよいか」の決まり方にある。", "text": "# 法律事務所は生成AIを使い始めた。事務所のルールが追いついていない\n\n## ひとことで\n法律事務所では、生成AIを業務に載せ始めた人が関心層で約7割まで広がっている。ルールは追いついていない。事務職員向けの研修やガイドラインはまだ薄い。使う人が先で、事務所としての枠が後から来る。需要の芯は機能カタログではない。「誰が・何を・どこまでAIに渡してよいか」の決まり方にある。\n\n## これまで\n事務の軽量化は生成AIの前から進んでいた。同じ小委員会の2022年調査では、メール・カレンダー共有やファイル共有・事件管理を入れた事務所の多くで、事務職員の業務量が減ったと弁護士自身が答えていた（減少率は7〜8割前後）。当時、AI契約書レビューの導入はまだごく少なかった。\n\n並行して、民事裁判の手続もデジタル化が進んだ。裁判所の説明では、令和8年5月21日から改正民事訴訟法等が全面施行され、訴訟代理人はオンラインでの申立て等が原則義務になった。当面はmints（民事裁判書類電子提出システム）を使う。\n\n## いま\n日弁連の弁護士業務改革委員会・事務職員関連小委員会が、2026年3月23日〜4月27日に「事務職員と生成AIに関するアンケート」を実施した（有効回答223件）。対象は「主に事務職員を雇用する会員、または生成AIの利用に関心のある会員」なので、全弁護士の縮図ではない。その前提で読む。\n\n事務所での利用は広がっている。弁護士と事務職員がともに業務で使うが26.7%、弁護士のみが43.4%。いずれかの形で使う事務所は合わせて約7割だ。使っていないのは29.4%。禁止はほぼいない（0.5%）。ツールはGeminiが突出している（利用者のうち79.4%）。Google Workspaceに付いて追加料金が要らない、というのが報告書の読みだ。ChatGPTは49.7%、リーガルリサーチ特化型は29.7%（Legalscapeが名寄せで多い）。\n\n一方、事務所の方針は薄い。事務職員の利用について「特にルールはなく個人の判断に任せている」が31.8%で最多。推奨は24.5%、許可制・一定ルール下は10.6%。研修やガイドラインを「実施・策定済み」は10.1%、「予定はない」が41.2%だった。事務職員まで使わせている事務所では策定済みが24.6%なのに対し、弁護士のみ利用では1.1%。使わせてから体制を考える、という順番が見える。\n\n懸念の上位は正確性（68.1%）とセキュリティ・機密（63.2%）。期待する効果は、弁護士の負担軽減や時間短縮が中心で、人件費抑制を挙げたのはごく少数だった。実際に事務職員を雇っている層ほど、採用を大きく減らす見通しは弱い。\n\n制度側の押しもある。民事裁判IT化の義務化はすでに始まっている。会員向けの意識調査（弁護士ドットコム、2026年4月、n=301）では登録済みが86.7%でも、担当事件で未使用が39.1%という数字が出ている。登録と日常の使いこなしは別、という話だ（ベンダー調査なので、日弁連一次ほど強くは置かない）。\n\n## なぜ今か\n三つの圧力が重なっている、と読むのが近い。汎用の生成AIが関心層では約7割まで業務に入ったこと。裁判手続のオンライン義務化で「紙だけ」がやりにくくなったこと。そして、事務職員の定型作業が、共有ツールの時代からすでに縮み続けていること。この三つだ。\n\n足りないのは機能カタログではない。禁止より放置の方が多い。この調査の芯に見えるのは、「誰が・何を・どこまでAIに渡してよいか」の事務所内の決まり方だ（推定含む）。建設メモで見た「入れても定着しない」とは形が違う。こちらは「もう使っているのに、事務所としての枠が後から来る」。\n\n## まだ分からないこと\n関心層・事務職員雇用層に寄ったサンプルなので、無関心の一人事務所や大事務所の実態は別だ。税理士・社労士など他の士業で同じギャップがあるかも、公開の一次ではまだ薄い。日税連の実態調査は会員向け資料が主で、今回は数字まで追えていない。\n\n「安心」の需要が、ガイドラインの雛形なのか、学習しない契約の確認支援なのか、事件情報を入れない使い方の型なのか。調査だけでは切れない。また、Legalscapeなど特化型と汎用の使い分けが、小規模事務所でどこまで広がるかも未確認だ。\n\n## 根拠\n- 日本弁護士連合会「第24回弁護士業務改革シンポジウム 第2分科会資料」内「事務職員と生成AIに関するアンケート調査 報告書」（調査期間2026年3月23日〜4月27日、有効回答223件）。分科会資料であり日弁連見解ではない旨の注記あり https://www.nichibenren.or.jp/library/pdf/document/symposium/gyoukaku_sympo/24th_report_2.pdf\n- 裁判所「改正民訴法等で変わる民事訴訟手続の概要」（令和8年5月21日施行のオンライン申立て等）https://www.courts.go.jp/saiban/minjidejitaruka/minso_gaiyou/index.html\n- （参考・二次）弁護士ドットコム「民事裁判IT化に向けた弁護士への意識調査2026年版」（2026年4月、会員弁護士301名）https://www.bengo4.com/corporate/news/article/xn0to2-8fmfr/\n"}, {"id": "jp-logistics-wait-report.md", "title": "物流の荷待ちは、市場より先に制度が計測と報告を求めている", "summary": "物流でいま前に出ているのは、荷待ち・荷役を測って短くし、国に報告する需要だ。改正物流効率化法で、一定規模以上には中長期計画と取組状況の定期報告が義務になった。厚い倉庫システム全体ではない。「測る・集める・様式に落とす」一点が、制度で先に動いている。", "text": "# 物流の荷待ちは、市場より先に制度が計測と報告を求めている\n\n## ひとことで\n物流でいま前に出ているのは、荷待ち・荷役を測って短くし、国に報告する需要だ。改正物流効率化法で、一定規模以上には中長期計画と取組状況の定期報告が義務になった。厚い倉庫システム全体ではない。「測る・集める・様式に落とす」一点が、制度で先に動いている。\n\n## これまで\nいわゆる2024年問題で、運び側の余力は先に削られた。ドライバーの時間外に上限がかかったからだ。荷待ち・荷役はホワイトボードや手書き、Excelで残すことが多かった。荷主が施設ごとの平均を、毎年きちんと出す運用は、まだ薄かった。\n\n国交省の拘束時間調査では、2024年度時点の1運行あたり荷待ち・荷役等は約3時間台だった（内訳の合計は3時間18分前後）。\n\n## いま\n2025年4月から、荷主・物流事業者には荷待ち・荷役短縮などの努力義務がかかった。2026年4月に改正法が全面施行され、一定規模以上の特定事業者には中長期計画の提出と取組状況の定期報告が義務になった。特定荷主と特定連鎖化事業者には、物流統括管理者（CLO）の選任も要る。\n\n指定の目安は公式ポータルと説明資料で次のとおりだ。特定荷主・特定連鎖化事業者は取扱貨物重量9万トン以上（上位3,200社程度）、特定貨物自動車運送事業者等は保有車両150台以上（上位720社程度）、特定倉庫業者は保管量70万トン以上（上位70社程度）。第一種（主に発）と第二種（主に着）は合算せず、基準を超えた区分で届出する。経産省は令和8年7月31日時点の特定荷主等の指定状況とリストを公開している。\n\n手続の山は、いま中長期計画側にある。2026年度に限り提出は10月末目安、2027年度以降は7月末。定期報告（様式第5）は、指定を受けた翌年度から毎年度7月末まで。初回の定期報告は、2026年度指定分なら2027年7月末が目安になる。提出は原則 e-Gov の電子申請だ。\n\n定期報告ではチェックリストに加え、施設ごとの荷待ち時間等が要る。原則は荷待ちと荷役を分けて測る。算定の起算は、指示時刻があればその時刻から、なければ到着から、とポータルの算定ページで整理されている。サンプリングも、受渡しが一定時間以内（荷待ち時間等1時間以内など）なら報告を省略できる仕組みもある。ポータルは、デジタルで把握するのが望ましい、としている。\n\n国交省の2025年度拘束時間調査（実運送向け。調査は2025年11〜12月、内容は同年4〜8月の通常期の代表運行）では、1運行の平均拘束は10時間13分、荷待ち・荷役等は2時間2分だった（荷待ち約1時間、荷役約48分、附帯約14分）。前年調査から拘束は約1時間33分減り、うち荷待ち・荷役等の減が約1時間16分と大きい。努力義務の開始が寄与した、と国交省は見ている。目標は1運行2時間以内。長いケースはまだある、とも書いている。\n\n一方で、様式第5向けの専用サービスも出始めている。受付から完了までの時刻を取り、平均を報告用に落とすものだ（例: ヨビトラ、Rentals 荷待ち記録）。既存のWMSやバース予約はそのままにして、計測だけ足す、という売り方も見える。\n\n## なぜ今か\n義務の期限が切れている。2026年度の実績は、後から作れない。努力義務の年に平均は縮んだ。いま中長期計画の提出が迫り、その先に定期報告が続く。「測れていない」ことのコストが上がる、と読む。\n\n推定だが、厚い物流スイート全体より、荷待ちの一点計測と報告寄せのほうが、制度の形に沿って需要が立ちやすい。ただ、その一点にも専用サービスがすでに並び始めている。「空いている」とは言い切れない。\n\n## まだ分からないこと\n特定荷主の規模帯ごとに、いま何で測っているか。手書きか、Excelか、バース予約か、専用SaaSか。一次の分布はまだ掴めていない。指定リストは出たが、現場の計測手段までは載っていない。\n\n運送会社や中小倉庫は義務の外でも、荷主からデータ提出を求められる、という二次の話はある。どこまで広がるかは未確認だ。建設の施工管理と同じ「二度入力」が現場で起きているか。制度対応の薄いツールが本当に払われるか。既存の予約システムとの隙間がどれだけ空いているか。ここも、まだ切れていない。\n\n## 根拠\n- （一次）国土交通省「物流効率化法」理解促進ポータル https://www.revised-logistics-act-portal.mlit.go.jp/\n- （一次）同ポータル／定期報告（計測・サンプリング・報告省略） https://www.revised-logistics-act-portal.mlit.go.jp/regular-report/\n- （一次）同ポータル／荷待ち・荷役等の算定方法 https://www.revised-logistics-act-portal.mlit.go.jp/method/\n- （一次）同ポータル／荷主判断基準解説書 https://www.revised-logistics-act-portal.mlit.go.jp/files/pdf/sippers-judgment-criteria-book.pdf\n- （一次）経済産業省「物流効率化法について」（様式第1〜5、対応の手引き、指定状況・リスト、判断基準解説） https://www.meti.go.jp/policy/economy/distribution/butsuryu-kouritsuka.html\n- （一次）国土交通省説明資料「物流効率化法における特定事業者の指定の届出及び統括物流管理者の選任について」（指定基準・スケジュール） https://www.mlit.go.jp/jidosha/content/002005608.pdf\n- （一次）国土交通省 報道発表「トラックドライバーの１運行当たりの平均拘束時間に関する調査結果の公表」（2025年度） https://www.mlit.go.jp/report/press/tokatsu02_hh_000084.html\n- （一次）同上・調査結果PDF https://www.mlit.go.jp/report/press/content/002011131.pdf\n- （二次・製品）ヨビトラ、Rentals 荷待ち記録など、様式・計測寄せの公開説明（存在確認用。導入率の一次ではない）\n"}, {"id": "jp-merihari-consumption.md", "title": "家計は全体を絞りつつ、宿泊と外食のご褒美は残している", "summary": "家計全体の消費は、実質でマイナスが続く。宿泊や外食には、まだお金が動いている。総務省の家計調査（2026年7月分）では、二人以上世帯の消費支出が実質前年同月比マイナス3.6%なのに対し、宿泊料は実質プラス24.5%、外食はプラス5.9%だった。生活費は抑え、体験のご褒美は残すメリハリ需要だ。ただ現場は予約・決済・席の…", "text": "# 家計は全体を絞りつつ、宿泊と外食のご褒美は残している\n\n## ひとことで\n家計全体の消費は、実質でマイナスが続く。宿泊や外食には、まだお金が動いている。総務省の家計調査（2026年7月分）では、二人以上世帯の消費支出が実質前年同月比マイナス3.6%なのに対し、宿泊料は実質プラス24.5%、外食はプラス5.9%だった。生活費は抑え、体験のご褒美は残すメリハリ需要だ。ただ現場は予約・決済・席の話になりやすく、小さなツールで取りに行きやすいとは限らない。\n\n## これまで\n節約といえば、外食や旅行から切る、というイメージが強かった。全体の消費が弱いときは、娯楽や外出も一緒に沈みやすかった。\n\n## いま\nマイナスは8か月続いている。全部を削っているわけではない。調理食品や飲料は減っている、という報道もある。日々の積み重ねは抑えつつ、泊まる・外で食べるには予算を残している、と読める。\n\n## なぜ今か\n物価高で生活防衛の圧力はある。同時に、節約疲れや「自分へのご褒美」も前から言われてきた。家計調査は、その両方が同居していることを裏づけている、と見る。\n\nただ、宿泊も外食も、予約や決済や席の話になりやすい。需要が熱いから、小さなツールで取りに行きやすい、とは限らない。\n\n## まだ分からないこと\nこのメリハリが、どの年代・所得帯で強いか。旅行と近場の外食のどちらが主か。物価が落ち着いたあとも続くか。\n\n## 根拠\n- 総務省統計局「家計調査報告」2026年7月分（2026年9月4日公表）\n- 同発表を伝える報道（宿泊・外食の伸び、調理食品・飲料の減少）\n"}, {"id": "jp-nursery-ict-halfway.md", "title": "保育のICTは「入っている」が8割超なのに、補助4機能が揃う園は1割強", "summary": "保育施設のICT導入は、もう珍しくない。なにかしら入っている園は8割を超える。ただし国の補助金が想定する4機能（登降園・保護者連絡・計画記録・キャッシュレス）が全部そろっているのは、約1割だ。連絡と登降園は7割前後ある。キャッシュレスは15%にとどまる。入れても紙や手書きが残り、自治体の給付システムともつながらない、…", "text": "# 保育のICTは「入っている」が8割超なのに、補助4機能が揃う園は1割強\n\n## ひとことで\n保育施設のICT導入は、もう珍しくない。なにかしら入っている園は8割を超える。ただし国の補助金が想定する4機能（登降園・保護者連絡・計画記録・キャッシュレス）が全部そろっているのは、約1割だ。連絡と登降園は7割前後ある。キャッシュレスは15%にとどまる。入れても紙や手書きが残り、自治体の給付システムともつながらない、という声がある。いま動いている需要は「とにかく入れる」より、「途中まで入った状態を仕上げる・つなぐ」側に近い。\n\n## これまで\n連絡帳、登降園、保育計画・日誌、保育料の現金集金は、紙や手書きで回すのが当たり前だった。国は保育ICT補助金で導入を後押ししてきた。現場では「入れたかどうか」が先に見えやすく、4機能が揃っているか、紙が消えたかまでは見えにくかった。\n\n## いま、何が伸びているか\n数字ははっきりしている。こども家庭庁の委託で三菱UFJリサーチ＆コンサルティングが行った全国調査（2024年9〜10月、有効16,709施設）では、いずれかの保育ICTを導入している園は84.4%。補助金対象の4機能のいずれかを入れているのは80.8%。一方、4機能すべてを入れているのは11.7%にとどまる。\n\n機能別を見ると差が大きい。保護者連絡71.5%、登降園管理71.3%、計画・記録55.4%。キャッシュレス決済は15.0%で、聞いた機能のなかでいちばん低い。キャッシュレスを除く3機能が揃っている園は48.7%。足りない一点として、キャッシュレスが目立つ。\n\n地域型保育（小規模など）は、認可保育所より導入が低い。ヒアリングでは、導入後も手書きが残る、登降園データをうまく使えていない、シフト表をシステムがあるのに手書きで直す、市の給付システムと保育ICTが連動していない、といった声が並ぶ。導入率が高い自治体では、新規の補助金申請が頭打ち、という話もある。\n\n政策も動いている。こども家庭庁の「こども政策DXの取組方針2025」（2025年6月）は、2025年度中にICT端末導入率100%、2026年度中に4機能導入施設20%以上を目指す、と書いている。その先は、給付・監査の施設管理プラットフォームや保活のワンストップなど、園と自治体のつなぎが本丸になる想定だ。\n\n## なぜ今か\n導入そのものは、すでに広い。次に前に出ているのは三つだ。（1）4機能のなかで遅れている一点（とくにキャッシュレス）を埋めること。（2）入れたあとも残る紙・手書き・二重入力を減らすこと。（3）園のICTと自治体の給付・監査をつなぐこと。\n\n国の目標が「端末」から「4機能20%」へ移る。R8前後では施設管理PFの試行・展開が続く。現場とベンダーの関心は、「新規導入」から「足りない機能の追加」と「行政側とのつなぎ」に寄っていく、と読む。人手不足のなかで、保育士がこどもと向き合う時間を増やす、という政策の言い方も同じ方向を向いている。\n\n## まだ分からないこと\nこの調査は国の委託による大規模一次だ。ただ認可外は対象外に近い扱いがあり、小規模・認可外の「軽い事務」需要はまだ薄い。キャッシュレスが低い理由（決済手数料、保護者の現金志向、自治体の保育料徴収の仕組みなど）は、ここでは切れない。\n\n既存の保育ICTベンダー（連絡帳・登降園が強い一式）の隙間が、どこまで空いているかも未確認。工場向きの薄い道具だとすれば、全部入りの入れ替えより、キャッシュレス一点、紙の消し込み一点、自治体様式への転記を減らす一点、のどれかが近い。どれが払われるかは、まだ見ていない。\n\n## 根拠\n- （一次・調査）こども家庭庁委託・三菱UFJリサーチ＆コンサルティング「保育施設等におけるICT導入状況等に関する調査研究事業 報告書」（調査2024年9月11日〜10月25日、有効16,709施設、参考回収率43.7%）https://www.murc.jp/wp-content/uploads/2025/05/koukai_250515_01.pdf\n- （一次・政策）こども家庭庁「こども政策DXの推進に向けた取組方針2025について」（令和7年6月30日、資料3-1）https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/6cfab22c-d2bf-4dd1-81ea-49308519ac3a/c84318d1/20250707_councils_kodomo_seisaku_DX_6cfab22c_09.pdf\n- （一次・政策）こども家庭庁「保育DXの推進による業務改善」（保育政策資料、2026年4月時点の庁内資料系）https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/e4b817c9-5282-4ccc-b0d5-ce15d7b5018c/dabfd184/20260401_policies_hoiku_214.pdf\n"}, {"id": "jp-phone-daily-stack.md", "title": "日本のスマホ上位は生活インフラ。時間の中身では動画がいちばん長い", "summary": "日本でよく開かれる無料アプリは、予約や決済、LINE、天気など生活の土台が多い。時間の使い方では、ネットの中でもいちばん長いのが動画投稿・共有サービスの視聴だ。アメリカで目立った中古特化や予測市場の並びとは違う。国を混ぜると需要の地図が歪む。", "text": "# 日本のスマホ上位は生活インフラ。時間の中身では動画がいちばん長い\n\n## ひとことで\n日本でよく開かれる無料アプリは、予約や決済、LINE、天気など生活の土台が多い。時間の使い方では、ネットの中でもいちばん長いのが動画投稿・共有サービスの視聴だ。アメリカで目立った中古特化や予測市場の並びとは違う。国を混ぜると需要の地図が歪む。\n\n## これまで\nスマホの人気はゲームやSNSで語られがちだった。国ごとの差はあっても、同じグローバル地図でざっくり見ることが多かった。テレビとネットのどちらが長いかも、年によって揺れやすかった。\n\n## いま\n2026年9月前半の観測では、日本の無料ランキング上位に、LINE、決済、天気、予約（美容など）、短尺動画、AIチャットが並ぶ。Play側でも似た傾向がある。アメリカ側で目立っていた中古特化や予測市場は、同じ位置には来ていない。\n\n総務省情報通信政策研究所の令和7年度調査（実査は令和7年12月、概要は令和8年6月）では、全年代（13〜79歳）の平均利用時間は、平日インターネット183.9分・テレビ（リアルタイム）156.1分、休日はネット192.9分・テレビ189.2分。ネットがテレビを上回り、差は広がっている。60代以上の平日など、年代によってはまだテレビの方が長い。\n\nネットの中身では、平日・休日とも「動画投稿・共有サービスを見る」が最長で、平日全年代54.5分（行為者に限らない平均）。10代は平日127.2分、休日166.1分まで伸びる。利用率はLINE 92.9％、YouTube 81.5％、TikTok 36.7％（10代は67.9％）。オンデマンド型の動画共有は全年代84.7％。早く知るならネット、信頼できる情報となると全体ではまだテレビが強い、という構図も続いている。\n\n## なぜ今か\n日本では、スマホが「遊び場」だけでなく、支払い・予約・連絡の入口として先に埋まっている、と読める。そのうえで、余った注意の多くが動画に流れている。だから同じ「熱い」でも、国を混ぜると需要の地図が歪む。時間の奪い合いの相手は、テレビからネットへ、ネットの中ではテキストより動画へ、と移っている（推定含む）。\n\n## まだ分からないこと\niOSとAndroidでどこまで同じか（週次の揺らぎは大きい）。地方と都市の差。決済・予約のどれが「不便で困っている」のかは、ランキングだけでは分からない。動画の長さが、仕事や学習の道具需要にどうつながるかも、この調査だけでは言えない。\n\n## 根拠\n- Google Play 日本・無料アプリランキング（2026年9月7日前後の観測）\n- App Store 日本・無料週次の観測（PM、〜2026年9月6日）\n- 総務省情報通信政策研究所「令和7年度情報通信メディアの利用時間と情報行動に関する調査報告書（概要）」（令和8年6月）https://www.soumu.go.jp/main_content/001079136.pdf\n"}, {"id": "jp-reuse-quality-trust.md", "title": "中古は安さだけでは動かない。高額ほど品質保証が先に来る", "summary": "中古を検討する人は増えている。安さだけでは足りない。動かない。高額帯ほど「本物か」「傷はないか」が先に来て、品質保証がないと止まる人が多い一方、保証があると前に進む人も多い、という調査がある。疑われないことが、買う条件になっている。", "text": "# 中古は安さだけでは動かない。高額ほど品質保証が先に来る\n\n## ひとことで\n中古を検討する人は増えている。安さだけでは足りない。動かない。高額帯ほど「本物か」「傷はないか」が先に来て、品質保証がないと止まる人が多い一方、保証があると前に進む人も多い、という調査がある。疑われないことが、買う条件になっている。\n\n## これまで\nフリマや中古は、とにかく安く手に入れる場所、という印象が強かった。品質は自分の目と運に寄りがちだった。\n\n## いま\n物価が重い時期に、リユースを検討する人は増えている。メルカリの調査でもその動きは見える。一方で高額帯では、品質保証がないと止まる人が多い。保証があると、かなりの人が前に進む、という数字もある。\n\n日本のスマホでは、無料アプリの上位に予約や決済、生活インフラが並ぶ。アメリカで目立った中古特化アプリの並びとは違う。国をまたいで同じ地図を描くと歪む。\n\n## なぜ今か\n生活防衛で「賢く買う」圧力はある。疑ってから買う。安さより先に、疑われないことが条件になっている、と読める。\n\n## まだ分からないこと\nどこまで効くか。どの品目・価格帯で保証が効くのか。誰が保証のコストを払うのか。買取店など、フリマ以外でも同じ構造かは、まだ切れていない。\n\n## 根拠\n- メルカリ「リユースに関する意識調査」（2026年5月公表としてストック）\n- 日本のApp Store／Google Play無料ランキング（2026年9月前半の観測）\n"}, {"id": "jp-waste-emanifest-catchup.md", "title": "産廃の電子マニフェストはまだ捕捉率3分の2、加入も登録も年約1割伸びている", "summary": "産業廃棄物の委託処理を電子で追う「電子マニフェスト」。この需要は、まだ伸びている。2025年度の捕捉率は約66.5%。2030年度の国の目標は75%で、まだ届いていない。同じ年の加入者は約35.7万者（前年度比約10%増）、年間登録は約4,751万件（同約9%増）だ。紙から電子への切り替えは進んでいる。ただ、終わって…", "text": "# 産廃の電子マニフェストはまだ捕捉率3分の2、加入も登録も年約1割伸びている\n\n## ひとことで\n産業廃棄物の委託処理を電子で追う「電子マニフェスト」。この需要は、まだ伸びている。2025年度の捕捉率は約66.5%。2030年度の国の目標は75%で、まだ届いていない。同じ年の加入者は約35.7万者（前年度比約10%増）、年間登録は約4,751万件（同約9%増）だ。紙から電子への切り替えは進んでいる。ただ、終わってはいない。JWセンター自身も、委託量に対して利用が相対的に少ない建設業（がれき類）などを重点に、普及を続けている。\n\n## これまで\n産廃を他人に処理委託するとき、紙のマニフェストで流れを記録する。それが長いあいだの当たり前だった。電子マニフェスト（JWNET）は1990年代末から段階的に広がり、加入者と登録件数は年々積み上がってきた。一部の多量排出などは、電子が義務に近い扱いになる場面もある。一方で現場では紙と電子が並走し、業種によって進み方が違う状態が続いていた。\n\n## いま、何が伸びているか\nJWセンターの統計（2026年6月更新）を見る。数字ははっきりしている。\n\n- 加入者: 2024年度末 323,812者 → 2025年度末 356,593者（約10.1%増）。うち排出約31.5万、収集運搬約3.2万、処分約1.1万。\n- 年間登録件数: 2024年度 約4,347万件 → 2025年度 約4,751万件（約9.3%増）。直近1年（2025年9月〜2026年8月）は約4,915万件。\n- 捕捉率（産廃委託処理量に対し電子で掴めた量の割合）: 2024年度 約64.5% → 2025年度 約66.5%。分母は環境省が算出した委託量を踏まえ16億トン規模（160,000千t）で固定し、分子は電子で把握した委託量（2025年度約106,468千t）。\n\n業種別を見ると、排出事業者の加入では医療・福祉が約4割、卸小売が約2割と人数が多い。一方、登録件数では建設業が約35.4%と最大だ。現場の物量は建設に偏る。加入者数では、建設は約9.6%にとどまる。人数の広がりと、がれきなどの重い量のカバーは、別の話になっている。\n\n政策側の物差しも変わった。第五次循環型社会形成推進基本計画（2024年8月閣議決定）では、従来の件数ベースの電子化率に代わり「捕捉率」を採用し、2030年度に75%を目標にしている。JWセンターの令和5年度事業報告でも、利用割合が相対的に少ない建設業（がれき類）等を重点普及対象とし、建設ディレクター協会との座談会や建設向け研修を続けている、と書いている。短い話ではない。\n\n## なぜ今か\n三つが重なっている。\n\nひとつは、捕捉率がまだ目標の手前だということ。年に数ポイントでも前に進む余地がある。ふたつ目は、加入・登録が2025年度も約1割ペースで増えていること。みっつ目は、国の指標が「件数の電子化」から「委託量の捕捉」に移ったこと。物量が大きいのに相対的に薄い業種（建設・がれき）が、明示的な普及対象になっている。\n\n環境新聞が伝えるJWセンターの説明でも、2030年度75%に向けて建設業（がれき類）等への普及を続ける、としている。電子化そのものは、新しい話ではない。「残り約1割ポイントの捕捉」と「建設現場まわりの追いつき」。いまの伸びの中身は、そこに近い。\n\n## まだ分からないこと\nJWNET本体以外の薄い道具が、どれだけ払われるかは一次では切れない。現場スマホ入力、紙からの移行補助、建設事務とのつなぎ——候補はある。捕捉率の分母は2021年度委託量をベースにした固定値だ。実際の委託量が増減すると、見え方がずれる可能性がある。業種別の「紙が残っている割合」の全国表は、ここでは取れていない。令和9年（2027年）4月施行予定の電子マニフェスト項目追加（再資源化等）が、現場の運用負荷をどう変えるか。それも、まだこれから。\n\n## 根拠\n- （一次・統計）公益財団法人日本産業廃棄物処理振興センター「電子マニフェスト統計情報」（※2026年6月更新、2025年度捕捉率約66.5%、加入約35.7万、登録約4,751万件）https://www.jwnet.or.jp/jwnet/about/assets/files/2025jwnet_toukei.pdf\n- （一次・統計・前年）同「電子マニフェスト統計情報」（2024年度版、捕捉率約64.5%）https://www.jwnet.or.jp/jwnet/about/assets/files/2024jwnet_toukei.pdf\n- （一次・指標説明）電子マニフェスト「捕捉率・登録件数」https://www.jwnet.or.jp/jwnet/about/regist/\n- （一次・事業）JWセンター「令和5年度事業報告」（建設業・がれき類を重点普及対象とする記述）https://www.jwnet.or.jp/center/assets/files/r5_houkoku.pdf\n- （二次・報道だが数値はJW一次と整合）環境新聞オンライン「電子マニフェスト加入者が35万6593者に」（2025年度＋10.1%、捕捉率速報66.8%、建設・がれきへの普及方針）https://www.kankyo-news.co.jp/news/b087806f-082c-4e3c-87b0-1042ef1fc0f8\n"}, {"id": "thin-tools-choose-compare.md", "title": "横断の見立て：熱い需要そのものより、選ぶ・比べる・下調べの一点が薄い道具向き", "summary": "これは個別業界の需要メモではない。横断の見立てだ。人がたくさん集まる場所ほど、決済や信頼、在庫やプラットフォームが絡んで重くなりやすい。いまの前提で薄い道具が届きやすいのは、買う・予約する一段手前の「選ぶ・比べる・下調べ」、あとで見返せる記録、二度入力を消す一点だ。熱いからすぐ薄く作れる、ではない。", "text": "# 横断の見立て：熱い需要そのものより、選ぶ・比べる・下調べの一点が薄い道具向き\n\n## ひとことで\nこれは個別業界の需要メモではない。横断の見立てだ。人がたくさん集まる場所ほど、決済や信頼、在庫やプラットフォームが絡んで重くなりやすい。いまの前提で薄い道具が届きやすいのは、買う・予約する一段手前の「選ぶ・比べる・下調べ」、あとで見返せる記録、二度入力を消す一点だ。熱いからすぐ薄く作れる、ではない。\n\n## これまで\n熱い需要を見つけると、その熱い場所そのものにプロダクトを置きがちだった。アプリの上位や体験消費の伸びを、そのまま「作りやすい」と読み替えやすかった。\n\n## いま\n日本では予約・決済・LINEまわりが太い。壁が厚い。リユースでも、安いだけでなく品質保証がないと止まる。宿泊・外食は家計では伸びているが、現場は予約や席・決済の話になりやすい。\n\n一方で、AIまわりでは「席を売る」より「何が良くなったか」が見えることのほうが、あとで残りやすい、という話が出ている。devtoolsでも、セッションの結果をルールや記録として残す方向の動きがある。\n\n建設の施工管理でも、必要だという声は強いのに、専用アプリより Excel が残り、入れたあとも二重入力で定着しない、という数字が出ている（現場TECH調査、2026年3月）。機能を足すほど使いこなせない、という不満もある。\n\n重ねて読むと、熱いからすぐ薄く作れる、ではない。薄い道具向きなのは、買う前の比較や下調べ、あとで見返せる記録、そして「同じことを二度やらない」一点だと見る。\n\n## なぜ今か\n疑ってから買う空気が強い。成果が見えないと更新されない。だから「熱い市場に乗り込む」より、「判断や振り返りを軽くする」ほうが、小さく試しやすいはずだ、という推定。\n\n## まだ分からないこと\n空いている穴はどこか。「選ぶ・比べる」の具体的な困りごとで、まだ埋まっていない穴はどこか。devtoolsの「あとで見返せる記録」が、本当に払われるのか。建設で「二重入力を減らす一点」が本当に買われるのか。日本の生活アプリ上位のどれが不満で、どれが満足か。\n\n## 根拠\n- 日本のリユース品質不安（メルカリ調査）と、家計の宿泊・外食の伸び（家計調査）\n- 日本のスマホ無料ランキング観測（2026年9月前半）\n- Bessemer系のAI課金の議論（席より成果・更新で効き目が問われる）\n- 建設の施工管理定着ギャップ（現場TECH調査、2026年3月）→ `jp-construction-apps-dont-stick.md`\n"}], "generated": "2026-09-21T00:23:32.801711+00:00"}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('snapshot-data').textContent);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function link(label,url){return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;}
// HTMLは実行せず、HTTP(S)のリンクだけを有効にする。
function inline(text){
 const tokens=/`([^`]+)`|\[([^\]]+)\]\((https?:\/\/[^\s]+)\)|https?:\/\/[^\s<>]+|\*\*([^*]+)\*\*/g;
 let out='',last=0;
 for(const m of text.matchAll(tokens)){
  out+=esc(text.slice(last,m.index));
  if(m[1])out+=`<code>${esc(m[1])}</code>`;
  else if(m[2])out+=link(m[2],m[3]);
  else if(m[4])out+=`<strong>${esc(m[4])}</strong>`;
  else {const url=m[0].replace(/[。、，．）〉」』\]>]+$/g,'');out+=link(url,url)+esc(m[0].slice(url.length));}
  last=m.index+m[0].length;
 }
 return out+esc(text.slice(last));
}
function markdown(text){
 const lines=text.replace(/\r\n?/g,'\n').split('\n');let out='',paragraph=[],list='',code=null;
 const flush=()=>{if(paragraph.length){out+=`<p>${inline(paragraph.join('\n'))}</p>`;paragraph=[];}if(list){out+=`</${list}>`;list='';}};
 for(const line of lines){
  if(/^```/.test(line)){flush();if(code!==null){out+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;code=null;}else code=[];continue;}
  if(code!==null){code.push(line);continue;}
  const heading=line.match(/^(#{1,6})\s+(.+)$/),item=line.match(/^\s*(?:([-+*])|\d+\.)\s+(.+)$/);
  if(heading){flush();const level=heading[1].length;out+=`<h${level}>${inline(heading[2])}</h${level}>`;}
  else if(item){const type=item[1]?'ul':'ol';if(list!==type){flush();out+=`<${type}>`;list=type;}out+=`<li>${inline(item[2])}</li>`;}
  else if(!line.trim()){flush();}
  else if(/^>\s?/.test(line)){flush();out+=`<blockquote>${inline(line.replace(/^>\s?/,''))}</blockquote>`;}
  else{if(list)flush();paragraph.push(line);}
 }
 flush();if(code!==null)out+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;return out;
}
function render(){
 let id='';try{if(location.hash.startsWith('#markets/'))id=decodeURIComponent(location.hash.slice(9));}catch{id='?';}
 const main=document.getElementById('main');const memo=data.markets.find(m=>m.id===id);
 if(id){
  main.innerHTML='<a class="back" href="#markets">← 需要の全体像へ</a>'+(memo?`<article>${/^#\s/m.test(memo.text)?'':`<h1>${esc(memo.title)}</h1>`}${markdown(memo.text)}</article>`:'<h1>市場メモが見つかりません</h1><p>一覧から読みたいメモを選んでください。</p>');
 }else{
  main.innerHTML=`<article>${markdown(data.overview.text)}</article><section class="memo-list" aria-labelledby="memo-list-title"><h2 id="memo-list-title">個別の市場メモ <span class="meta">${data.markets.length}件</span></h2><div class="grid">${data.markets.map(m=>`<a class="card" href="#markets/${encodeURIComponent(m.id)}"><h3>${esc(m.title)}</h3><p>${esc(m.summary)}</p><span>全文を読む →</span></a>`).join('')||'<p class="empty">市場メモはまだありません。</p>'}</div></section>`;
 }
 document.title=`${memo?memo.title:id?'市場メモが見つかりません':data.overview.title} | GTM工場`;
}
document.getElementById('snapshot').textContent=`市場メモのスナップショット · 生成：${new Date(data.generated).toLocaleString('ja-JP',{timeZone:'UTC'})} UTC`;
window.addEventListener('hashchange',()=>{render();document.getElementById('main').focus();window.scrollTo(0,0);});render();
</script>
