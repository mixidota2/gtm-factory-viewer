<script id="snapshot-data" type="application/json">{"overview": {"id": "overview-rising-demand.md", "title": "お金・使う量・導入した数を分けて、需要の変化を見る", "summary": "", "text": "# お金・使う量・導入した数を分けて、需要の変化を見る\n\n同じ「増えた」でも、支出、利用する人の割合、使う時間、導入した数では意味が違います。無料利用や制度対応による導入も記録し、有料で購入した実績と区別します。日本が中心の収集範囲で、未調査の地域に需要がないと判断したものではありません。\n\n## 今回の事例から見えること\n\n- 日本の13〜79歳の調査では、TikTok・Instagramの利用割合と、ネット動画全体の平均利用時間が増えています。\n- 二人以上世帯のコーヒー購入は、支出が増えた一方、購入量はほぼ横ばいです。支出増をそのまま量の増加とは読めません。\n- ケアプラン連携は有効ライセンスに基づく導入率が上がっています。ただし、全国のデータ送受信量や、有料で使い続ける割合は未確認です。\n\n海外事例も含めて、[お金と量](#question/money-and-quantity)、[実際に使った回数・時間と使える状態](#question/use-and-adoption)、[本人が答えた困りごとや役立った点](#question/felt-value)を分けて読めます。\n\n## 5つのテーマで、何が変わったか\n\n### TikTok・Instagramの利用割合と、ネット動画の視聴時間が増加\n\n日本の13〜79歳を対象にした調査では、TikTokを利用する人の割合は2020年度の14.9%から2025年度の36.7%へ、Instagramは36.1%から54.8%へ増えました。ネット動画全体の1日平均利用時間は、2024年度から2025年度にかけて、平日が68.97分から76.12分、休日が97.94分から104.58分へ増えています。時間は利用しない人も含む平均で、短い動画だけ、あるいは特定のサービスだけを測った値ではありません。\n\n楽しめることや、都合のよい時間・場所で見られることが、利用の理由かもしれません。この観測では、その理由や支払額は測っていません。\n\n注意点：テーマ5のテレビ局の番組配信と同じ総務省調査を使っています。対象が重なるため、独立した二つの市場の成長として足し合わせません。\n\n次に確かめたいこと：定義をそろえて、利用割合、利用時間、支払額を追います。対象の異なる指標は、一つの増加率にまとめず、別々に表示します。\n\n出典：\n- https://www.soumu.go.jp/main_content/001079136.pdf\n- https://www.soumu.go.jp/main_content/001079079.xlsx\n- https://www.soumu.go.jp/main_content/001017277.xlsx\n\n### ケアプラン連携の有効ライセンスに基づく導入率が上昇\n\n介護の予定・実績などを事業所間でやり取りするケアプランデータ連携システムでは、有効ライセンスから算出した導入率が、2025年5月末の5.3%から2026年7月末の53.1%へ上がりました。約14か月の変化です。この率は使える状態の事業所を示しており、全国で実際に送受信したデータ量ではありません。\n\n二重入力の削減については、9事業所で導入前後の作業時間を比べた結果があります。ただし、全国での効果や、有料で使い続けるかは未確認です。\n\n注意点：無料化と制度対応が重なっています。将来の利用に備えてライセンスだけを取得した可能性もあり、取得増の理由は切り分けられません。\n\n次に確かめたいこと：毎月データを送受信する事業所数、実際に連携できる取引先の割合、紙・FAXを併用する負担、有料での継続状況を調べます。導入後に利用が広がらず、併用の負担も減らなければ、利用者に役立つという評価を見直します。\n\n出典：\n- https://www.mhlw.go.jp/content/12300000/001743315.pdf#page=20\n- https://www.mhlw.go.jp/content/12300000/001743315.pdf#page=71\n- https://www.mhlw.go.jp/content/12306000/001742527.pdf#page=5\n\n### ネット経由の掛け捨て保険支出が増加。窓口からの移行は未確認\n\n二人以上世帯がネット経由で支払った掛け捨て保険料は、2019年の月581円から2025年の月1,262円へ増えました。別の家計調査で調べた掛け捨て保険支出全体は、同じ年の月12,854円から13,457円でした。各金額の平均の取り方（対象世帯や、非購入世帯を含むかなど）は、既存の確認記録から特定できていません。\n\nネット経由の支出増は、窓口などからネットへ契約・手続きが移った可能性と矛盾しません。ただし、同じ世帯の行動を追った数字ではありません。手続きの手間が減ったかも測っていません。\n\n注意点：異なる調査の金額を割った値は、厳密な販売経路別の割合にはなりません。世帯数、契約数、保険の種類、価格改定の影響は未確認です。\n\n次に確かめたいこと：同じ対象世帯について、契約数と支出を全体・販売経路別に調べます。ネット経由の支出増を単価の上昇だけで説明できるなら、契約が移ったという推測は弱まります。\n\n出典：\n- https://www.stat.go.jp/data/joukyou/zuhyou/netz29-m.xlsx\n- https://www.stat.go.jp/data/joukyou/yougo-s.html\n- https://www.e-stat.go.jp/stat-search/files?page=1\u0026layout=datalist\u0026toukei=00200561\u0026tstat=000000330001\u0026cycle=0\u0026tclass1=000001228280\u0026tclass2val=0\n\n### 機械警備の対象となる住宅のか所数が増加\n\nセンサーなどで異常を監視する機械警備の対象住宅は、2019年末の1,611,522か所から2025年末の1,950,261か所へ、約21.0%増えました。2024年末の1,847,062か所と比べると約5.6%増です。数えているのは年末に警備対象となっている場所で、世帯数や新規契約数ではありません。\n\n警備サービスの対象となる住宅が広がっています。ただし、損害をどれだけ防いだか、利用者がどれほど安心したかは、この数値から分かりません。\n\n注意点：警備業売上の2021年から2024年の増加率は、価格変動を調整しない金額では+7.64%、価格を調整した参考値で+5.94%です。ただし、この間に調査対象の取り方が変わっているため、同じ条件で利用量が増えた証拠には使えません。2025年の調査では、比較用の2023年売上も改定されています。また、保安職の求人には公務の職種も含まれます。\n\n次に確かめたいこと：改定後の売上を同じ調査条件で比べ、料金、契約、解約、損害や安心に関する結果を確認します。警備対象のか所数が増えただけでは、世帯の支払額も増えたとは判断しません。\n\n出典：\n- https://www.npa.go.jp/publications/statistics/safetylife/reiwa7keibigaikyo.pdf#page=8\n- https://www.stat.go.jp/data/kkj/kekka/pdf/2025gaiyo2.pdf#page=3\n- https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040074060\u0026fileKind=0\n- https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040472220\u0026fileKind=0\n\n### テレビ局のネット番組配信は利用割合と広告費が増加\n\n好きなときに番組を選んで見られる、テレビ局のオンデマンド型配信の利用率は、13〜79歳で2020年度の19.8%から2025年度の43.1%へ増えました。見逃し配信だけを尋ねた設問ではありません。TVerの2025年12月の月間利用ブラウザ数は4,460万でした。また、番組配信の広告費は2023年の443億円から2025年の805億円へ増えています。\n\n利用者の割合、利用ブラウザ数、広告費は、それぞれ別の指標です。都合のよい時間に見られる点が役立っている可能性はありますが、視聴時間や有料契約も同じだけ増えたとは言えません。\n\n注意点：ブラウザ数は、重複を除いた人数ではありません。地上波の広告費がほぼ横ばいでも、配信広告の予算がどこから移ったかは分かりません。テーマ1と同じ調査を使う部分があるため、独立した市場として合算しません。\n\n次に確かめたいこと：視聴時間、広告単価、広告量、広告主ごとの予算の移動を確認します。同じ人が放送から配信へ移ったのか、新たに視聴が増えたのかも分けて調べます。\n\n出典：\n- https://www.soumu.go.jp/main_content/001079136.pdf\n- https://tver.co.jp/news/20260109.html\n- https://www.dentsu.co.jp/news/release/2026/0305-011003.html\n\n## コーヒーは購入支出が増え、購入量はほぼ横ばい\n\n日本の二人以上世帯が家庭用に購入したコーヒーは、2024年9月〜2025年8月と2025年9月〜2026年8月の各12か月で、1世帯当たりの支出が8,696円から11,088円へ（+27.5%）、購入量が2,494gから2,501gへ（+0.28%）増えました。平均購入単価は約27.15%上がりましたが、銘柄・品質構成も含むため純粋な値上げとは断定しません。以前の数値監査で、保存した入力データによる再計算が一致したことを確認しています。実際に飲んだ量や購入の動機は分かりません。単身世帯、外食、市場全体の数字でもありません。\n\n原典：https://www.e-stat.go.jp/dbview?sid=0004023602 （表011、品目382、全国二人以上世帯、数量1g）。支出の原表は家計調査の品目月次表。\n\n## レンタカー・カーシェアへの支出増だけでは、利用量の増加は分からない\n\n二人以上世帯のレンタカー・カーシェア料金は、1世帯当たりの月平均で、2024年9月〜2025年8月の372.33円から2025年9月〜2026年8月の393.75円へ、5.75%増えました。レンタカーの消費者物価指数（CPI）を使って2025年の価格水準にそろえると、同じ二つの期間の参考値は372.61円から392.98円となり、増加率は5.47%です。ただし、カーシェア固有の利用量を示す値ではありません。8月だけを見ると、1世帯当たりの料金は2024年が544円、2025年が427円、2026年が572円でした。2026年の増加には、低かった前年からの反発も含まれます。\n\n単身世帯の1世帯当たり年額は、2019年の2,401円から2025年の2,186円へ減りました。価格変動は調整していません。タイムズカーでは、専用車両1台・1か月当たりの利用回数が、前年同期の32.6回から2025年11月〜2026年7月の30.6回へ減りました。個人・法人の利用を含みます。一台当たり回数の減少から総利用の減少は決められず、家計とは対象・期間も違います。会員数の増加は実利用と分けます。\n\n出典：https://www.stat.go.jp/data/kakei/sokuhou/tsuki/index.html 、https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040409843\u0026fileKind=0 、https://ssl4.eir-parts.net/doc/4666/ir_material_for_fiscal_ym9/211834/00.pdf （10–11頁）、https://www.stat.go.jp/data/kouri/doukou/2025np/pdf/hinmoku2025.pdf （17頁）。\n\n## 制度に関わる業務システムでも、導入・登録の増加は確認できる\n\n電子処方箋の2025年9月→2026年8月の施設導入率、ケアプランの2025年5月末→2026年7月末の有効ライセンス、電子マニフェストの2024→2025年度の登録件数には増加があります。東京都内の特別養護老人ホームでは、議事録・文書作成ソフトの導入率を前年と比べた結果もあります。そのため、産業廃棄物の電子記録以外はすべて増加が分からない、という以前の説明は訂正します。施設率、ライセンス、件数、支払額を共通のランキングにしないことが重要です。\n\n保育・学童・歯科の記事は、ある時点の機能の導入状況を示します。建設は必要性の回答と実際の作業手段、法律事務所は、調査に回答した日弁連会員のAI利用と体制整備（既存要約に基づき、原典は再確認待ち）、飲食は求人倍率と導入者の自己申告、物流は制度と待ち時間を取り上げています。支払額を確認できていなくても観測自体を消しません。\n\n## 調査範囲と未確認\n\n調査の入口として、家計398品目の支出、サービス34業種、求人57職業の資料があります。ただし、全項目について数量と価格を分け、分類変更の前後で比較できるか確かめる作業は終わっていません。価格変動を調整していない金額の増加率が高くても、購入量の増加率が高いとは判断しません。資料を見つけた状態、本文を読んだ状態、根拠となる箇所を確認した状態、全ページを読了した状態は区別します。\n\n北米・欧州・中国・インド・東南アジア・中南米・中東・アフリカ等の代表的比較は未調査。海外AIの注目・課金解説だけで世界の需要を代表させません。まだ読んでいない資料は未読と記し、空欄や需要ゼロには置き換えません。\n", "proxy_map": false}, "markets": [{"id": "agent-ops-harness-demand.md", "title": "AIエージェントの運用ツールに開発者が注目。有料利用の増加は未確認", "summary": "2026年9月28日に観測した記録の週次表示では、スターの増加数はpaperclipが約5,400、hindsightが約7,300、security-audit-skillが約6,500、orcaが約6,500、ECCが約5,500でした。増加を数えた週の開始日・終了日は、既存の確認記録から特定できていません。スターは、GitHubの利用者が関心のある公開ソフトにつける印です。", "text": "# AIエージェントの運用ツールに開発者が注目。有料利用の増加は未確認\n\n分類：開発者の注目\n\n## 対象と期間\n\n対象は、AIに作業を実行させる「AIエージェント」の運用ツールです。GitHubで注目を集めた公開ソフトを掲載するTrendingを、2026年9月28日に観測した記録を使っています。国や業界を代表する調査ではありません。\n\n## 調査で分かったこと\n\n2026年9月28日に観測した記録の週次表示では、スターの増加数はpaperclipが約5,400、hindsightが約7,300、security-audit-skillが約6,500、orcaが約6,500、ECCが約5,500でした。増加を数えた週の開始日・終了日は、既存の確認記録から特定できていません。スターは、GitHubの利用者が関心のある公開ソフトにつける印です。\n\n## この結果から言えること\n\n作業履歴を記憶する機能、手順を再利用する機能、複数のAIエージェントを管理する機能などに、開発者が関心を寄せた記録です。AIモデル関連のソフトと同じ条件で比べていないため、モデル関連より速く注目が増えたかは分かりません。\n\n## 役立つ可能性と、まだ未確認のこと\n\nこれらのツールが運用の手間や失敗を減らす可能性はあります。ただし、スター数から利用者の困りごとや改善効果は分かりません。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：エージェントを使う開発者・運用担当者（想定）\n\n費用を払う人：未確認\n\n現在の手段：手作業、既存の開発・運用環境\n\n## 分からないこと・別に考えられる理由\n\n過去のTrending表示は、今回の編集では再取得していません。週次の紹介記事も利用実績を独自に調べた資料ではありません。継続利用、実際の業務で使った件数、料金の支払いは未確認です。\n\n## 次に確かめたいこと\n\n同じ期間について、使い続けた人や組織の数と、有料契約数を確認します。注目が集まった後も利用が続いていれば、有料利用につながる可能性を改めて検討できます。利用が続いていなければ、スター増を継続的な需要の手がかりとする判断は弱まります。\n\n## 出典\n\nGitHub Trending（daily / weekly、2026-09-28観測）https://github.com/trending\n\n週次整理（二次）Tommy Z「GitHub Trending Weekly Digest — September 7–12, 2026」https://www.tommyz.blog/blog/github-trending-weekly-2026-09-07-to-2026-09-12\n\n## 確認状況\n\n保存した本文・分析と、以前の確認記録に基づく記事です。国内原稿の数値監査では、原典の該当ページを新たに読んだ記録はありません。元資料の該当箇所の再確認と、全ページの読了は未完了です。\n", "proxy_map": true}, {"id": "ai-pricing-renewal.md", "title": "AIサービスの課金方式と契約更新：実績を確認できていない", "summary": "海外のAIサービスの料金設定を解説した資料が対象です。記録には対象企業、対象期間、調べた契約の総数がなく、まだ特定できていません。\n\n以前のメモにはBessemerの課金解説の題名があります。ただし、原典を特定できるURLや、課金方式別の売上、契約更新率、解約率は記録されていません。\n\n現時点では、AIサービスへの需要が増えた証拠に含めません。新しい料金体系を提供する企業が見つかっても、購入者が支払い方を変えたことや、継続率が変わったことは別に確かめる必要があります。", "text": "# AIサービスの課金方式と契約更新：実績を確認できていない\n\n分類：仮説・再調査\n\n## 現在の記録と不足情報\n\n海外のAIサービスの料金設定を解説した資料が対象です。記録には対象企業、対象期間、調べた契約の総数がなく、まだ特定できていません。\n\n以前のメモにはBessemerの課金解説の題名があります。ただし、原典を特定できるURLや、課金方式別の売上、契約更新率、解約率は記録されていません。\n\n現時点では、AIサービスへの需要が増えた証拠に含めません。新しい料金体系を提供する企業が見つかっても、購入者が支払い方を変えたことや、継続率が変わったことは別に確かめる必要があります。\n\n## 考えている仮説と利用者\n\n利用人数、利用量、成果を組み合わせた料金設定を、今後調べる対象として残します。「効果を示せないと契約を更新してもらえない」「利用人数に応じた課金から別の方式へ需要が移った」という結論を裏づける実績は、まだ確認できていません。\n\n購入する企業は、支払額に見合う効果を説明しやすい料金体系を求めるかもしれません。これは仮説であり、購入者の回答を確認した結果ではありません。\n\n利用する人：AIサービスの利用企業（想定）\n\n費用を払う人：契約主体は未確認\n\n現在の手段：利用人数に応じた課金、定額料金、利用量に応じた課金、成果に応じた課金、自社での開発\n\n## 次に確認すること\n\nまず元の解説を特定します。そのうえで、同じ顧客群の契約更新、解約、支払額を追える資料があれば、課金方式の変化と継続利用の関係を再検討します。\n\n## 出典\n\nBessemer Venture Partners「The AI pricing playbook for founders」（2026）\n\n同系統の解説・二次整理（席の比率低下、ハイブリッド増、などの要約）\n\n## 確認状況\n\n保存した本文・分析と、以前の確認記録に基づく記事です。国内原稿の数値監査では、原典の該当ページを新たに読んだ記録はありません。元資料の該当箇所の再確認と、全ページの読了は未完了です。\n", "proxy_map": true}, {"id": "jp-care-layers-not-one.md", "title": "東京都内の特別養護老人ホーム調査では、記録ソフトの導入と日常利用が高い", "summary": "2025年7月の東京都高齢者福祉施設協議会の会員特養調査は、対象511施設のうち343施設から有効回答を得ています。記録ソフトの設問に答えた283施設のうち、導入済みは269施設（95.05%）、日常的に使っているのは262施設（92.58%）でした。\n\n音声入力の設問に答えた282施設では、導入済みが68施設（24.11%）、日常的に使っているのが29施設（10.28%）です。導入済み施設だけを分母にすると、日常利用の割合は記録ソフトが97.40%、音声入力が42.65%になります。\n\n議事録作成ソフトの公表導入率は、令和6年度の2.51%から令和7年度の18.09%へ、文書作成ソフトは6.90%から17.73%へ上がっています。ただし、同じ施設を追跡した結果ではありません。\n\n別の令和6年度介護労働実態調査では、パソコンで利用者情報を入力・保存・転記する機能を日常的に使っている割合は、回答した訪問系事業所で76.4%、施設系入所型で82.8%、施設系通所型で72.2%、居住系で65.6%でした。", "text": "# 東京都内の特別養護老人ホーム調査では、記録ソフトの導入と日常利用が高い\n\n分類：地域調査の導入・活用\n\n## 対象と期間\n\n東京都内の調査は、特別養護老人ホーム（特養）を対象に、2025年7月1〜31日に実施されました。会員511施設のうち343施設が回答し、記録ソフトの設問には283施設、音声入力の設問には282施設が回答しました。\n\n別の全国調査は、2024年10月1〜31日に実施され、基準日は10月1日です。業務で使う情報機器・ソフト（ICT）の表には8,978事業所が回答しています。このうち訪問系は2,734、入所型は1,172、通所型は2,643、居住系は1,054事業所です。全国調査の割合は、導入済み事業所だけを対象にしたものではありません。\n\n## 調査で分かったこと\n\n2025年7月の東京都高齢者福祉施設協議会の会員特養調査は、対象511施設のうち343施設から有効回答を得ています。記録ソフトの設問に答えた283施設のうち、導入済みは269施設（95.05%）、日常的に使っているのは262施設（92.58%）でした。\n\n音声入力の設問に答えた282施設では、導入済みが68施設（24.11%）、日常的に使っているのが29施設（10.28%）です。導入済み施設だけを分母にすると、日常利用の割合は記録ソフトが97.40%、音声入力が42.65%になります。\n\n議事録作成ソフトの公表導入率は、令和6年度の2.51%から令和7年度の18.09%へ、文書作成ソフトは6.90%から17.73%へ上がっています。ただし、同じ施設を追跡した結果ではありません。\n\n別の令和6年度介護労働実態調査では、パソコンで利用者情報を入力・保存・転記する機能を日常的に使っている割合は、回答した訪問系事業所で76.4%、施設系入所型で82.8%、施設系通所型で72.2%、居住系で65.6%でした。\n\n## 設問と回答の方法\n\n東京都の調査は、各機器の導入・利用状況について5つの選択肢から答える方式です。全国調査の問15①②は、機器や機能ごとに日常利用の割合を集計しています。同じ事業所が複数の機能を使えるため、機能別の割合を足して100%にする表ではありません。全国調査の元の質問票は、今回の編集では読んでいません。\n\n## この結果から言えること\n\n回答した施設では、記録ソフトと、音声入力などの機能とで、導入・日常利用の状況が異なります。この結果だけで、全国の介護ソフト市場に新たな需要がないとは判断できません。訪問系と入所型が同じ状況だとも言えません。\n\n## 役立つ可能性と、まだ未確認のこと\n\n記録や文書作成にかかる職員の時間を減らせる可能性があります。ただし、導入率だけでは、実際にどれだけ負担が減ったかは分かりません。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：介護職員・事務職員\n\n費用を払う人：施設・運営法人が想定されるが実際の支払額は未確認\n\n現在の手段：紙の記録、既存介護ソフトの追加機能、運用改善\n\n## 分からないこと・別に考えられる理由\n\n全国のソフト利用調査と、重点分野の機器調査は、調べた機器や利用の定義が違います。日常利用が低い機器についても、その原因や、更新・乗り換えに料金を払う意思は確認できていません。\n\n東京都の議事録・文書作成について、公表された件数と率から確認した分母は、前年が319施設、その年が282施設です。公表済みの集計値が整合するかを確かめたもので、個々の回答を集め直して再集計したわけではありません。両年度に同じ施設が回答したかも、確認できていません。\n\n東京都のPDF3頁では、説明文の②が「導入を検討しているが」となっています。一方、実際の全設問表では、②が「導入しているが、日常的な活用はない」となっています。原典の中で表現が食い違いますが、公表された導入率は表の①+②に一致します。この違いを明記したうえで、導入率は実際の設問表の区分に沿って読みます。\n\n全国調査では、事業所全体から回収した9,044件と、ICTの表の対象である8,978件を区別します。全国値と記した結果も、回答した事業所についての値であり、全国すべての事業所を調べた割合ではありません。\n\n厚生労働省の別調査で集計から除外されるのは、二段階目に追加で抽出した加算届出施設・事業所です。図表6の99.0%は、介護業務支援機器を導入した3,803施設・事業所のうち、現在利用している3,766施設・事業所の割合です。すべての種類の機器についての値や、日常的に使う頻度を示す割合ではありません。\n\n## 次に確かめたいこと\n\n同じ施設を追跡し、利用頻度、作業時間、契約更新、別製品への乗り換えを確認します。導入率が高くても買い替えが多ければ、「新たな需要は少ない」という見方は弱まります。\n\n## 出典\n\n- （一次）東京都社会福祉協議会・東京都高齢者福祉施設協議会「令和7年度 デジタル機器（介護ロボット・ICT機器）等の導入及び活用に関する実態調査 報告書」https://www.tcsw.tvac.or.jp/bukai/kourei/chosa/documents/R7digital.pdf\n- （一次）厚生労働省「介護現場における生産性の向上等を通じた働きやすい職場環境づくりに資する調査研究事業（結果概要）」（令和7年9〜11月。図表1は二段階目に追加抽出した加算届出施設・事業所を除外した集計で、重点分野等のいずれか。特養90.5%、グループホーム59.8%。図表2は介護業務支援機器。訪問系29.2%、通所系36.7%、居住・入所・泊まり56.4%。図表6は介護業務支援機器の導入者3,803施設・事業所中、現在利用3,766（99.0%）。全機器一括や日常利用頻度の割合ではない）https://www.mhlw.go.jp/content/12300000/001696334.pdf\n- （一次）介護労働安定センター「令和6年度介護労働実態調査」結果の概要（調査期間は令和6年10月1日〜31日。図表7-1-1。ICT回答8,978。令和7年7月28日に情報提供した公表資料）https://www.kaigo-center.or.jp/content/files/report/R6_jittai_chousa_press.pdf\n- （一次寄り・委託）三菱総合研究所「訪問系や通所系サービスにおける介護ロボット・ICT等のテクノロジー活用…実態調査研究事業」報告書 https://pubpjt.mri.co.jp/pjt_related/roujinhoken/f6rq9400000012ed-att/R6_099_2_report.pdf\n- （二次・報道整理）CBnews「特養の9割で介護テクノロジー導入」（厚労省調査の紹介）https://www.cbnews.jp/news/entry/20260218174816\n\n以前の数値監査で確認した箇所：\n- 調査の設計／集計備考／11 ICTツール ア・ウ・オ・カ。PDFの2・3・12・13・14頁を確認しました。このうち3・12・13・14頁は、画像でも照合しています。https://www.tcsw.tvac.or.jp/bukai/kourei/chosa/documents/R7digital.pdf#page=2\n- 印刷32頁 図表7-1-1、印刷42頁 調査概要。PDF 34,44頁。画像でも照合 34頁。https://www.kaigo-center.or.jp/content/files/report/R6_jittai_chousa_press.pdf#page=34\n\n厚労省の追加抽出の扱いはPDF2頁、図表1・2はPDF3–4頁、現在利用の図表6はPDF9頁を確認し、画像でも照合しています。参照箇所：https://www.mhlw.go.jp/content/12300000/001696334.pdf#page=9\n\n## 確認状況\n\n2026-10-16の数値監査では、対象となる公表集計表と脚注を読み、指定した図表を画像でも照合しています。個々の回答を集め直した再集計は行っていません。また、原典の全ページを読了したわけではありません。\n\n全国介護調査の問15について、元の質問票、個々の回答、回答しなかった事業所の偏りを補正する処理は未確認です。同じ施設の年度別の変化、三菱総合研究所（MRI）への委託報告書、費用や役立った点の実証も確認できていません。\n", "proxy_map": false}, {"id": "jp-careplan-link-surge.md", "title": "ケアプラン連携の導入率は約14か月で5.3%から53.1%へ。有効ライセンスを数えた値", "summary": "全国の対象事業所数を分母に、有効ライセンス数を使って算出した導入率は、5.3%から53.1%へ上がりました。\n\n居宅介護支援9事業所では、実績確認と入力などにかかった月平均時間を導入前後で比べています。導入前は確認5.06時間と入力10.56時間の合計15.62時間でした。導入後は確認3.41時間、入力2.67時間、新たな連携作業3.03時間の合計9.11時間となり、6.51時間減りました。この実証では、事業所ごとの「システム利用率」の平均が約4割と報告されています。ただし、何を分母とした割合かは、既存の確認記録から特定できていません。", "text": "# ケアプラン連携の導入率は約14か月で5.3%から53.1%へ。有効ライセンスを数えた値\n\n分類：無料化・制度対応を伴う導入増\n\n## 対象と期間\n\n介護の計画やサービス提供の予定・実績を事業所間でやり取りする、ケアプランデータ連携システムが対象です。全国の有効ライセンスを、2025年5月末と2026年7月末で比べています。作業時間は、居宅介護支援9事業所で導入前後を比べた速報値です。導入しなかった事業所との比較はありません。\n\n## 調査で分かったこと\n\n全国の対象事業所数を分母に、有効ライセンス数を使って算出した導入率は、5.3%から53.1%へ上がりました。\n\n居宅介護支援9事業所では、実績確認と入力などにかかった月平均時間を導入前後で比べています。導入前は確認5.06時間と入力10.56時間の合計15.62時間でした。導入後は確認3.41時間、入力2.67時間、新たな連携作業3.03時間の合計9.11時間となり、6.51時間減りました。この実証では、事業所ごとの「システム利用率」の平均が約4割と報告されています。ただし、何を分母とした割合かは、既存の確認記録から特定できていません。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：ケアマネジャー、サービス事業所の職員\n\n費用を払う人：ライセンスを契約するのは事業所です。無料期間中の取得と、実際の料金支払いは分けて考えます。有料で使い続ける際の支払額は未確認です。\n\n現在の手段：紙、FAX、郵送、既存ソフト同士での表形式ファイル（CSV）の受け渡し\n\n## この結果から言えること\n\n有効なライセンスを持つ事業所が増えたことは確認できます。全国で実際のデータ送受信が増えたか、料金を払って使い続ける事業所が増えたか、同じ時間短縮が全国に広がったかは、まだ確認できません。\n\n## 役立つ可能性と、まだ未確認のこと\n\n二重入力や紙・FAXでのやり取りに関わる作業時間は、9事業所で導入前後を比べています。導入しなかった事業所と比べた結果ではありません。ただし、利用者がどれほど役立つと感じるか、料金を払う意思があるかを全国で測った結果はありません。\n\n## 分からないこと・別に考えられる理由\n\n無料化、補助金、介護報酬の条件が重なるため、それぞれが導入増に与えた影響は切り分けられません。9事業所の前後比較には、導入しなかった事業所との比較がなく、全国を代表する結果でもありません。以前の試算である月52.4時間から18.1時間、月13.4万円から6.7万円という数値は、今回の実証結果と区別して変更前の記録に残しています。\n\n## 次に確かめたいこと\n\n毎月データを送受信する事業所の数、取引先のうち実際に連携できる割合、紙・FAXも併用する作業の時間、有料での継続状況を確認します。ライセンスだけが増えて利用が増えていなければ、実際の利用需要が広がったという判断は弱まります。\n\n## 出典\n\n（一次）厚生労働省「介護現場の生産性向上等の推進」（第263回社会保障審議会介護給付費分科会 資料、2026年8月28日。導入率推移・サービス種別・実証の月約6.5時間削減・利用率約4割）https://www.mhlw.go.jp/content/12300000/001743315.pdf\n\n（一次）厚生労働省「ケアプランデータ連携システムの統合と介護情報基盤（介護保険資格確認等WEBサービス）について」（導入率・処遇改善特例要件・2027年1月統合の説明）https://www.mhlw.go.jp/content/12306000/001742527.pdf\n\n（一次・試算の出典明示）上記分科会資料が引用する令和2年度老人保健健康増進等事業「介護分野の生産性向上に向けたICTの更なる活用に関する調査研究」（作業時間52.4→18.1時間／月、経費13.4→6.7万円／月）\n\n（一次・利用状況の入口）WAM NET「ケアプランデータ連携システム利用状況」（2026年9月6日現在の地図掲載。国保中央会提供）https://www.wam.go.jp/wamappl/kpdrsys.nsf/top\n\n（関連メモ）jp-care-layers-not-one.md\n\n（関連メモ）jp-e-prescription-clinic-lag.md\n\n照合済み該当頁：有効ライセンス https://www.mhlw.go.jp/content/12300000/001743315.pdf#page=20 、9事業所実証 https://www.mhlw.go.jp/content/12300000/001743315.pdf#page=71 （PDF70–71頁）。\n\n## 確認状況\n\n以前の原典監査では、ライセンスについてPDF20頁（印刷頁19頁）、9事業所の作業時間についてPDF70–71頁を確認しています。この日本語改稿では、資料の再取得や全ページの再読はしていません。全国の実際の送受信量、有料での継続、仮説として挙げた効果は未確認です。\n", "proxy_map": false}, {"id": "jp-construction-apps-dont-stick.md", "title": "建設業426人調査では、92.5%が施工管理のデジタル化を必要と回答", "summary": "施工管理のデジタル化を必要と答えた人は92.5%でした。主な作業手段を尋ねると、Excelなどが68.5%、紙が12.7%、クラウド型アプリが8.5%でした。\n\n施工管理アプリを導入済みという回答は31.9%です。アプリを導入した企業についても、「業務の中心はExcel」という回答が62.5%ありました。ただし、62.5%の分母は、既存の確認記録から特定できていません。デジタル化が進まない理由には、現場に定着しないこと（36.9%）、操作の習得負担（35.9%）、二重管理（32.2%）が挙がっています。公共工事の情報共有システムの機能要件も、二重入力の削減を目標にしています。", "text": "# 建設業426人調査では、92.5%が施工管理のデジタル化を必要と回答\n\n分類：必要性の意向・一時点の導入状況\n\n## 対象と期間\n\n現場TECHが2026年3月に建設業従事者426人へ行ったインターネット調査を使っています。公共工事の制度については、別の公的資料を参照しています。\n\n## 調査で分かったこと\n\n施工管理のデジタル化を必要と答えた人は92.5%でした。主な作業手段を尋ねると、Excelなどが68.5%、紙が12.7%、クラウド型アプリが8.5%でした。\n\n施工管理アプリを導入済みという回答は31.9%です。アプリを導入した企業についても、「業務の中心はExcel」という回答が62.5%ありました。ただし、62.5%の分母は、既存の確認記録から特定できていません。デジタル化が進まない理由には、現場に定着しないこと（36.9%）、操作の習得負担（35.9%）、二重管理（32.2%）が挙がっています。公共工事の情報共有システムの機能要件も、二重入力の削減を目標にしています。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：現場監督・施工管理担当者\n\n費用を払う人：施工会社・発注者が候補だが調達主体と支払実績は未確認\n\n現在の手段：Excel、紙、既存施工管理アプリ、公共工事の情報共有システム\n\n## この結果から言えること\n\n回答者はデジタル化の必要性を感じていますが、主な作業にはExcelなどを使っています。同じ調査を紹介した別の記事や報道は、独立した調査結果には数えません。また、必要と答えた92.5%が、有料で購入したいと答えたわけではありません。\n\n## 役立つ可能性と、まだ未確認のこと\n\n二重入力を減らすことが役立つという仮説には、回答者が感じる負担と、制度上の改善目標という手がかりがあります。ただし、一つの機能に絞った製品が既存製品より優れているかは測っていません。\n\n## 分からないこと・別に考えられる理由\n\n回答者の企業規模、職種、工種、地域に偏りがある可能性があります。二重管理を挙げた32.2%のうち、元請けが指定する書式が原因の人はどれほどいるか、まだ分かりません。実際の作業時間の短縮、継続利用率、支払額も未確認です。\n\n## 次に確かめたいこと\n\n同じ現場で、転記回数、作業全体の時間、ミス、継続利用を測り、既存製品の機能を使った場合と比べます。新しい道具を使うことで作業が増えるなら、負担軽減に役立つという仮説は弱まります。\n\n## 出典\n\n（一次・実施主体の調査。標本の偏りに注意）現場TECH「施工管理DX実態調査」（2026年3月、n=426）https://kensetsu.gemba-tech.jp/research/survey-sekokanridx/\n\n（一次・実施主体の調査。標本の偏りに注意）現場TECH「施工管理アプリの導入実態調査2026」（2026年3月調査／同年5月公開、n=426）https://kensetsu.gemba-tech.jp/research/survey-sekokanriapps-2026/\n\n（二次・報道）ITmedia ビジネスオンライン、同調査の要約（2026年4月）https://www.itmedia.co.jp/business/articles/2604/03/news005.html\n\n（一次）国土交通省「工事施工中における受発注者間の情報共有システム機能要件（Rev.5.4）【解説編】」（令和4年3月）。改善目標(4)は二重入力を排除した帳票作成。帳票は土木工事共通仕様書の請負工事向け。https://www.mlit.go.jp/tec/content/001477217.pdf\n\n（一次）国土交通省「建設生産・管理システムのDXのためのデータマネジメントの取組方針（案）」（発注者責任を果たすための建設生産・管理システムのあり方懇談会 資料1、令和5年5月12日）。転記・再提出を現状の反例として列挙。https://www.nilim.go.jp/lab/peg/img/file2025.pdf\n\n（一次）国土技術政策総合研究所「工事関連の様式集」。令和5年4月1日以降、土木工事共通仕様書の請負工事の帳票様式は各地方整備局か国総研から取る、と案内。https://www.nilim.go.jp/lab/bcg/yousiki.html\n\n（一次）国土交通省関東地方整備局「『土木工事共通仕様書』を適用する請負工事に用いる標準様式」。統一様式ファイルはExcel。https://www.ktr.mlit.go.jp/gijyutu/index00000015.html\n\n（一次）国土交通省・総務省・財務省「令和6年度 入契調査」概要（調査時点は令和6年7月1日、公表は令和6年12月18日）。ASP導入の団体数と、国の完了工事の件数ベースの注記。https://www.mlit.go.jp/report/press/content/001855014.pdf 団体別の表は https://www.mlit.go.jp/report/press/content/001855015.pdf 公表ページは https://www.mlit.go.jp/report/press/tochi_fudousan_kensetsugyo13_hh_000001_00268.html\n\n## 確認状況\n\n保存した本文・分析と、以前の確認記録に基づく記事です。国内原稿の数値監査では、原典の該当ページを新たに読んだ記録はありません。元資料の該当箇所の再確認と、全ページの読了は未完了です。その後、海外事例とつなぐ原稿の作成時には、二重管理32.2%について、公開本文、質問4（Q4）の画像、調査概要を別途確認しています。個々の回答を再集計したわけではありません。\n", "proxy_map": false}, {"id": "jp-dental-ehr-rececon-gap.md", "title": "歯科電子カルテの導入率12%と41.5%は、調査の定義・対象・時期が違う", "summary": "厚生労働省の委託アンケート（2026年7月21日〜8月14日、回答4,209件）は、誰がいつ修正したかをシステム内で確認できる場合に限って「電子カルテ」と数えています。この定義での導入率は12%でした。診療報酬の請求書を作るコンピュータ（レセコン）のうち、カルテ作成支援機能付きのものだけを使う回答は51%、手書きも併用する回答は28%、手書きのみは9%です。\n\n別の支払基金アンケート（2026年6月5〜10日）では、導入状況を回答した歯科44,609施設のうち18,533施設が導入済みと答えました（41.5%）。未回答5,792施設を未導入として分母に加えると、参考値は36.8%になります。調査条件が違うため、12%から41.5%へ増えたとは読めません。", "text": "# 歯科電子カルテの導入率12%と41.5%は、調査の定義・対象・時期が違う\n\n分類：定義差・一時点の導入状況\n\n## 対象と期間\n\n厚生労働省の委託調査は2026年7月21日〜8月14日に実施され、4,209件の回答があります。社会保険診療報酬支払基金の調査は2026年6月5〜10日に実施され、歯科44,609施設が導入状況を回答しました。41.5%は導入済み18,533施設を44,609施設で割った値です。参考値の36.8%は、未回答の5,792施設も分母に加えて計算しています。\n\n## 調査で分かったこと\n\n厚生労働省の委託アンケート（2026年7月21日〜8月14日、回答4,209件）は、誰がいつ修正したかをシステム内で確認できる場合に限って「電子カルテ」と数えています。この定義での導入率は12%でした。診療報酬の請求書を作るコンピュータ（レセコン）のうち、カルテ作成支援機能付きのものだけを使う回答は51%、手書きも併用する回答は28%、手書きのみは9%です。\n\n別の支払基金アンケート（2026年6月5〜10日）では、導入状況を回答した歯科44,609施設のうち18,533施設が導入済みと答えました（41.5%）。未回答5,792施設を未導入として分母に加えると、参考値は36.8%になります。調査条件が違うため、12%から41.5%へ増えたとは読めません。\n\n## 設問と回答の方法\n\n委託調査は、修正履歴を確認できるかどうかで分類しています。円グラフの4区分は合計100%です。質問票、調査参加者の募集範囲・選び方、回答率の詳細は、このスライドでは確認できていません。支払基金の質問文も未確認なので、同じ修正履歴の条件を設けているとは仮定しません。\n\n## この結果から言えること\n\n12%と41.5%は、同じ定義で同じ対象を調べて食い違った数字ではありません。片方を「本当の電子カルテ」と呼ばず、それぞれの調査が何を数えたかを示します。また、12%の調査は41.5%の調査より後に行われているため、12%から41.5%への増加とも読めません。\n\n## 役立つ可能性と、まだ未確認のこと\n\n情報共有や転記の削減が役立つ可能性はありますが、効果は未確認です。政策で掲げた普及目標から、実際に購入した施設数は分かりません。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：歯科医師・歯科診療所職員\n\n費用を払う人：診療所・運営法人が候補。実際の支払主体、支援制度と自己負担の内訳は未確認\n\n現在の手段：レセコン、紙との併用、既存製品の改修\n\n## 分からないこと・別に考えられる理由\n\n標準仕様や普及支援の方針があっても、実際に移行した件数とは区別して読みます。費用、移行の失敗、日常利用、負担の削減は確認できていません。\n\n未回答の施設を未導入として計算した36.8%も、全国すべての施設を調べて得た割合とは断定できません。\n\n原典スライド下段の「未導入の理由」は、別の2025年11〜12月調査の1,048件が対象です。右側の導入動機は、2026年の4,209件を対象とした資料に基づきます。隣り合うグラフでも、すべて同じ回答者を調べた結果とは扱いません。\n\n## 次に確かめたいこと\n\n同じ定義で複数の時点を調べ、導入した施設数、実際に使う施設数、費用を確認します。電子カルテへの移行で負担が増えた事例も調べます。\n\n## 出典\n\n- （一次・政策・調査）厚生労働省「電子カルテ普及計画」（令和8年9月9日。支払基金アンケート2026年6月、歯科41.5%/36.8%。委託調査2026年7〜8月 n=4,209、電子カルテ12%・レセコン系79%。法的目標2030年末約100%。歯科向け概算要求54億円規模の記述）https://www.mhlw.go.jp/content/10808000/001748251.pdf\n- （二次・数値の再掲）MC Plus等による同資料の抜粋ページ（円グラフ内訳12%/51%/28%/9%の確認用）https://www.wic-net.com/material/document/25753/36\n- （一次・ダッシュボード）デジタル庁「電子処方箋の導入状況に関するダッシュボード」（薬局先行・医科/歯科は低め、という整理の入口）https://www.digital.go.jp/resources/govdashboard/electronic-prescription\n- （二次・報道だが法目標と整合）読売系報道「ほぼ全ての歯科医療機関、2030年までに電子カルテを導入へ」（2026年9月頃）※数値の根拠は上記厚労一次を優先\n\n以前の数値監査で確認した箇所：\n- 印刷13頁 支払基金表、印刷35頁 委託調査円グラフ・脚注。PDF 14,36頁。画像でも照合 14,36頁。https://www.mhlw.go.jp/content/10808000/001748251.pdf#page=14\n\n## 確認状況\n\n2026-10-16の数値監査では、対象となる公表集計表と脚注を読み、指定した図表を画像でも照合しています。個々の回答を集め直した再集計は行っていません。また、原典の全ページを読了したわけではありません。\n\n委託調査の元の質問票、回答者の募集範囲、抽出方法、回答率、支払基金の質問文は未確認です。個々の回答、回答しなかった施設の偏りを補正する処理、費用や役立った点の実証も確認できていません。\n", "proxy_map": false}, {"id": "jp-e-prescription-clinic-lag.md", "title": "電子処方箋を導入した施設の割合は約11か月で上昇。発行件数は別に確認", "summary": "電子処方箋を導入した施設の割合は、薬局で85.9%から91.4%、医科診療所で22.5%から31.2%、病院で16.1%から21.4%、歯科で6.4%から11.5%へ上がりました。\n\n2026年8月に登録された件数は、電子処方箋が約65万件、引換番号付きの紙処方箋が約1,410万件でした。", "text": "# 電子処方箋を導入した施設の割合は約11か月で上昇。発行件数は別に確認\n\n分類：施設導入増・登録利用\n\n## 対象と期間\n\n2025年9月と2026年8月を比較しています。導入率の分母は、保険資格をオンラインで確認する仕組みを導入した施設です。すべての医療機関・薬局を分母にしているわけではありません。\n\n## 調査で分かったこと\n\n電子処方箋を導入した施設の割合は、薬局で85.9%から91.4%、医科診療所で22.5%から31.2%、病院で16.1%から21.4%、歯科で6.4%から11.5%へ上がりました。\n\n2026年8月に登録された件数は、電子処方箋が約65万件、引換番号付きの紙処方箋が約1,410万件でした。\n\n## この結果から言えること\n\n電子処方箋を導入した施設の割合は、時系列で増えています。ただし、導入率と処方箋の登録件数は、数えているものが違います。導入率を全医療機関の割合とは読めず、2種類の登録件数から全処方箋に占める電子処方箋の割合も出せません。登録された2種類が、すべての処方箋を網羅しているとは限らないためです。\n\n## 役立つ可能性と、まだ未確認のこと\n\n転記の負担や重複投薬のリスクを減らす効果は、今回の2種類の登録件数だけでは測れません。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：医療機関・薬局の職員、患者\n\n費用を払う人：医療機関・薬局等が候補。実際の支払主体、支援制度と自己負担の内訳・額は未確認\n\n現在の手段：紙処方箋、引換番号付き紙、既存医療システム\n\n## 分からないこと・別に考えられる理由\n\n診療科・施設規模別の利用状況、システム改修費、補助後の自己負担額、患者が得た利点は未確認です。重複投薬などの警告が出た件数を、健康被害が減った件数とは数えません。\n\n## 次に確かめたいこと\n\n同じ施設群について、すべての処方箋の件数、電子で発行した件数、運用にかかる時間と費用を追います。導入が増えても電子発行が増えず、負担も減っていなければ、導入の効果についての評価を見直します。\n\n## 出典\n\n（一次・ダッシュボード）デジタル庁「電子処方箋の導入状況に関するダッシュボード」（最終更新2026年9月11日。施設別導入・利活用の入口）https://www.digital.go.jp/resources/govdashboard/electronic-prescription\n\n（一次・データ）同ページ配布「データテーブル（ZIP）」（2026年9月11日更新。全国・施設種別の月次導入率、電子/引換番号つき紙の登録数、調剤結果登録率など）https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/42e67f07-4d20-46e7-8774-eb5493db76dd/582a374c/20260911_resources_govdashboard_electronic_prescription_table.zip\n\n（一次・案内）厚生労働省「電子処方箋導入スターターキット」（医科診療所向け Vol.1.2、令和8年8月26日改訂。薬局導入90.3%・調剤結果登録85.4%などの提示）https://www.mhlw.go.jp/content/11120000/001716303.pdf\n\n（一次・政策経緯）厚生労働省「電子処方箋の普及・活用拡大に向けた対応状況」（令和7年9月時点の普及整理。薬局先行・医療機関は低め、という当時の整理）https://www.mhlw.go.jp/content/11121000/001569995.pdf\n\n（関連メモ）jp-dental-ehr-rececon-gap.md\n\n## 確認状況\n\n以前の数値監査では、公式の入口ページへアクセスし、保存メモの値を確認しています。過去のデータを収録したZIPファイル内の表・セルは再照合していません。原典の該当セルの再確認と、全ページの読了は未完了です。\n", "proxy_map": false}, {"id": "jp-food-store-ops-shortage.md", "title": "2023年度の飲食店店長の求人倍率は約10倍。管理ソフトの購入需要は未確認", "summary": "有効求人倍率は、飲食店店長が約10倍、接客が約5倍、調理が約2.9倍でした。これは、有効求職者数に対する有効求人数の比率です。\n\n民間調査では、何らかのデジタルツールを導入しているという回答は58.3%でした。会計と売上を記録するPOSレジは22.3%、オンライン発注は21.5%、予約管理は13.2%、シフト・勤怠管理は10.0%です。シフト・勤怠管理システムを導入した103人のうち、89.3%が何らかの効果を実感したと答えています。", "text": "# 2023年度の飲食店店長の求人倍率は約10倍。管理ソフトの購入需要は未確認\n\n分類：求人倍率・一時点の導入状況\n\n## 対象と期間\n\n求人倍率は、2025年公表の省力化プランが引用した令和5年度の値です。デジタルツールの調査は、2024年3月に飲食店経営者1,029人を対象として実施されました。\n\n## 調査で分かったこと\n\n有効求人倍率は、飲食店店長が約10倍、接客が約5倍、調理が約2.9倍でした。これは、有効求職者数に対する有効求人数の比率です。\n\n民間調査では、何らかのデジタルツールを導入しているという回答は58.3%でした。会計と売上を記録するPOSレジは22.3%、オンライン発注は21.5%、予約管理は13.2%、シフト・勤怠管理は10.0%です。シフト・勤怠管理システムを導入した103人のうち、89.3%が何らかの効果を実感したと答えています。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：飲食店経営者・店長・従業員\n\n費用を払う人：店・運営会社が候補。実際の支払主体、補助利用と自己負担は未確認\n\n現在の手段：紙、Excel、既存POS等の機能、業務分担の変更\n\n## この結果から言えること\n\n店長の求人倍率が高くても、不足している人数が調理職より多いとは言えません。また、店舗管理ソフトへの支出が増えたことも、この倍率からは分かりません。効果実感の89.3%は、シフト・勤怠管理システムを導入した人の自己申告です。\n\n## 役立つ可能性と、まだ未確認のこと\n\nシフト作成や発注の負担を減らすことが役立つ、という仮説があります。実際にどの作業がどれだけ減ったかは、別に確かめる必要があります。\n\n## 分からないこと・別に考えられる理由\n\n導入後も使い続けた割合、作業時間、未導入の理由、都市と地方・業態による違い、実際の支払額は未確認です。システムを導入していない店が、すべて紙で作業しているとは限りません。\n\n## 次に確かめたいこと\n\n求人数と求職者数、採用人数、賃金、離職を分けて追います。管理ソフトについては、導入前後の作業時間、継続利用、支払額を確認します。\n\n## 出典\n\n農林水産省・厚生労働省「省力化投資促進プラン ―飲食業―」（令和7年6月13日）https://www.cas.go.jp/jp/seisaku/atarashii_sihonsyugi/shouryokukatousi/01.pdf\n\n農林水産省「飲食店の未来を変える自動化・省力化ガイドブック」（省力化投資促進業界行動計画、令和8年2月公表）https://www.maff.go.jp/j/shokusan/gaisyoku/syoryokuka.html\n\n同プランが引用する厚生労働省「職業安定業務統計」、経済産業省「企業活動基本調査」等\n\n（民間調査。協会・公的統計ではない）株式会社リクルート／ホットペッパーグルメ外食総研「飲食店経営者のDXに対する興味・関心と導入状況の実態調査」（調査期間2024年3月8日〜12日、マクロミル登録モニター、有効回答1,029）。POSレジ導入済み22.3%、オンライン発注21.5%、予約管理13.2%、シフト・勤怠10.0%。シフト・勤怠の導入店103人のうち効果実感89.3%。https://www.recruit.co.jp/newsroom/pressrelease/assets/20240603_gourmet_01.pdf 掲載 https://www.hotpepper.jp/ggs/research/article/column/20240603\n\n（確認したが導入率の表は無し）一般社団法人日本フードサービス協会「統計・報告書」https://www.jfnet.or.jp/report-top/\n\n（続報。ツール別の導入済み割合は本文に無い）ホットペッパーグルメ外食総研「2025年度 飲食店経営者のDXに対する興味・関心と導入状況・効果の調査」（調査2025年3月10日〜14日、有効回答813、公開2025年7月3日）https://www.hotpepper.jp/ggs/research/article/column/20250703\n\n## 確認状況\n\n保存した本文・分析と、以前の確認記録に基づく記事です。国内原稿の数値監査では、原典の該当ページを新たに読んだ記録はありません。元資料の該当箇所の再確認と、全ページの読了は未完了です。その後、海外事例とつなぐ原稿の作成時には、効果実感89.3%について、公式記事と訂正版PDFの1・2・8頁を確認し、2・8頁は画像でも照合しています。個々の回答の再集計、別配信元PDFとの同一性の確認はしていません。求人倍率まで同じ確認済み表示にはしません。\n", "proxy_map": false}, {"id": "jp-gakudo-ict-halfway.md", "title": "回答した学童事業所の39.1%が業務支援システムを導入。機能別割合は導入済みだけ", "summary": "2024年9月2〜20日のオンライン調査では、回答した8,404事業所の39.1%（3,288事業所）が、業務を支援する情報機器・ソフト（ICT）を導入していました。\n\n導入済み3,288事業所に複数回答で使える機能を尋ねると、保護者連絡は77.6%、入退室管理は76.7%、欠席・遅刻の受付は74.9%、利用料・延長料の決済は14.4%でした。同じ3,288事業所に一つを選ぶ形式で自治体システムとの連携を尋ねたところ、連携ありは21.1%でした。\n\n別の保護者調査は2024年2月16日〜3月4日に実施されました。抽出した47自治体で、学童を利用中・利用予定の保護者5,392人に申込方法を一つ選んでもらったところ、窓口提出は77%、オンラインは17%でした。", "text": "# 回答した学童事業所の39.1%が業務支援システムを導入。機能別割合は導入済みだけ\n\n分類：回答事業所の導入・機能差\n\n## 対象と期間\n\n放課後児童クラブ（学童）の事業所調査は、2024年9月2〜20日に実施されました。導入率は回答した8,404事業所を分母にしています。機能別の割合と自治体システムとの連携率は、そのうち導入済みの3,288事業所が分母です。\n\n保護者調査は2024年2月16日〜3月4日に5,392人を対象に実施され、自治体の一次調査は2024年4月26日〜5月22日です。2025年3月は調査結果の公表月です。回収率32.6%は、2023年5月1日時点の総事業所数25,807に対する回答事業所数の割合です。\n\n## 調査で分かったこと\n\n2024年9月2〜20日のオンライン調査では、回答した8,404事業所の39.1%（3,288事業所）が、業務を支援する情報機器・ソフト（ICT）を導入していました。\n\n導入済み3,288事業所に複数回答で使える機能を尋ねると、保護者連絡は77.6%、入退室管理は76.7%、欠席・遅刻の受付は74.9%、利用料・延長料の決済は14.4%でした。同じ3,288事業所に一つを選ぶ形式で自治体システムとの連携を尋ねたところ、連携ありは21.1%でした。\n\n別の保護者調査は2024年2月16日〜3月4日に実施されました。抽出した47自治体で、学童を利用中・利用予定の保護者5,392人に申込方法を一つ選んでもらったところ、窓口提出は77%、オンラインは17%でした。\n\n## 設問と回答の方法\n\n導入の有無、自治体システムとの連携、保護者の申込方法は、一つを選ぶ設問です。導入している機能は、複数を選べる設問です。保護者の申込方法が一つを選ぶ形式であることは、元資料の図でも確認されています。\n\n## この結果から言えること\n\n決済14.4%と自治体連携21.1%の分母は、全事業所ではなく、ICT導入済みの3,288事業所です。保育の決済導入率15.0%は回答した16,709施設全体を分母としているため、そのまま大小を比べられません。保育と学童を比べるには、対象と機能をそろえる必要があります。\n\n## 役立つ可能性と、まだ未確認のこと\n\n学童の職員や保護者が、申込や日常連絡で同じ情報を何度も記入する手間を減らせる可能性があります。実際の効果は未確認です。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：学童職員、保護者、自治体担当者\n\n費用を払う人：自治体・運営者が候補。実際の支払主体、負担配分と実際の支払額は未確認\n\n現在の手段：紙申込、連絡帳、電話、既存の自治体システム\n\n## 分からないこと・別に考えられる理由\n\n放課後等デイサービスは、この調査の学童保育とは別の制度です。システムの利用頻度、短縮できた時間、実際の支払額、回答しなかった事業所の状態は確認できていません。予算の概算要求も、実際に採択された件数や支出額とは区別します。\n\n原典は、オンライン環境のない事業所が回答していない可能性を明記しています。そのため、導入率39.1%を、全国すべての事業所について確認した値とは断定できません。\n\n保護者の77%と17%は、別々の選択肢に対する丸め済みの割合です。二つを足した値も、事業所の導入率と比較するための数値ではありません。\n\n## 次に確かめたいこと\n\n同じ事業所を対象に、業務時間、連絡が届かなかった件数、継続利用、費用を追います。決済機能や自治体との連携を必要としていない事業所も調べます。\n\n## 出典\n\n- （一次・調査）こども家庭庁成育局成育環境課「放課後児童クラブのDX推進状況に関する調査結果」（令和7年3月。保護者n=5,392／自治体1,632／事業所回答8,404）https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/69799c33-85cb-44f6-8c70-08ed3a292ab5/0bdcddd8/20250307_policies_kosodateshien_houkago-jidou_58.pdf\n- （一次・政策）こども家庭庁「こども政策DXの推進に向けた取組方針2025」概要（放課後児童クラブDX・実証の記載）https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/6cfab22c-d2bf-4dd1-81ea-49308519ac3a/8f1fa020/20250630_councils_kodomo_seisaku_DX_6cfab22c_07.pdf\n- （一次・予算）こども家庭庁「【令和8年度】放課後児童対策・こども・子育て支援関連予算概算要求の概要」（DX推進実証0.5億円、ICT化推進・1箇所あたり50万円案など）https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/efa58163-4cc2-43d6-ba57-3df41d552a52/39e7d01f/20250901_policies_kosodateshien_budget_08.pdf\n\n以前の数値監査で確認した箇所：\n- PDF2頁 調査方法、3頁 保護者①、5頁 事業所①②④・回収率注。PDF 2,3,5頁。画像でも照合 3,5頁。https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/69799c33-85cb-44f6-8c70-08ed3a292ab5/0bdcddd8/20250307_policies_kosodateshien_houkago-jidou_58.pdf#page=2\n\n## 確認状況\n\n2026-10-16の数値監査では、対象となる公表集計表と脚注を読み、指定した図表を画像でも照合しています。個々の回答を集め直した再集計は行っていません。また、原典の全ページを読了したわけではありません。\n\n個々の回答、回答しなかった事業所の偏りを補正する処理、オンライン環境のない事業所の状態は未確認です。同じ事業所を追跡した結果、費用や役立った点の実証も確認できていません。\n", "proxy_map": false}, {"id": "jp-law-firm-ai-rules-lag.md", "title": "日弁連会員への調査では、生成AIの利用率と研修・ルールの整備率に差がある（原典再確認待ち）", "summary": "既存要約によると、生成AIを弁護士と事務職員の両方が使っているという回答は26.7%、弁護士だけが使っているという回答は43.4%でした。研修の実施やガイドラインの策定を済ませたという回答は10.1%、予定なしは41.2%です。生成AIへの懸念として、正確性を68.1%、セキュリティ・機密を63.2%が挙げています。", "text": "# 日弁連会員への調査では、生成AIの利用率と研修・ルールの整備率に差がある（原典再確認待ち）\n\n分類：限定標本の使用・体制\n\n## 対象と期間\n\n以下は既存要約に記された調査の対象・期間です。一次PDFの再確認は終わっていません。日本弁護士連合会（日弁連）の分科会資料にある、2026年3〜4月の調査です。有効回答は223件で、主に事務職員を雇用する会員、または生成AIに関心がある会員が対象です。全国の法律事務所を代表する調査ではありません。\n\n## 既存要約に記された回答（原典再確認待ち）\n\n既存要約によると、生成AIを弁護士と事務職員の両方が使っているという回答は26.7%、弁護士だけが使っているという回答は43.4%でした。研修の実施やガイドラインの策定を済ませたという回答は10.1%、予定なしは41.2%です。生成AIへの懸念として、正確性を68.1%、セキュリティ・機密を63.2%が挙げています。\n\n## この結果から言えること\n\n既存要約に記された回答では、調査に答えた日弁連会員の間で、生成AIの利用率と、研修・ルールを整えている割合に差があります。ただし、一時点の調査から、利用開始と体制整備のどちらが先だったかは分かりません。全国の普及率にも置き換えられません。\n\n## 役立つ可能性と、まだ未確認のこと\n\n弁護士や事務職員が、情報の正確さと機密を守りながら作業時間を減らすことに価値を感じる可能性があります。この調査は、ルールの雛形に料金を払う意思を測ったものではありません。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：弁護士・法律事務所の事務職員\n\n費用を払う人：事務所・利用者が候補。実際の支払主体、実際の支払額と追加料金は未確認\n\n現在の手段：既存の業務手順、無料ガイド、研修、専門AIと汎用AI\n\n## 分からないこと・別に考えられる理由\n\n分科会資料の内容を、日弁連全体の公式見解とは扱いません。会計事務所についてのベンダー調査も、回答者が異なる別の調査です。調査を行ったのが企業か協会かだけで信頼性を決めず、対象や設問、方法を確認する必要があります。\n\n## 次に確かめたいこと\n\n同じ法律事務所を追い、実際の利用状況、事故や回答の修正にかかった手間、作業時間、研修後の変化、支払額、継続利用を確認します。\n\n## 出典\n\n日本弁護士連合会「第24回弁護士業務改革シンポジウム 第2分科会資料」内「事務職員と生成AIに関するアンケート調査 報告書」（調査期間2026年3月23日〜4月27日、有効回答223件）。分科会資料であり日弁連見解ではない旨の注記あり https://www.nichibenren.or.jp/library/pdf/document/symposium/gyoukaku_sympo/24th_report_2.pdf\n\n裁判所「改正民訴法等で変わる民事訴訟手続の概要」（令和8年5月21日施行のオンライン申立て等）https://www.courts.go.jp/saiban/minjidejitaruka/minso_gaiyou/index.html\n\n（参考・二次）弁護士ドットコム「民事裁判IT化に向けた弁護士への意識調査2026年版」（2026年4月、会員弁護士301名）https://www.bengo4.com/corporate/news/article/xn0to2-8fmfr/\n\n（参考・ベンダー調査）株式会社ミロク情報サービス「会計事務所白書2026 生成AIの導入・活用に関する実態調査第3弾」（調査期間2026年7月10日〜31日、会計事務所212名／企業・事業主606名。利用率39%→75%、ルール未整備70%）https://prtimes.jp/main/html/rd/p/000000544.000018493.html ／ https://www.accnt.jp/report/2026\n\n（参考）日本税理士会連合会「税理士事務所のためのAI・クラウド活用ガイドライン」（2026年9月30日公表、会員向け）※本文は会員ページ。公表事実の確認に、税理士一瀬直のブログ要約を参照 https://naoripe.com/zeirishi-ai-guideline-reviewer/\n\n## 確認状況\n\n保存した本文・分析と、以前の確認記録に基づく記事です。国内原稿の数値監査では、原典の該当ページを新たに読んだ記録はありません。元資料の該当箇所の再確認と、全ページの読了は未完了です。一次PDFは取得できておらず、数値、対象、設問条件の照合と、個々の回答の再集計はしていません。\n", "proxy_map": false}, {"id": "jp-logistics-wait-report.md", "title": "物流の待ち時間と積み下ろし時間は制度上の計測対象。有料ソフトの購入増は未確認", "summary": "2025年度の調査では、トラック1運行当たりの荷待ち・荷役などの平均時間は2時間2分でした。荷待ちは積み下ろしを待つ時間、荷役は荷物を積み下ろす作業です。2025年度の平均時間は、比較対象となった以前の調査より約1時間16分短くなっています。比較対象の調査年度は、既存の確認記録から特定できていません。\n\n制度上は、一定規模以上の特定事業者に対し、中長期計画と定期報告の提出期限が定められています。", "text": "# 物流の待ち時間と積み下ろし時間は制度上の計測対象。有料ソフトの購入増は未確認\n\n分類：制度対応・荷待ち時間\n\n## 対象と期間\n\n2026年の制度について整理した既存メモと、2025年度の代表的な運行を調べた資料を使っています。制度の対象事業者と、運行調査の対象は分けて扱います。\n\n## 調査で分かったこと\n\n2025年度の調査では、トラック1運行当たりの荷待ち・荷役などの平均時間は2時間2分でした。荷待ちは積み下ろしを待つ時間、荷役は荷物を積み下ろす作業です。2025年度の平均時間は、比較対象となった以前の調査より約1時間16分短くなっています。比較対象の調査年度は、既存の確認記録から特定できていません。\n\n制度上は、一定規模以上の特定事業者に対し、中長期計画と定期報告の提出期限が定められています。\n\n## この結果から言えること\n\n計測や報告が制度上求められていることと、それに対応する有料ソフトが売れていることは別です。専用サービスが存在していても、購入が増えたとは限りません。運行調査で平均時間が短くなっていることも合わせて示します。\n\n## 役立つ可能性と、まだ未確認のこと\n\n担当者が時間を測り、集計し、報告書を作る負担を減らせる可能性があります。実際の負担軽減は未確認です。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：荷主、運送・倉庫事業者の担当者、運転者\n\n費用を払う人：対象事業者等が候補。誰が計測・報告費用を負担するか、実際の支払主体・額は未確認\n\n現在の手段：紙、Excel、既存の倉庫管理システム（WMS）、トラックの積み下ろし場所を予約するシステム、既存システムの報告機能\n\n## 分からないこと・別に考えられる理由\n\nこの記事は制度の履歴を整理したものです。各社が現在どの法的対応を必要とするかを確定する案内ではありません。対象になるか、いつまでに対応するかは、公式資料で個別に確認する必要があります。ソフトの利用状況、費用、待ち時間が改善した原因も未確認です。\n\n## 次に確かめたいこと\n\n既存の予約システムや表計算だけで対応できる事業者の割合と、追加の費用・作業時間を確認します。追加購入なしで対応できるなら、新しい専用製品を購入する需要があるという仮説は弱まります。\n\n## 出典\n\n（一次）国土交通省「物流効率化法」理解促進ポータル https://www.revised-logistics-act-portal.mlit.go.jp/\n\n（一次）同ポータル／定期報告（計測・サンプリング・報告省略） https://www.revised-logistics-act-portal.mlit.go.jp/regular-report/\n\n（一次）同ポータル／荷待ち・荷役等の算定方法 https://www.revised-logistics-act-portal.mlit.go.jp/method/\n\n（一次）同ポータル／荷主判断基準解説書 https://www.revised-logistics-act-portal.mlit.go.jp/files/pdf/sippers-judgment-criteria-book.pdf\n\n（一次）経済産業省「物流効率化法について」（様式第1〜5、対応の手引き、指定状況・リスト、判断基準解説） https://www.meti.go.jp/policy/economy/distribution/butsuryu-kouritsuka.html\n\n（一次）国土交通省説明資料「物流効率化法における特定事業者の指定の届出及び統括物流管理者の選任について」（指定基準・スケジュール） https://www.mlit.go.jp/jidosha/content/002005608.pdf\n\n（一次）国土交通省 報道発表「トラックドライバーの１運行当たりの平均拘束時間に関する調査結果の公表」（2025年度） https://www.mlit.go.jp/report/press/tokatsu02_hh_000084.html\n\n（一次）同上・調査結果PDF https://www.mlit.go.jp/report/press/content/002011131.pdf\n\n（二次・製品）ヨビトラ、Rentals荷待ち記録など、様式・計測寄せの公開説明（存在確認用。導入率の一次ではない）\n\n## 確認状況\n\n保存した本文・分析と、以前の確認記録に基づく記事です。国内原稿の数値監査では、原典の該当ページを新たに読んだ記録はありません。元資料の該当箇所の再確認と、全ページの読了は未完了です。\n", "proxy_map": false}, {"id": "jp-merihari-consumption.md", "title": "2026年7月の家計支出は宿泊・外食で増加。理由と継続性は未確認", "summary": "以前のメモには、消費支出全体は実質で前年同月比−3.6%、宿泊料は+24.5%、外食は+5.9%と記録されています。元メモには資料名だけがあり、元の統計表へ直接つながるURLはありません。今回の編集では、数値を元の統計表と照合していません。", "text": "# 2026年7月の家計支出は宿泊・外食で増加。理由と継続性は未確認\n\n分類：過去の単月観測\n\n## 対象と期間\n\n家計調査の2026年7月分で、二人以上の世帯が対象です。単身世帯の結果や、すべての消費者を合わせた市場総額ではありません。\n\n## 調査で分かったこと\n\n以前のメモには、消費支出全体は実質で前年同月比−3.6%、宿泊料は+24.5%、外食は+5.9%と記録されています。元メモには資料名だけがあり、元の統計表へ直接つながるURLはありません。今回の編集では、数値を元の統計表と照合していません。\n\n## この結果から言えること\n\n総支出と特定品目の支出が、ひと月の比較で違う方向に動いた記録として残します。継続的に伸びている需要の例には含めません。\n\n## 役立つ可能性と、まだ未確認のこと\n\n消費者が節約に疲れた、自分へのご褒美を求めた、体験を優先したという説明は、動機を測っていない仮説です。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：二人以上世帯の消費者\n\n費用を払う人：世帯\n\n現在の手段：他の消費、貯蓄、自宅での食事、日帰りなど（代替の実測なし）\n\n## 分からないこと・別に考えられる理由\n\n売り手側の最新分析には、売上が増えても客数は減った例などがあります。対象が違うため家計調査の結果を直接否定するものではありませんが、支出増を人数や購入量の増加と読み替えることはできません。\n\n## 次に確かめたいこと\n\n同じ対象について、直近12か月の支出、人数・数量、価格、消費者の動機を調べた結果をそろえます。価格、購入品目の構成、前年の低い水準で支出増を説明できるなら、利用量も増えたという主張は弱まります。\n\n## 出典\n\n総務省統計局「家計調査報告」2026年7月分（2026年9月4日公表）\n\n同発表を伝える報道（宿泊・外食の伸び、調理食品・飲料の減少）\n\n## 確認状況\n\n保存した本文・分析と、以前の確認記録に基づく記事です。国内原稿の数値監査では、原典の該当ページを新たに読んだ記録はありません。元資料の該当箇所の再確認と、全ページの読了は未完了です。\n", "proxy_map": false}, {"id": "jp-nursery-ict-halfway.md", "title": "保育の業務支援システムは機能によって導入率が違う。未導入の理由は未確認", "summary": "2024年9月11日〜10月25日の調査で、活動中の認可保育所など16,709施設から有効回答がありました。何らかの保育ICTを導入した施設は84.4%、補助対象の4機能を一つ以上導入した施設は80.8%、4機能すべてを導入した施設は11.7%でした。\n\n全回答施設を分母に、機能ごとに複数回答で集計した導入率は、保護者連絡が71.5%、登降園管理が71.3%、計画・記録が55.4%、キャッシュレス決済が15.0%です。問9①に回答しなかった施設も分母に含みます。これらは導入の有無を示す値で、日々の利用率や増加率ではありません。\n\n活用状況を尋ねた別の設問（問9②）では、同じ16,709施設を分母にすると、何らかの機能を活用している割合は82.7%、4機能すべてを活用している割合は7.1%でした（図表106）。これは施設の自己申告を別に集計した結果で、導入率から推定したものではありません。", "text": "# 保育の業務支援システムは機能によって導入率が違う。未導入の理由は未確認\n\n分類：2024年の機能導入状態\n\n## 対象と期間\n\n調査期間は2024年9月11日〜10月25日です。導入率の分母は、問9①に回答しなかった施設も含めた、有効回答16,709施設です。情報機器・ソフトを使う保育業務支援を、ここでは「保育ICT」と呼びます。「何らかの導入」は、10機能またはその他のICTを一つ以上導入したことを指します。導入済み施設だけを分母にした率ではありません。報告書は2025年3月にまとめられ、ウェブには同年5月に公開されました。\n\n## 調査で分かったこと\n\n2024年9月11日〜10月25日の調査で、活動中の認可保育所など16,709施設から有効回答がありました。何らかの保育ICTを導入した施設は84.4%、補助対象の4機能を一つ以上導入した施設は80.8%、4機能すべてを導入した施設は11.7%でした。\n\n全回答施設を分母に、機能ごとに複数回答で集計した導入率は、保護者連絡が71.5%、登降園管理が71.3%、計画・記録が55.4%、キャッシュレス決済が15.0%です。問9①に回答しなかった施設も分母に含みます。これらは導入の有無を示す値で、日々の利用率や増加率ではありません。\n\n活用状況を尋ねた別の設問（問9②）では、同じ16,709施設を分母にすると、何らかの機能を活用している割合は82.7%、4機能すべてを活用している割合は7.1%でした（図表106）。これは施設の自己申告を別に集計した結果で、導入率から推定したものではありません。\n\n## 設問と回答の方法\n\n導入状況を尋ねる問9①は、複数を選べる設問です。補助対象の4機能は、登降園管理、保護者連絡、計画・記録、キャッシュレス決済です。\n\n## この結果から言えること\n\nこの調査は一時点の導入状況を示しており、増加率は分かりません。4機能は補助制度が定めた組合せです。4機能が全部そろっていない施設は88.3%ですが、そのすべてが、未導入の機能を必要としているとは限りません。\n\n## 役立つ可能性と、まだ未確認のこと\n\n職員の二重入力や手書きを減らせる可能性があります。ただし、聞き取りで得た個別施設の経験を、全国で実現した時間短縮とは扱いません。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：保育職員・事務職員、保護者、自治体担当者\n\n費用を払う人：運営法人・自治体が候補。補助と自己負担、実際の支払額は未確認\n\n現在の手段：紙、手書き、既存の保育ICT、自治体の給付・徴収システム\n\n## 分からないこと・別に考えられる理由\n\nキャッシュレス決済が必要か、誰が料金を徴収するか、手数料はいくらかは、追加の確認が必要です。記録に基づく実際の利用状況、運用全体で短縮できた時間、料金を払う意思も確認できていません。\n\n調査対象は、認可保育所、地域型保育事業所、保育所型認定こども園、幼保連携型認定こども園です。認可外施設などを含む全国すべての園の結果には広げません。\n\n調査は主にウェブで実施し、郵送でも回答できる方式でした。郵送の回答は500件です。参考回収率43.7%は、公表施設数を参照した値です。\n\nこれまで出典として記していたPDF7頁（印刷頁3頁）の図表102は、表の再掲箇所です。元の表はPDF104頁（印刷頁100頁）にあります。\n\n学童保育の決済機能の導入率14.4%は、何らかのシステムを導入した事業所だけを分母とするため、この調査の15.0%とは直接比較できません。年間の運用費を尋ねた自己申告の表もあり、導入済み14,109施設が対象です。ただし、以前の数値監査で確認したのは表の所在と抽出した文字までで、画像との照合、請求書、実際の決済記録の確認はしていません。\n\n## 次に確かめたいこと\n\n同じ施設で、紙への記入・転記の回数と作業全体の時間、保護者や自治体とデータをやり取りできる範囲、継続費用を測ります。既存機能で十分な施設や、決済機能を必要としていない施設も比べます。\n\n## 出典\n\n（一次・調査）こども家庭庁委託・三菱UFJリサーチ＆コンサルティング「保育施設等におけるICT導入状況等に関する調査研究事業 報告書」（調査2024年9月11日〜10月25日、有効16,709施設、参考回収率43.7%）https://www.murc.jp/wp-content/uploads/2025/05/koukai_250515_01.pdf\n\n（一次・政策）こども家庭庁「こども政策DXの推進に向けた取組方針2025について」（令和7年6月30日、資料3-1）https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/6cfab22c-d2bf-4dd1-81ea-49308519ac3a/c84318d1/20250707_councils_kodomo_seisaku_DX_6cfab22c_09.pdf\n\n（一次・政策）こども家庭庁「保育DXの推進による業務改善」（保育政策資料、2026年4月時点の庁内資料系）https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/e4b817c9-5282-4ccc-b0d5-ce15d7b5018c/dabfd184/20260401_policies_hoiku_214.pdf\n\n導入率の原典該当箇所：報告書印刷3頁／PDF7頁、図表102。https://www.murc.jp/wp-content/uploads/2025/05/koukai_250515_01.pdf#page=7\n\n以前の数値監査で確認した箇所：\n- 印刷3頁/4頁 図表102/104再掲、印刷21頁 調査概要、35頁 図表18、100頁 図表102、102頁 図表104。PDF 7,8,25,39,104,106頁。画像でも照合 7,25,39,104,106頁。https://www.murc.jp/wp-content/uploads/2025/05/koukai_250515_01.pdf#page=7\n\n活用は別設問・図表106（印刷104頁／PDF108頁）を画像でも照合：https://www.murc.jp/wp-content/uploads/2025/05/koukai_250515_01.pdf#page=108\n費用の自己申告は図表36（印刷54頁／PDF58頁、導入施設14,109）。所在と抽出した文字のみ確認し、画像との照合はしていません。参照箇所：https://www.murc.jp/wp-content/uploads/2025/05/koukai_250515_01.pdf#page=58\n\n## 確認状況\n\n2026-10-16の数値監査では、対象となる公表集計表と脚注を読み、指定した図表を画像でも照合しています。個々の回答を集め直した再集計は行っていません。また、原典の全ページを読了したわけではありません。\n\n原典の全293頁、個々の回答、回答しなかった施設の偏りを補正する処理、同じ施設を追跡した結果は未確認です。時間短縮の原因、請求書、実際の決済記録も確認できていません。費用の表は所在と抽出した文字だけを確認しており、画像との照合は行っていません。\n", "proxy_map": false}, {"id": "jp-phone-daily-stack.md", "title": "日本でTikTok・Instagramを使う人の割合は、2020〜2025年度に増加", "summary": "2020年度から2025年度にかけて、「利用している」と答えた人の割合は、TikTokで14.9%から36.7%、Instagramで36.1%から54.8%、LINEで83.8%から92.9%、Xで36.3%から44.7%、YouTubeで77.0%から81.5%へ上がりました。Facebookは28.0%から27.0%へ下がっています。\n\n13〜79歳の調査対象者について、利用しない人も含めたネット動画全体の1日平均利用時間は、2024年度から2025年度にかけて、平日が68.97分から76.12分、休日が97.94分から104.58分へ増えました。", "text": "# 日本でTikTok・Instagramを使う人の割合は、2020〜2025年度に増加\n\n分類：利用率時系列・順位の補助観測\n\n## 対象と期間\n\n総務省の13〜79歳を対象とした調査を使っています。過去の年度も70代を含めて集計し直した数値で比較しています。アプリのランキングは、別の時点に観測したものです。\n\n## 調査で分かったこと\n\n2020年度から2025年度にかけて、「利用している」と答えた人の割合は、TikTokで14.9%から36.7%、Instagramで36.1%から54.8%、LINEで83.8%から92.9%、Xで36.3%から44.7%、YouTubeで77.0%から81.5%へ上がりました。Facebookは28.0%から27.0%へ下がっています。\n\n13〜79歳の調査対象者について、利用しない人も含めたネット動画全体の1日平均利用時間は、2024年度から2025年度にかけて、平日が68.97分から76.12分、休日が97.94分から104.58分へ増えました。\n\n## この結果から言えること\n\nTikTokなどの利用者割合と、ネット動画全体の平均利用時間は増えています。ただし、この時間はTikTokだけ、あるいは短い動画だけを測った値ではありません。アプリの順位からは、使う頻度や、今後利用が広がる余地までは判断できません。\n\n## 役立つ可能性と、まだ未確認のこと\n\n楽しめることや、都合のよい時間に見られることが利用の理由かもしれません。ただし、利用率だけでは動機や満足度は分かりません。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：13〜79歳の調査対象者\n\n費用を払う人：利用者と広告主は別。ここでは支払額を測っていない\n\n現在の手段：他のSNS、娯楽、テレビ、対面での活動。これらからネット動画へ使う時間が移ったか、その量は測っていません。\n\n## 分からないこと・別に考えられる理由\n\n無料アプリの順位、新規ダウンロード数、利用時間、売上は、それぞれ別の指標です。年代別・地域別の変化や、動画制作ツールに料金を払う需要は未確認です。\n\n## 次に確かめたいこと\n\n定義をそろえて、年代別の利用割合、利用時間、支出を追います。順位だけが上がった場合や、話題が落ち着くと利用が続かない場合は、継続的な需要があるという判断は弱まります。\n\n## 出典\n\n総務省情報通信政策研究所「令和7年度情報通信メディアの利用時間と情報行動に関する調査報告書（概要）」（令和8年6月）の経年グラフ（主なソーシャルメディア系サービス／アプリ等の利用率、主なメディアの平均利用時間）。利用率は、アンケートで「自分が利用している」と答えた人の割合。https://www.soumu.go.jp/main_content/001079136.pdf\n\nGoogle Play 日本・無料アプリランキング（2026年9月7日前後の観測）\n\nApp Store 日本・無料週次の観測（〜2026年9月6日）\n\n## 確認状況\n\n保存した本文・分析と、以前の確認記録に基づく記事です。国内原稿の数値監査では、原典の該当ページを新たに読んだ記録はありません。元資料の該当箇所の再確認と、全ページの読了は未完了です。\n", "proxy_map": false}, {"id": "jp-reuse-quality-trust.md", "title": "中古市場の金額は増加。保証への意向は既存要約にあり、原典再確認待ち", "summary": "業界紙は、2024年の中古市場を3兆2,628億円、前年比+4.5%と推計しています。事業者が消費者に売る取引（BtoC）は+6.9%、個人同士の取引（CtoC）は+1.4%でした。\n\n以下の保証への意向は既存要約に基づき、一次記事の数値・設問の分母・保証条件は再確認待ちです。別の調査では、中古を習慣的に、または時々買う人のうち、プロの保証があれば高額品を買ってもよいと答えた割合は、スマホなどで51.7%、高額バッグで51.2%でした。保証付き商品の売場が新たに始まった記録もあります。", "text": "# 中古市場の金額は増加。保証への意向は既存要約にあり、原典再確認待ち\n\n分類：価格変動を調整していない市場規模の推計・意向・供給開始\n\n## 対象と期間\n\n中古市場の規模は2024年の推計です。保証への意向は、メルカリが2026年5月に20〜60代の1,040人を対象に行った調査を参照しています。保証への意向の対象・期間は既存要約の記載で、一次記事の再確認待ちです。\n\n## 調査で分かったこと\n\n業界紙は、2024年の中古市場を3兆2,628億円、前年比+4.5%と推計しています。事業者が消費者に売る取引（BtoC）は+6.9%、個人同士の取引（CtoC）は+1.4%でした。\n\n以下の保証への意向は既存要約に基づき、一次記事の数値・設問の分母・保証条件は再確認待ちです。別の調査では、中古を習慣的に、または時々買う人のうち、プロの保証があれば高額品を買ってもよいと答えた割合は、スマホなどで51.7%、高額バッグで51.2%でした。保証付き商品の売場が新たに始まった記録もあります。\n\n## この結果から言えること\n\n市場金額の増加、販売経路ごとの伸びの差、保証への期待、売場の開設は、それぞれ別の情報です。保証が市場の成長を引き起こしたという因果関係は確認できていません。\n\n## 役立つ可能性と、まだ未確認のこと\n\n既存要約には、安心して中古品を買いたいという意向が記されています。回答条件を原典で再確認する必要があります。ただし、保証によって実際の購入が増えるかは、まだ仮説です。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：中古商品の購入者\n\n費用を払う人：購入者、販売事業者、売場運営者が、費用を負担する候補です。サービス条件に書かれた負担と、実際の負担は区別します。商品価格に上乗せされた額や、実際の支払額は未確認です。\n\n現在の手段：新品、個人間取引、保証なし中古、修理・買替え延期\n\n## 分からないこと・別に考えられる理由\n\n市場の増加には、価格、売れた品目の構成、店舗数、海外向け販売なども影響し得ます。業界紙の市場推計と環境省の消費者購入額は、対象範囲が違います。保証付き売場の実売上や、保証の有無による成約率・返品・再購入の違いは未確認です。\n\n## 次に確かめたいこと\n\n品目や価格などの条件をそろえ、保証がある商品とない商品の購入実績や再購入を比べます。保証以外の要因で増収を説明できるなら、保証が成長を引き起こしたという仮説は弱まります。\n\n## 出典\n\nメルカリ「物価高とリユース活用に関する意識・実態調査」（2026年5月20〜21日、本調査20〜60代1,040人、2026年7月14日発表）https://about.mercari.com/press/news/articles/20260714_research/\n\nメルカリ「m department」提供開始の発表（2026年7月14日、出店88社、180日動作保証、2027年初頭に買取開始予定）https://www.jiji.com/jc/article?g=prt\u0026k=000000555.000026386\n\nメルカリ「あんしん鑑定サービスの概要」（鑑定料はカテゴリー別に購入者が負担、10万円以上は無料）https://help.jp.mercari.com/guide/articles/1499/\n\nメルカリ「あんしん鑑定」案内ページ（2026年9月4日以降、ファッション・スニーカー・トレカの10万円以上は無料）https://campaign.jp.mercari.com/pages/item_authentication/index.html\n\nリユース経済新聞「リユース業界の市場規模推計2025（2024年版）」（2025年9月26日、3兆2,628億円・前年比4.5%増）https://www.recycle-tsushin.com/news/detail_11719.php\n\nリユース経済新聞社「リユース市場データブック2025」発刊の発表（BtoC前年比6.9%増、CtoC前年比1.4%増）https://prtimes.jp/main/html/rd/p/000000005.000167741.html\n\n環境省「令和6年度リユース市場規模調査報告書（概要版）」（2024年の消費者購入ベース約3兆5千億円、購入先と品目の内訳）https://www.env.go.jp/content/000321557.pdf\n\nスマホ上位に並ぶ生活インフラの話は jp-phone-daily-stack.md で扱う。\n\n## 確認状況\n\n保存した本文・分析と、以前の確認記録に基づく記事です。国内原稿の数値監査では、原典の該当ページを新たに読んだ記録はありません。元資料の該当箇所の再確認と、全ページの読了は未完了です。保証への意向を扱う一次記事は取得できておらず、数値、設問の分母、保証条件は再確認待ちです。この留保を、市場規模の推計まで一括して適用してはいません。\n", "proxy_map": false}, {"id": "jp-waste-emanifest-catchup.md", "title": "産業廃棄物の電子記録は加入者数・登録件数とも増加。重量の割合は固定の分母で計算", "summary": "電子マニフェストの加入者数は323,812者から356,593者へ約10.1%増え、年間登録件数は約4,347万件から4,751万件へ約9.3%増えました。\n\n2025年度の捕捉率は約66.5%です。これは、2021年度の委託処理量を基に固定した160,000千t（1.6億トン）を分母とし、電子記録で把握した約106,468千tを分子とする割合です。", "text": "# 産業廃棄物の電子記録は加入者数・登録件数とも増加。重量の割合は固定の分母で計算\n\n分類：電子登録件数・固定した比較用重量に対する電子記録の把握割合\n\n## 対象と期間\n\n産業廃棄物の委託処理の流れを電子で記録する「電子マニフェスト」が対象です。2024年度と2025年度を比較しています。以前のメモで「直近1年」とした期間は、2025年9月〜2026年8月です。\n\n## 調査で分かったこと\n\n電子マニフェストの加入者数は323,812者から356,593者へ約10.1%増え、年間登録件数は約4,347万件から4,751万件へ約9.3%増えました。\n\n2025年度の捕捉率は約66.5%です。これは、2021年度の委託処理量を基に固定した160,000千t（1.6億トン）を分母とし、電子記録で把握した約106,468千tを分子とする割合です。\n\n## この結果から言えること\n\n電子マニフェストへの加入者数と登録件数は増えています。ただし、登録件数、廃棄物の重量、加入者数は別の指標です。廃棄物の発生量や、関連ソフトへの支出が増えたことを示す値ではありません。登録件数には予約登録も含まれます。\n\n## 役立つ可能性と、まだ未確認のこと\n\n処理の流れを追いやすくし、記録する負担を減らせる可能性があります。ただし、捕捉率だけでは利用者がどの程度助かったかは分かりません。\n\n## 利用する人・費用を払う人・現在の手段\n\n利用する人：排出・収集運搬・処分事業者の担当者\n\n費用を払う人：各契約主体。周辺サービスの実際の支払額は未確認\n\n現在の手段：紙の管理票、電子マニフェストシステム（JWNET）、既存の産業廃棄物管理システム\n\n## 分からないこと・別に考えられる理由\n\n捕捉率の分母を固定しているため、その年に実際に委託した量に対する割合とは違います。業種別の登録件数が多くても、その業種の廃棄物が重いとは言えません。以前の直近1年の値4,915万件は元の期間と一緒に残し、別の期間の4,949.1万件に説明なく置き換えません。\n\n## 次に確かめたいこと\n\n固定した比較用の重量と、その年の実際の委託量を区別します。そのうえで、電子登録や紙との併用にかかる作業時間、費用、継続利用を追います。加入者が増えただけでは、関連する有料サービスの需要があるとは判断しません。\n\n## 出典\n\n（一次・統計）公益財団法人日本産業廃棄物処理振興センター「電子マニフェスト統計情報」（※2026年6月更新、2025年度捕捉率約66.5%、加入約35.7万、登録約4,751万件）https://www.jwnet.or.jp/jwnet/about/assets/files/2025jwnet_toukei.pdf\n\n（一次・統計・前年）同「電子マニフェスト統計情報」（2024年度版、捕捉率約64.5%）https://www.jwnet.or.jp/jwnet/about/assets/files/2024jwnet_toukei.pdf\n\n（一次・指標説明）電子マニフェスト「捕捉率・登録件数」https://www.jwnet.or.jp/jwnet/about/regist/\n\n（一次・事業）JWセンター「令和5年度事業報告」（建設業・がれき類を重点普及対象とする記述）https://www.jwnet.or.jp/center/assets/files/r5_houkoku.pdf\n\n（二次・報道だが数値はJW一次と整合）環境新聞オンライン「電子マニフェスト加入者が35万6593者に」（2025年度＋10.1%、捕捉率速報66.8%、建設・がれきへの普及方針）https://www.kankyo-news.co.jp/news/b087806f-082c-4e3c-87b0-1042ef1fc0f8\n\n重量の該当頁：https://www.jwnet.or.jp/jwnet/about/assets/files/2025jwnet_toukei.pdf#page=5\n\n## 確認状況\n\n以前の原典監査では、JWNETの捕捉率の定義と、2025年度統計のPDF5頁を確認しています。この日本語改稿では、資料の再取得はしていません。原典の全ページと、周辺ソフトに実際に支払った金額は未確認です。\n", "proxy_map": false}], "themes": [{"id": "1", "title": "TikTok・Instagramの利用割合と、ネット動画の視聴時間が増加", "label": "TikTok・Instagramの利用割合と、ネット動画の視聴時間が増加", "classification": "利用率・時間", "text": "日本の13〜79歳を対象にした調査では、TikTokを利用する人の割合は2020年度の14.9%から2025年度の36.7%へ、In 、クラウド型アプリが8.5%でした。二重管理32.2%は課題の回答で、作業時間ではない\n- 実利用：主手段の自己申告あり。ログによる頻度や継続利用は未確認\n- 時間短縮：同条件の導入前後の実測は未確認\n- 支払い：有料契約額・更新率・追加購入意思は未確認\n- 対象範囲：特定のネット調査。公共工事の情報共有システム機能要件は別証拠で、民間工事すべてに一般化しない\n- 限界：同じ426人調査の別記事・転載を独立した裏付けにしない。二重管理のうち発注者様式に由来する割合は未確認\n- 代替：Excel、自動転記、既存施工管理アプリの連携、発注者の情報共有システム、提出手順の整理\n- 判断が変わる条件：同じ現場で入力回数と総作業時間、ミス、継続、費用を比較。既存機能だけで負担が解消する場合、新製品購入の仮説は弱まる\n- 役立つという見方を、どこまで確かめたか：二重入力を負担とする回答があります。追加の製品によってその負担を減らせるかは、まだ仮説です。\n\n原調査：https://kensetsu.gemba-tech.jp/research/survey-sekokanridx/ 、同一調査の別記事：https://kensetsu.gemba-tech.jp/research/survey-sekokanriapps-2026/\n公共工事の原典：https://www.mlit.go.jp/tec/content/001477217.pdf （Rev.5.4、改善目標4。今回該当ページを特定して読む作業は未実施）、https://www.nilim.go.jp/lab/peg/img/file2025.pdf （2023年5月12日資料1。二度入力しない原則は既存監査を継承）。\n\n## 保育\n- 利用者：保育職員・事務職員、保護者、自治体担当者\n- 支払者：運営法人・自治体が候補。補助と自己負担の内訳は未確認\n- 観測：2024年9〜10月の調査で、16,709施設から有効回答がありました。何らかの業務支援システム（ICT）を導入した割合は84.4%、補助対象の4機能すべてを導入した割合は11.7%でした。聞き取りでは、紙・手書きの作業や、行政のシステムと連携していない事例も報告されています。\n- 実利用：機能導入率と日常の利用頻度は別。本比較では実利用の同条件時系列を未確認\n- 時間短縮：転記を含めた総作業時間の同条件前後比較は、この比較で読んだ箇所では確認できていません。報告書全体に効果の章があるため、「資料に効果情報が存在しない」とは言わない\n- 支払い：費用や負担について報告書全体を未読。料金を払って使い続けた実績や、追加で購入した実績は本比較で未確認\n- 対象範囲：回答施設の一時点の状態。参考回収率43.7%。認可外等への一般化に注意\n- 限界：4機能が全部そろっていない園のすべてが、不足を感じているとは限らない。キャッシュレスの必要性は徴収主体や料金制度によって異なる\n- 代替：既存保育ICTの連携、自治体側の様式・手順変更、紙運用、自治体による徴収\n- 判断が変わる条件：同じ園で転記回数と総作業時間、保護者・自治体の負担、継続費用を比較。新機能が不要な園や既存機能で足りる園も含める\n- 役立つという見方を、どこまで確かめたか：負担軽減は仮説。個別ヒアリングを全国の効果として扱わない\n\n原典：https://www.murc.jp/wp-content/uploads/2025/05/koukai_250515_01.pdf#page=7 （印刷3頁／PDF7頁、図表102と機能別説明を再確認）。対象・調査方法は印刷21–22頁。全293頁は未読（unread）。\n\n## ケアプラン\n- 利用者：ケアマネジャー、訪問・通所等のサービス事業所の職員\n- 支払者：ライセンスの契約主体は事業所。無料期間と制度支援が重なる。有料継続の実際の支払額は未確認\n- 観測：全国の対象事業所数を分母に、有効ライセンス数を使って算出した導入率が2025年5月末5.3%→2026年7月末53.1%。約14か月の導入増\n- 実利用：全国の送受信量・実際に利用している事業所の割合は未確認。9事業所の実証では、事業所ごとの「システム利用率」の平均が約4割と報告されています。全国平均ではありません。何を分母とした割合かは、既存の確認記録から特定できていません。\n- 時間短縮：居宅介護支援9事業所で、導入前後の月平均作業時間を比べた速報値です。導入前は実績確認5.06時間と入力10.56時間で、合計15.62時間でした。導入後は確認3.41時間、入力2.67時間、新たな連携作業3.03時間で
